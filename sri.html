<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Stanbox Smart Readiness Indicator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: één zwevend paneel op de stadsfoto (zoals het WEii-dashboard): vaste kopregel, scrollende inhoud, vier stappen als tabs. */
:root{
  --cream:#faf7f1;--white:#ffffff;--border:#ebe4d6;--border2:#d6cbb6;
  --text:#14213d;--text2:#46506a;--text3:#8a8576;
  --navy:#14213d;--sand:#e9b25a;--sand-d:#d4963a;--sand-l:#f3cf8a;
  --accent:var(--navy);--accent-s:rgba(20,33,61,.06);--accent-b:rgba(20,33,61,.2);--on-accent:#ffffff;--hi:#d4963a;--hi-s:rgba(233,178,90,.18);
  --green:#1a6e3c;--green-s:rgba(26,110,60,.08);--green-b:rgba(26,110,60,.2);
  --red:#b91c1c;--red-s:rgba(185,28,28,.07);--red-b:rgba(185,28,28,.18);
  --amber:#9a5b00;--amber-s:rgba(176,108,0,.09);
  --neutral-s:#f1ece2;--shadow-soft:rgba(20,33,61,.07);--shadow-card:rgba(20,33,61,.12);
  --k-a:#14213d;--k-b:#2c4a73;--k-c:#56789b;--k-d:#a08a5f;--k-e:#cc9640;--k-f:#cf7535;--k-g:#b9472a;
  /* certificaat = document: altijd licht */
  --cert-bg:#ffffff;--cert-ink:#14213d;--cert-ink2:#5a6378;--cert-line:#e8e1d3;--cert-soft:#f7f2e8;--cert-navy:#14213d;--cert-sand:#e9b25a;--cert-sand-d:#d4963a;
  --sans:'Quicksand',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:10px;--r-sm:7px;
  color-scheme:light;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;background:var(--cream);color:var(--text);}
body{font-family:var(--sans);font-size:15px;line-height:1.6;font-weight:400;}
button,select,input,textarea{font-family:var(--sans);font-size:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
strong,b{font-weight:600;color:var(--text);}
a{color:var(--accent);}
p{color:var(--text2);margin-bottom:10px;}
h2,h3{text-wrap:balance;}

.bg-photo{position:fixed;inset:0;z-index:0;pointer-events:none;background:#14213d url(data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxNjAwIDkwMCIgcHJlc2VydmVBc3BlY3RSYXRpbz0ieE1pZFlNYXggc2xpY2UiPjxkZWZzPjxsaW5lYXJHcmFkaWVudCBpZD0iZyIgeDE9IjAiIHkxPSIwIiB4Mj0iMCIgeTI9IjEiPjxzdG9wIG9mZnNldD0iMCIgc3RvcC1jb2xvcj0iIzFiMmM1MCIvPjxzdG9wIG9mZnNldD0iMSIgc3RvcC1jb2xvcj0iIzEwMWEzMSIvPjwvbGluZWFyR3JhZGllbnQ+PC9kZWZzPjxyZWN0IHdpZHRoPSIxNjAwIiBoZWlnaHQ9IjkwMCIgZmlsbD0idXJsKCNnKSIvPjxwYXRoIGQ9Ik0wIDYxMCBDMjIwIDU0MCA0MjAgNTMwIDY0MCA1OTAgQzg2MCA2NTAgMTA2MCA2NDAgMTI2MCA1NzAgQzE0MDAgNTIwIDE1MDAgNTIwIDE2MDAgNTQ1IFY5MDAgSDAgWiIgZmlsbD0iI2U5YjI1YSIgZmlsbC1vcGFjaXR5PSIuMTQiLz48cGF0aCBkPSJNMCA3MDAgQzI2MCA2NTAgNDcwIDY2MCA3MDAgNzE1IEM5MzAgNzcwIDExNTAgNzYwIDEzNjAgNzAwIEMxNDYwIDY3MiAxNTQwIDY2OCAxNjAwIDY3NiBWOTAwIEgwIFoiIGZpbGw9IiNkNDk2M2EiIGZpbGwtb3BhY2l0eT0iLjIiLz48cGF0aCBkPSJNMCA4MDAgQzMwMCA3NjAgNTIwIDc3NSA3NjAgODA1IEMxMDAwIDgzNSAxMjQwIDgzMCAxNjAwIDc4MCBWOTAwIEgwIFoiIGZpbGw9IiNmM2NmOGEiIGZpbGwtb3BhY2l0eT0iLjEyIi8+PC9zdmc+Cg==) center bottom/cover no-repeat;}
.app-shell{height:100%;display:flex;flex-direction:column;position:relative;z-index:1;}
.page-card-wrap{flex:1;min-height:0;display:flex;padding-block:14px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));}
.page{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;max-width:1000px;margin:0 auto;width:100%;background:var(--cream);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden;}
.topbar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:nowrap;padding:16px 30px;border-bottom:1.5px solid var(--border);}
.logo{display:flex;align-items:center;gap:12px;min-width:0;flex:1;}
.logo{gap:16px;}
.logo .wm{height:34px;width:auto;flex-shrink:0;}
.logo .wm-d{display:none;}
.logo .sep{width:1px;align-self:stretch;background:var(--border2);margin:2px 0;}
.logo-name{font-size:19px;font-weight:600;line-height:1.25;min-width:0;letter-spacing:-.2px;}
.logo-sub{font-size:12px;color:var(--text3);line-height:1.3;}
.header-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.seg.lang button{padding:5px 10px;font-weight:600;font-size:12px;}
.site-link{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--text2);text-decoration:none;padding:6px 4px;}
.site-link:hover{color:var(--accent);}
h1.logo-name{margin:0;}
.score-chip{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--white);border:1px solid var(--border);border-radius:999px;padding:4px 5px 4px 12px;font-variant-numeric:tabular-nums;cursor:pointer;}
.score-chip:hover{border-color:var(--accent-b);}
.cls{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:7px;color:#fff;font-weight:700;font-size:13px;}
.icon-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--white);color:var(--text2);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.icon-btn:hover{color:var(--accent);border-color:var(--accent-b);background:var(--accent-s);}
.ti-sun{display:none;}
.page-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:20px 30px 24px;}

/* stappen */
.stepbar{flex-shrink:0;padding:12px 30px;border-bottom:1px solid var(--border);}
.steps{display:flex;gap:2px;background:var(--white);border:1px solid var(--border);border-radius:999px;padding:3px;width:max-content;max-width:100%;overflow-x:auto;}
.step{border:0;background:transparent;color:var(--text2);font-size:13px;font-weight:500;padding:7px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;}
.step .n{width:18px;height:18px;border-radius:50%;border:1.5px solid currentColor;display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;opacity:.7;}
.step.on{background:var(--accent);color:var(--on-accent);}
.step.on .n{opacity:1;}
.step:not(.on):hover{color:var(--text);}

.kader{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:20px 22px;box-shadow:0 1px 2px var(--shadow-soft);}
.kader + .kader{margin-top:14px;}
.k-title{font-size:15.5px;font-weight:600;margin-bottom:4px;}
.k-sub{font-size:13px;color:var(--text3);margin-bottom:14px;}
.note{border-radius:var(--r);border-left:3px solid var(--accent);background:var(--accent-s);padding:12px 16px;margin-bottom:14px;font-size:13.5px;color:var(--text2);display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.note.warn{border-left-color:var(--amber);background:var(--amber-s);}
.note .grow{flex:1;min-width:200px;}

/* formulier */
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px 16px;}
.fgrid .wide{grid-column:1/-1;}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0;}
.fld label{font-size:12.5px;font-weight:600;color:var(--text2);}
.inp{width:100%;font-size:13.5px;padding:8px 10px;border:1px solid var(--border2);border-radius:var(--r-sm);background:var(--cream);color:var(--text);}
.inp:focus{border-color:var(--accent);outline:none;}
.inp[readonly]{color:var(--text2);background:var(--neutral-s);}
textarea.inp{resize:vertical;min-height:60px;}
.seg{display:inline-flex;background:var(--cream);border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap;}
.seg button{border:0;background:transparent;color:var(--text2);font-size:12.5px;font-weight:500;padding:6px 14px;border-radius:999px;cursor:pointer;}
.seg button.on{background:var(--accent);color:var(--on-accent);}
.btn{border:1px solid var(--border2);background:var(--white);color:var(--text2);font-size:12.5px;font-weight:600;padding:8px 15px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;}
.btn:hover{border-color:var(--accent-b);color:var(--accent);background:var(--accent-s);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
.btn.primary:hover{opacity:.9;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px;}
.method-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;}
.mcard{text-align:left;border:1.5px solid var(--border);background:var(--cream);border-radius:var(--r);padding:14px 16px;cursor:pointer;}
.mcard:hover{border-color:var(--accent-b);}
.mcard.on{border-color:var(--accent);background:var(--accent-s);}
.mcard .t{font-weight:600;font-size:14px;color:var(--text);}
.mcard .d{font-size:12.5px;color:var(--text2);margin-top:3px;}

/* beoordeling */
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
.progress{flex:1;min-width:220px;}
.progress .plbl{font-size:12.5px;color:var(--text2);margin-bottom:5px;font-variant-numeric:tabular-nums;}
.pbar{height:6px;border-radius:99px;background:var(--neutral-s);overflow:hidden;}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s;}
.dom + .dom{margin-top:10px;}
.dom{padding:0;overflow:hidden;}
.dom-head{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;cursor:pointer;padding:14px 18px;text-align:left;}
.dom-head:hover{background:var(--accent-s);}
.dom-ico{width:34px;height:34px;border-radius:9px;background:var(--accent-s);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.dom-ico svg{width:18px;height:18px;}
.dom-name{display:block;font-weight:600;font-size:14.5px;}
.dom-meta{display:block;font-size:12px;color:var(--text3);font-variant-numeric:tabular-nums;}
.dom-right{margin-left:auto;display:flex;align-items:center;gap:12px;flex-shrink:0;}
.mini-pill{font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;font-variant-numeric:tabular-nums;white-space:nowrap;}
.mini-pill.ok{color:var(--green);background:var(--green-s);}
.mini-pill.todo{color:var(--amber);background:var(--amber-s);}
.mini-pill.off{color:var(--text3);background:var(--neutral-s);}
.chev{color:var(--text3);transition:transform .15s;font-size:16px;}
.dom.open .chev{transform:rotate(90deg);color:var(--accent);}
.dom-body{display:none;border-top:1px solid var(--border);padding:14px 18px 16px;}
.dom.open .dom-body{display:block;}
.dom-presence{display:flex;padding-bottom:4px;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--text2);margin-bottom:12px;}
.svc{padding:16px 0;}
.svc + .svc{border-top:1px solid var(--border);}
.svc.na{opacity:.62;}
.tag.todo{color:var(--amber);border-color:var(--amber);cursor:default;}
.small{font-size:12.5px;}
.svc-top{display:flex;gap:12px;align-items:flex-start;}
.svc-txt{flex:1;min-width:0;}
.code{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-s);border-radius:5px;padding:1px 6px;margin-right:6px;font-variant-numeric:tabular-nums;}
.svc-name{font-weight:600;font-size:13.5px;color:var(--text);}
.svc-group{font-size:12px;color:var(--text3);margin-top:1px;}
.svc-pre{font-size:12px;color:var(--text2);margin-top:5px;font-style:italic;}
.tag{display:inline-block;font-size:10.5px;font-weight:600;color:var(--text3);border:1px solid var(--border2);border-radius:999px;padding:0 7px;margin-left:6px;white-space:nowrap;vertical-align:1px;cursor:help;}
.switch{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--text2);cursor:pointer;white-space:nowrap;flex-shrink:0;user-select:none;}
.switch input{appearance:none;width:32px;height:18px;border-radius:99px;background:var(--border2);position:relative;cursor:pointer;transition:background .15s;flex-shrink:0;}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--white);transition:transform .15s;}
.switch input:checked{background:var(--accent);}
.switch input:checked::after{transform:translateX(14px);}
.levels{display:flex;flex-direction:column;gap:1px;margin-top:9px;margin-left:-10px;}
.lvl{display:flex;gap:10px;align-items:flex-start;padding:6px 10px;border:0;border-radius:var(--r-sm);background:transparent;cursor:pointer;font-size:12.8px;color:var(--text2);line-height:1.45;}
.lvl:hover{background:var(--accent-s);}
.lvl input{position:absolute;opacity:0;pointer-events:none;}
.lvl .ln{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;color:var(--text3);font-variant-numeric:tabular-nums;}
.lvl.on{background:var(--accent-s);color:var(--text);font-weight:500;}
.lvl.on .ln{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
.lvl:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:1px;}
.partial{margin-top:10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:12.5px;color:var(--text2);}
.partial .inp{width:auto;padding:5px 8px;font-size:12.5px;}
.partial input.inp[type=number]{width:72px;text-align:right;}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;}
.chk input{accent-color:var(--accent);width:14px;height:14px;}

/* resultaat */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:stretch;}
.big{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;}
.big .num{font-size:58px;font-weight:700;line-height:1;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;}
.big .num small{font-size:26px;font-weight:600;letter-spacing:0;margin-left:2px;color:var(--text2);}
.big .clsbig{width:62px;height:62px;border-radius:14px;color:#fff;font-size:34px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.big .lab{font-size:13px;color:var(--text3);font-weight:600;margin-bottom:8px;width:100%;}
.scale{display:flex;flex-direction:column;gap:3px;margin-top:18px;}
.scale .s{display:flex;align-items:center;gap:8px;font-size:11.5px;white-space:nowrap;color:var(--text3);font-variant-numeric:tabular-nums;}
.scale .bar{height:17px;border-radius:3px 9px 9px 3px;color:#fff;font-weight:700;font-size:11px;display:flex;align-items:center;padding-left:7px;opacity:.38;}
.scale .s.cur .bar{opacity:1;box-shadow:0 0 0 2px var(--white),0 0 0 3.5px currentColor;}
.scale .s.cur{color:var(--text);font-weight:600;}
.kfs{display:flex;flex-direction:column;gap:20px;justify-content:center;padding-left:22px;border-left:1px solid var(--border);}
.kf{padding:0;}
.kf .h{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:600;}
.kf .h span:last-child{font-variant-numeric:tabular-nums;}
.kf .d{font-size:11.5px;color:var(--text3);margin:1px 0 7px;}
.hbars{display:flex;flex-direction:column;gap:8px;}
.hb{display:grid;grid-template-columns:minmax(120px,240px) 1fr 52px;gap:12px;align-items:center;font-size:13px;}
.hb .n{color:var(--text2);min-width:0;}
.hb .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;}
.hb .v.na{color:var(--text3);font-weight:400;font-size:12px;}
.track{height:10px;border-radius:99px;background:var(--neutral-s);overflow:hidden;position:relative;}
.track i{display:block;height:100%;border-radius:99px;background:var(--accent);}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;}
.two + .kader{margin-top:14px;}
.note + .kader,.kader + .note,.kader + .cert-wrap,.note + .cert-wrap{margin-top:14px;}
.k-title{font-size:15.5px;font-weight:600;margin-bottom:4px;}
.hb .w{color:var(--text3);}
.msg{margin-top:10px;}
.two .kader + .kader{margin-top:0;}
.mat-wrap{overflow-x:auto;margin-top:6px;}
table.mat{border-collapse:separate;border-spacing:3px;font-size:12px;width:100%;min-width:680px;table-layout:fixed;}
table.mat col.c0{width:19%;}
table.mat th{font-weight:600;color:var(--text2);font-size:11px;padding:4px;vertical-align:bottom;text-align:center;line-height:1.3;}
table.mat th:first-child{text-align:left;}
table.mat td{text-align:center;padding:7px 4px;border-radius:5px;font-variant-numeric:tabular-nums;color:var(--text);}
table.mat td:first-child{text-align:left;color:var(--text2);font-weight:500;background:none;padding-left:0;}
table.mat td.na{color:var(--text3);background:var(--neutral-s);}
.legend-note{font-size:12px;color:var(--text3);margin-top:10px;}

/* certificaat */
.cert-wrap{overflow-x:auto;padding:4px 0 10px;}
.cert{width:720px;margin:0 auto;background:var(--cert-bg);color:var(--cert-ink);border-radius:6px;box-shadow:0 10px 40px var(--shadow-card);overflow:hidden;font-size:12px;border:1px solid var(--border);}
.cert *{color:inherit;}
.c-band{background:var(--cert-navy);color:#fff;padding:22px 30px 20px;display:flex;justify-content:space-between;align-items:center;gap:20px;position:relative;}
.c-band::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--cert-sand),var(--cert-sand-d));}
.c-band .k{font-size:12px;letter-spacing:.2px;opacity:.8;font-weight:600;}
.c-band .t{font-size:24px;font-weight:700;line-height:1.2;}
.c-band img{height:40px;width:auto;}
.c-body{padding:22px 30px 18px;}
.c-bld{display:grid;grid-template-columns:1.3fr 1fr;gap:6px 24px;padding-bottom:16px;border-bottom:1px solid var(--cert-line);}
.c-bld .nm{font-size:17px;font-weight:700;grid-column:1/-1;}
.c-kv{display:flex;gap:8px;font-size:11.5px;}
.c-kv span:first-child{color:var(--cert-ink2);min-width:112px;}
.c-score{display:grid;grid-template-columns:220px 1fr;gap:24px;padding:18px 0;border-bottom:1px solid var(--cert-line);align-items:center;}
.c-big{text-align:center;}
.c-big .l{font-size:12px;color:var(--cert-ink2);font-weight:600;}
.c-big .v{font-size:50px;font-weight:700;letter-spacing:-1px;line-height:1.1;font-variant-numeric:tabular-nums;}
.c-big .c{display:inline-flex;margin-top:4px;padding:3px 12px;border-radius:999px;color:#fff;font-weight:700;font-size:12px;}
.c-scale{display:flex;flex-direction:column;gap:3px;}
.c-scale .r{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--cert-ink2);font-variant-numeric:tabular-nums;}
.c-scale .a{height:18px;color:#fff;font-weight:700;display:flex;align-items:center;padding-left:8px;font-size:11px;clip-path:polygon(0 0,calc(100% - 9px) 0,100% 50%,calc(100% - 9px) 100%,0 100%);}
.c-scale .mk{font-weight:700;color:var(--cert-ink);display:flex;align-items:center;gap:4px;}
.c-kfs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px 0;border-bottom:1px solid var(--cert-line);}
.c-kf{background:var(--cert-soft);border-radius:6px;padding:10px 12px;}
.c-kf .t{font-size:10.5px;color:var(--cert-ink2);font-weight:600;line-height:1.3;min-height:28px;}
.c-kf .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;}
.c-cols{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:16px 0;border-bottom:1px solid var(--cert-line);}
.c-h{font-size:12px;color:var(--cert-ink2);font-weight:700;margin-bottom:8px;}
.c-row{display:grid;grid-template-columns:1fr 80px 38px;gap:8px;align-items:center;font-size:11px;margin-bottom:5px;}
.c-row .b{height:6px;background:var(--cert-soft);border-radius:9px;overflow:hidden;}
.c-row .b i{display:block;height:100%;background:var(--cert-navy);border-radius:9px;}
.c-row .p{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;}
.c-row.na{color:var(--cert-ink2);}
.c-foot{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;padding-top:14px;font-size:10.5px;}
.c-disc{grid-column:1/-1;color:var(--cert-ink2);font-size:9.5px;line-height:1.5;margin-top:8px;}
.c-draft{background:#fff4e0;color:#7a4a00;font-size:11px;font-weight:600;text-align:center;padding:6px;}
.msg{font-size:12.5px;color:var(--text2);min-height:18px;}
.msg.err{color:var(--red);}
.msg.ok{color:var(--green);}

/* methodiek */
.mlist{margin-top:16px;background:var(--white);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;}
.mhead{width:100%;display:flex;align-items:center;gap:10px;padding:12px 16px;background:none;border:0;cursor:pointer;text-align:left;font-size:14px;font-weight:600;}
.mhead:hover{background:var(--accent-s);}
.mhead .chev{margin-left:auto;}
.mlist.open > .mhead .chev{transform:rotate(90deg);color:var(--accent);}
.mbody{display:none;padding:2px 16px 14px;border-top:1px solid var(--border);}
.mlist.open .mbody{display:block;}
.mbody h4{font-size:13.5px;font-weight:600;margin:14px 0 6px;}
.mbody p,.mbody li{font-size:13px;color:var(--text2);line-height:1.65;}
.mbody ul{padding-left:18px;margin-bottom:8px;}
.wtab-wrap{overflow-x:auto;}
table.wtab{border-collapse:collapse;font-size:12px;width:100%;min-width:620px;}
table.wtab th{font-weight:600;color:var(--text2);font-size:11px;padding:6px;border-bottom:1.5px solid var(--accent-b);background:var(--accent-s);text-align:right;line-height:1.3;}
table.wtab td{padding:5px 6px;border-bottom:1px solid var(--border);text-align:right;font-variant-numeric:tabular-nums;color:var(--text2);}
table.wtab th:first-child,table.wtab td:first-child{text-align:left;}
table.wtab td.z{color:var(--text3);}
.footer{display:flex;align-items:center;gap:14px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:11px;color:var(--text3);line-height:1.5;}
.footer img{width:26px;height:26px;flex-shrink:0;}
.score-chip .cls{color:#fff;}
.fm-d{display:none;}

@media (max-width:1040px){.site-link .txt{display:none;}}
@media (max-width:900px){.score-chip{display:none;}}
@media (max-width:760px){
  .topbar{padding:12px 16px;}
  .stepbar{padding:10px 16px;}
  .site-link .txt{display:none;}
  .logo{min-width:0;gap:10px;}
  .logo-name{white-space:normal;font-size:15px;line-height:1.2;}
  .step{padding:7px 11px;font-size:12.5px;}
  .step .n{display:none;}
  .steps{width:100%;justify-content:space-between;}
  .header-right{gap:6px;}
  .score-chip{display:none;}
  .kfs{padding-left:0;border-left:0;padding-top:18px;border-top:1px solid var(--border);}
  .logo .wm{height:24px;}
  .page-scroll{padding:16px 16px 20px;}
  .hero,.two{grid-template-columns:1fr;}
  .hb{grid-template-columns:minmax(0,1fr) 90px 46px;}
  .logo-sub{display:none;}
  .big .num{font-size:46px;}
}

/* ---- startscherm (cover) ---- */
.cover{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;overflow-y:auto;padding-block:40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));color:#fff;}
.cover[hidden]{display:none!important;}
.cv-in{width:100%;max-width:1120px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:64px;align-items:center;}
.cv-wm{height:52px;width:auto;display:block;margin-bottom:56px;}
.cv-h{font-size:clamp(44px,6vw,72px);line-height:1.03;font-weight:700;letter-spacing:-1.4px;margin:0;}
.cv-h em{font-style:normal;color:#f0c46e;}
.cv-p{font-size:clamp(18px,1.9vw,23px);line-height:1.5;color:#d9dbe3;margin:24px 0 0;font-weight:500;max-width:520px;}
.cv-cta{margin-top:40px;display:inline-flex;align-items:center;font-family:var(--sans);font-size:18px;font-weight:700;color:#14213d;background:#f0c46e;border:0;border-radius:999px;padding:16px 34px;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.3);transition:transform .15s,background .15s;}
.cv-cta:hover{background:#f6d48c;transform:translateY(-1px);}
.cv-cta:focus-visible{outline:3px solid #fff;outline-offset:3px;}
.cv-lang{position:absolute;top:max(20px,env(safe-area-inset-top,0px));right:max(24px,env(safe-area-inset-right,0px));display:inline-flex;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:3px;gap:2px;}
.cv-lang button{border:0;background:transparent;color:#d9dbe3;font-family:var(--sans);font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:999px;cursor:pointer;}
.cv-lang button.on{background:#f0c46e;color:#14213d;}
.cv-card{background:#faf7f1;color:#14213d;border-radius:22px;box-shadow:0 30px 70px rgba(0,0,0,.45);padding:30px 32px;transform:rotate(-2deg);}
.cv-row{display:flex;align-items:flex-end;gap:16px;}
.cv-num{font-size:66px;font-weight:700;letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums;}
.cv-num small{font-size:28px;color:#46506a;margin-left:2px;letter-spacing:0;}
.cv-cls{width:58px;height:58px;border-radius:13px;background:#2c4a73;color:#fff;font-size:32px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.cv-scale{margin-top:18px;display:flex;flex-direction:column;gap:4px;}
.cv-s{display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:12px;color:#8a8576;font-weight:600;}
.cv-s .b{height:17px;border-radius:3px 9px 9px 3px;color:#fff;font-size:11px;font-weight:700;padding-left:7px;display:flex;align-items:center;opacity:.35;}
.cv-s.cur .b{opacity:1;} .cv-s.cur{color:#2c4a73;}
.cv-kfs{margin-top:20px;padding-top:18px;border-top:1px solid #ebe4d6;display:flex;flex-direction:column;gap:12px;}
.cv-kf .h{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:6px;}
.cv-kf .t{height:8px;border-radius:9px;background:#f1ece2;overflow:hidden;} .cv-kf .t i{display:block;height:100%;background:#14213d;border-radius:9px;}
.logo .home{display:contents;cursor:pointer;}
.logo-btn{display:flex;align-items:center;background:none;border:0;padding:0;cursor:pointer;}
@media (max-width:860px){.cv-in{grid-template-columns:1fr;gap:48px;}.cv-card{transform:none;max-width:460px;}.cv-wm{margin-bottom:36px;height:44px;}.cover{align-items:flex-start;padding-top:72px;}}
@media (prefers-reduced-motion:reduce){.cv-cta{transition:none;}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}

/* SRI-rekenkern — 1-op-1 nagebouwd op SRI3_calculation-sheet v4.6
   (tabbladen Calculation, Results, Weightings). */
var SRI_DOMAINS=['H','DHW','C','V','L','DE','E','EV','MC'];
var SRI_ZONE={Austria:'W',Belgium:'W',Bulgaria:'SE',Croatia:'SE',Cyprus:'S','Czech Republic':'NE',Denmark:'N',Estonia:'NE',Finland:'N',France:'W',Germany:'W',Greece:'S',Hungary:'SE',Iceland:'N',Ireland:'W',Italy:'S',Latvia:'NE',Liechtenstein:'W',Lithuania:'NE',Luxembourg:'W',Malta:'S',Netherlands:'W',Norway:'N',Poland:'NE',Portugal:'S',Romania:'SE',Slovakia:'NE',Slovenia:'SE',Spain:'S',Sweden:'N',Switzerland:'W','United Kingdom':'W'};

function sriWeights(D,st){
  var m=st.method==='A'?'A':'B';
  var bt=st.building.type==='res'?'res':'nonres';
  var z=SRI_ZONE[st.building.country]||'W';
  var w=D.weights[bt][z], dw={};
  SRI_DOMAINS.forEach(function(d){
    var r=w.dom[d].slice();
    r[2]=D.mdep[m].comfort[d]; r[4]=D.mdep[m].health[d];
    dw[d]=r;
  });
  return {dom:dw,imp:w.imp.slice(),zone:z,bt:bt};
}

function sriCompute(D,st){
  var W=sriWeights(D,st), m=st.method==='A'?'A':'B';
  var num={},den={},cnt={};
  SRI_DOMAINS.forEach(function(d){num[d]=[0,0,0,0,0,0,0];den[d]=[0,0,0,0,0,0,0];cnt[d]={inMethod:0,assess:0,done:0};});
  var open=[];
  D.services.forEach(function(s){
    var d=s.d, inm=(m==='A'?s.a:s.b)===1, F=+st.present[d], SC=(m==='A'?s.sA:s.sB);
    var i=st.svc[s.c]||{}, app=i.app!==0;
    if(inm) cnt[d].inMethod++;
    var U=inm&&F===1&&app;
    var Z=inm&&((F===1&&(s.t===1||app))||(F===2&&s.t===1));
    if(U){
      cnt[d].assess++;
      var lvl=i.lvl;
      if(lvl===null||lvl===undefined||lvl===''||lvl>=SC.length){open.push(s.c);lvl=0;} else cnt[d].done++;
      var sh=i.partial?Math.max(0,Math.min(100,+i.share||0))/100:1;
      var a=SC[+lvl], b=(sh<1&&i.add!=null&&i.add!==''&&i.add<SC.length)?SC[+i.add]:[0,0,0,0,0,0,0];
      for(var k=0;k<7;k++) num[d][k]+=a[k]*sh+b[k]*(1-sh);
    }
    if(Z){ for(var k2=0;k2<7;k2++){var mx=-1e9; SC.forEach(function(l){if(l[k2]>mx)mx=l[k2];}); den[d][k2]+=mx;} }
  });
  var imp=[];
  for(var k=0;k<7;k++){
    var n=0,dd=0;
    SRI_DOMAINS.forEach(function(d){n+=W.dom[d][k]*num[d][k];dd+=W.dom[d][k]*den[d][k];});
    imp.push(dd>0?n/dd:null);
  }
  var iw=W.imp;
  function wavg(ks){var a=0,b=0;ks.forEach(function(k){if(imp[k]!==null){a+=iw[k]*imp[k];b+=iw[k];}});return b>0?a/b:null;}
  var sri=wavg([0,1,2,3,4,5,6]);
  var kf=[wavg([0,5]),wavg([2,3,4,6]),wavg([1])];
  var mat={},dom={};
  SRI_DOMAINS.forEach(function(d){
    mat[d]=[];var a=0,b=0;
    for(var k=0;k<7;k++){var v=den[d][k]>0?num[d][k]/den[d][k]:null;mat[d].push(v);if(v!==null){a+=iw[k]*v;b+=iw[k];}}
    dom[d]=b>0?a/b:null;
  });
  return {sri:sri,imp:imp,kf:kf,mat:mat,dom:dom,open:open,cnt:cnt,W:W};
}

function sriClass(p){
  if(p===null||isNaN(p))return null;
  var x=p*100;
  if(x>=90)return 'A'; if(x>=80)return 'B'; if(x>=65)return 'C'; if(x>=50)return 'D';
  if(x>=35)return 'E'; if(x>=20)return 'F'; return 'G';
}

  var NAVY=[20,33,61],INK=[20,33,61],INK2=[90,99,120],LINE=[232,225,211],SOFT=[247,242,232];
  var hex=function(h){return [parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)];};
