","a":["c","r"],"g":["m","e"],"w":"This reduces the cooling load and has benefits for biodiversity and mental health.","n":"Plants may generate pollen which could cause allergies.","t2":"Creëer schaduw door bomen en planten rond het gebouw te planten","w2":"Dit verlaagt de koellast en is gunstig voor de biodiversiteit en het mentale welzijn.","n2":"Planten kunnen pollen verspreiden die allergieën kunnen veroorzaken."},{"t":"Create a green environment, remove tiles, create a pond, add vegetation.","s":"d_context","c":"gen_all","f":"cooling","l":"context","a":["c","r"],"g":["m","e"],"w":"This reduces the cooling load and has benefits for biodiversity and mental health.","n":"No side effects are expected.","t2":"Creëer een groene omgeving: haal tegels weg, leg een vijver aan, voeg begroeiing toe.","w2":"Dit verlaagt de koellast en is gunstig voor de biodiversiteit en het mentale welzijn.","n2":"Er worden geen neveneffecten verwacht."},{"t":"Create adaptive systems so that the system and products can be adjusted when the building's function changes.","s":"g_design","c":"gen_all","f":"heating","l":"system","a":["c","r"],"g":["m"],"w":"This allows for future changes, and prevents the need to prematurely discard materials in the future.","n":"If the use scenario does not change, the added materials will not be used in the end.","t2":"Maak adaptieve systemen, zodat systeem en producten aangepast kunnen worden als de functie van het gebouw verandert.","w2":"Dit maakt toekomstige aanpassingen mogelijk en voorkomt dat materialen later voortijdig worden afgedankt.","n2":"Als het gebruik niet verandert, worden de toegevoegde materialen uiteindelijk niet benut."},{"t":"Reuse parts that are less prone to wear.","s":"g_design","c":"gen_all","f":"heating","l":"component","a":["c","r"],"g":["m"],"w":"Static parts are much less prone to wear, so they can be used longer than mechanical components.","n":"No side effects are expected.","t2":"Hergebruik onderdelen die minder gevoelig zijn voor slijtage.","w2":"Statische onderdelen slijten veel minder en gaan dus langer mee dan mechanische componenten.","n2":"Er worden geen neveneffecten verwacht."},{"t":"Design installations more robust so that they break down less quickly and technicians can clean quickly and without damaging anything","s":"g_design","c":"gen_all","f":"heating","l":"product","a":["c","r"],"g":["m"],"w":"This will reduce premature failure and increase lifespan.","n":"Initially, this requires an increase in materials, which should be compensated through the elongated lifetime.","t2":"Ontwerp installaties robuuster, zodat ze minder snel stukgaan en monteurs snel en zonder schade kunnen reinigen","w2":"Dit vermindert voortijdige uitval en verlengt de levensduur.","n2":"Dit vraagt eerst om meer materiaal, wat moet worden gecompenseerd door de langere levensduur."},{"t":"Design systems, products and components so that they can be disassembled without damaging them.","s":"g_design","c":"gen_all","f":"heating","l":"building","a":["c","r"],"g":["m"],"w":"This enables reuse, repair and refurbishment.","n":"This might require different types of connections which could have a higher initial impact or could limit technical possibilities.","t2":"Ontwerp systemen, producten en componenten zo dat ze zonder schade gedemonteerd kunnen worden.","w2":"Dit maakt hergebruik, reparatie en revisie mogelijk.","n2":"Hiervoor zijn mogelijk andere typen verbindingen nodig, die een hogere initiële impact kunnen hebben of de technische mogelijkheden kunnen beperken."},{"t":"Reduce the total mass of materials needed to provide indoor comfort over the full lifetime of a building.","s":"g_design","c":"gen_all","f":"heating","l":"building","a":["c","r"],"g":["m"],"w":"This reduces the amount of materials and consequent emissions.","n":"The energy consumption might increase due to decreased materials use. Make sure the operational emissions do not countereffect the material savings.","t2":"Verminder de totale materiaalmassa die nodig is voor binnencomfort over de volledige levensduur van een gebouw.","w2":"Dit vermindert de hoeveelheid materiaal en de bijbehorende emissies.","n2":"Het energieverbruik kan stijgen door het lagere materiaalgebruik. Zorg dat de operationele emissies de materiaalbesparing niet tenietdoen."},{"t":"Avoid using critical raw materials in components, products and systems if possible.","s":"g_design","c":"gen_all","f":"heating","l":"building","a":["c","r"],"g":["m"],"w":"This reduces the amount of critical raw materials.","n":"The amount of used other materials or energy consumption might increase.","t2":"Vermijd waar mogelijk kritieke grondstoffen in componenten, producten en systemen.","w2":"Dit vermindert de hoeveelheid kritieke grondstoffen.","n2":"Het gebruik van andere materialen of het energieverbruik kan toenemen."},{"t":"Where possible, use low-impact, renewable, recycled and/or recyclable materials.","s":"g_design","c":"gen_all","f":"heating","l":"building","a":["c","r"],"g":["m"],"w":"This reduces the initial impact of designed systems and can allow for recycling.","n":null,"t2":"Gebruik waar mogelijk materialen met een lage impact die hernieuwbaar, gerecycled en/of recyclebaar zijn.","w2":"Dit verlaagt de initiële impact van het ontworpen systeem en kan recycling mogelijk maken.","n2":null},{"t":"Critically evaluate the requirements and baseline scenarios and reduce overdimensioning. For example, reevaluate the to be heated surfaces such as those in bedrooms, and base requirements on recent weather models (dimensioning for -10°C in the Netherlands is outdated). Also, reduce overusing IEQ sensors and monitoring systems.","s":"g_design","c":"gen_all","f":"heating","l":"system","a":["c","r"],"g":["m","e"],"w":"Overdimensioning and short cycling of generation units is reduced.","n":"Indoor comfort may be insufficient in peak situations.","t2":"Beoordeel de eisen en uitgangssituaties kritisch en verminder overdimensionering. Herzie bijvoorbeeld de te verwarmen oppervlakken, zoals in slaapkamers, en baseer eisen op recente klimaatmodellen (dimensioneren op −10 °C is in Nederland achterhaald). Voorkom ook overmatig gebruik van binnenklimaatsensoren en monitoringsystemen.","w2":"Overdimensionering en pendelen van opwekkers worden verminderd.","n2":"Het binnencomfort kan in piekmomenten onvoldoende zijn."},{"t":"Reduce the total energy consumption needed to provide indoor comfort and make use of renewable energy as much as possible.","s":"g_design","c":"gen_all","f":"heating","l":"building","a":["c","r"],"g":["e"],"w":"This reduces the energy use and consequent emissions.","n":"The material consumption might increase to be able to reduce the energy use. Make sure the material related emissions do not countereffect the energy savings.","t2":"Verminder het totale energieverbruik voor binnencomfort en maak zoveel mogelijk gebruik van hernieuwbare energie.","w2":"Dit vermindert het energieverbruik en de bijbehorende emissies.","n2":"Het materiaalgebruik kan toenemen om het energieverbruik te verlagen. Zorg dat de materiaalgebonden emissies de energiebesparing niet tenietdoen."},{"t":"Request a minimum number of years warranty on products and parts.","s":"g_org","c":"gen_all","f":"heating","l":"product","a":["c","r"],"g":["m"],"w":"This will push suppliers to provide higher-quality and longer-lasting products.","n":"This will increase costs.","t2":"Vraag een minimaal aantal jaren garantie op producten en onderdelen.","w2":"Dit zet leveranciers aan tot producten van hogere kwaliteit die langer meegaan.","n2":"Dit verhoogt de kosten."},{"t":"Collaborate with circular take-back initiatives. Return products and/or parts to a maintenance or refurbishment facility to have new products made from them. For example, fan coil units, heat pumps, compressors, and pumps.","s":"g_org","c":"gen_all","f":"heating","l":"product","a":["c","r"],"g":["m"],"w":"Product life of existing materials/products is prolongued.","n":"Take-back initiatives require additional transportation.","t2":"Werk samen met circulaire terugnamesystemen. Lever producten en/of onderdelen in bij een onderhouds- of revisiebedrijf om er nieuwe producten van te laten maken. Bijvoorbeeld ventilatorconvectoren, warmtepompen, compressoren en pompen.","w2":"De levensduur van bestaande materialen/producten wordt verlengd.","n2":"Terugnamesystemen vragen extra transport."},{"t":"Make use of digital product passport and data for comissioning, maintenance and repair.","s":"g_org","c":"gen_all","f":"heating","l":"product","a":["c","r"],"g":["m"],"w":"This enables circular design and operation in the future.","n":null,"t2":"Maak gebruik van een digitaal productpaspoort en data voor inbedrijfstelling, onderhoud en reparatie.","w2":"Dit maakt circulair ontwerp en gebruik in de toekomst mogelijk.","n2":null},{"t":"Supply instructions for dismantling products.","s":"g_org","c":"gen_all","f":"heating","l":"product","a":["c","r"],"g":["m"],"w":"This enables reuse, repair and refurbishment.","n":"No side effects are expected.","t2":"Lever demontage-instructies bij producten.","w2":"Dit maakt hergebruik, reparatie en revisie mogelijk.","n2":"Er worden geen neveneffecten verwacht."},{"t":"Apply open source technology.","s":"reconsider","c":"ctrl","f":"cooling","l":"component","a":["c","r"],"g":["m"],"w":"Using open source technology prevents obsolescence due to soft- or hardware that cannot be upgraded.","n":null,"t2":"Pas opensourcetechnologie toe.","w2":"Opensourcetechnologie voorkomt veroudering door soft- of hardware die niet meer bij te werken is.","n2":null},{"t":"Make multifunctional use of luminaires/ventilation grilles.","s":"reconsider","c":"term","f":"ventilation","l":"system","a":["c"],"g":["m"],"w":"The amount of materials used is reduced.","n":"No side effects are expected.","t2":"Maak multifunctioneel gebruik van armaturen/ventilatieroosters.","w2":"De hoeveelheid gebruikte materialen neemt af.","n2":"Er worden geen neveneffecten verwacht."},{"t":"Request long software support.","s":"reconsider","c":"ctrl","f":"ventilation","l":"product","a":["c","r"],"g":["m"],"w":"This prevents premature obsolescence for hardware caused by unsupported software.","n":"No side effects are expected.","t2":"Vraag om langdurige softwareondersteuning.","w2":"Dit voorkomt dat hardware voortijdig veroudert door software die niet meer wordt ondersteund.","n2":"Er worden geen neveneffecten verwacht."},{"t":"Use natural refrigerants.","s":"reconsider","c":"gen","f":"heating","l":"component","a":["c","r"],"g":["m"],"w":"Natural refrigerants have a significantly lower GWP, which prevents environmental damage due to leakages.","n":"Do not get rid of well-functioning products before they have reached the end of their life in order to meet this intervention.","t2":"Gebruik natuurlijke koudemiddelen.","w2":"Natuurlijke koudemiddelen hebben een veel lagere GWP, wat milieuschade door lekkages voorkomt.","n2":"Doe goed functionerende producten niet weg voordat ze het einde van hun levensduur hebben bereikt, alleen om aan deze ingreep te voldoen."},{"t":"Use electric motors that operate on three-phase current instead of permanent magnets.","s":"reconsider","c":"gen","f":"heating","l":"component","a":["c","r"],"g":["m"],"w":"This reduces the amount of critical raw materials.","n":"The efficiency might be reduced and result in higher operational emissions.","t2":"Gebruik elektromotoren op draaistroom in plaats van met permanente magneten.","w2":"Dit vermindert de hoeveelheid kritieke grondstoffen.","n2":"Het rendement kan afnemen, wat tot hogere operationele emissies leidt."},{"t":"Use biobased insulation for pipes.","s":"reconsider","c":"dist","f":"heating","l":"component","a":["c","r"],"g":["m"],"w":"Using biobased insulation rather than non-biobased materials reduces the embodied carbon of the system and makes use of renewable materials.","n":"Using biobased materials might reduce the durability. Evaluate whether this is the case.","t2":"Gebruik biobased isolatie voor leidingen.","w2":"Biobased isolatie in plaats van niet-biobased materialen verlaagt de gebonden CO2 van het systeem en maakt gebruik van hernieuwbare materialen.","n2":"Biobased materialen kunnen minder duurzaam zijn. Ga na of dit het geval is."},{"t":"Use change-over systems.","s":"reconsider","c":"dist","f":"heating","l":"system","a":["c","r"],"g":["m"],"w":"Installing a change-over system allows for adding a cooling system in the future.","n":"If the use scenario does not change, the added materials will not be used in the end.","t2":"Gebruik change-oversystemen.","w2":"Een change-oversysteem maakt het mogelijk om later koeling toe te voegen.","n2":"Als het gebruik niet verandert, worden de toegevoegde materialen uiteindelijk niet benut."},{"t":"Use water-based systems to reduce distribution materials.","s":"reconsider","c":"dist","f":"heating","l":"system","a":["c","r"],"g":["m"],"w":"Less materials are needed for the heat distribution.","n":"Water-based systems require (larger) terminal units. Use impact-calculations to evaluate the effectiveness of this intervention for your designed system.","t2":"Gebruik watergedragen systemen om distributiemateriaal te verminderen.","w2":"Er is minder materiaal nodig voor de warmtedistributie.","n2":"Watergedragen systemen vragen om (grotere) afgifte-units. Gebruik impactberekeningen om de effectiviteit van deze interventie voor jouw ontwerp te beoordelen."},{"t":"Design distribution efficiently, place AHUs and mechanical exhausts centrally.","s":"reconsider","c":"dist","f":"heating","l":"system","a":["c","r"],"g":["m"],"w":"A central positioning reduces ducts and pipes.","n":"No side effects are expected.","t2":"Ontwerp de distributie efficiënt, plaats LBK's en mechanische afzuiging centraal.","w2":"Een centrale plaatsing vermindert kanalen en leidingen.","n2":"Er worden geen neveneffecten verwacht."},{"t":"Use standardized modules such as climate ceiling islands instead of custom-made climate ceilings.","s":"reconsider","c":"term","f":"heating","l":"product","a":["c"],"g":["m"],"w":"Standardized modules are easier to be reused and repaired after an initial lifetime.","n":"The installation might initially be overdimensioned to provide sufficient capacity using standardized products.","t2":"Gebruik gestandaardiseerde modules zoals klimaatplafondeilanden in plaats van maatwerkklimaatplafonds.","w2":"Gestandaardiseerde modules zijn na een eerste levensduur makkelijker te hergebruiken en te repareren.","n2":"De installatie kan in eerste instantie overgedimensioneerd zijn om met gestandaardiseerde producten voldoende capaciteit te leveren."},{"t":"Use local control technology as much as possible (e.g. on the generator itself).","s":"reconsider","c":"ctrl","f":"heating","l":"system","a":["c","r"],"g":["m"],"w":"This reduces the amount the critical raw materials.","n":"This might reduce the ease of interaction from users with the system, which might result in higher emissions when installation products are located in a far away corner of the building.","t2":"Gebruik zoveel mogelijk lokale regeltechniek (bijv. op de opwekker zelf).","w2":"Dit vermindert de hoeveelheid kritieke grondstoffen.","n2":"Dit kan de bediening van het systeem door gebruikers lastiger maken, wat tot hogere emissies kan leiden als installatieproducten in een afgelegen hoek van het gebouw staan."},{"t":"Limit the controllability per room. Controlling based on the sun's orientation is usually sufficient.","s":"reconsider","c":"ctrl","f":"heating","l":"system","a":["c","r"],"g":["m"],"w":"This reduces the amount is critical raw materials.","n":"No side effects are expected.","t2":"Beperk de regelbaarheid per ruimte. Regelen op basis van de oriëntatie op de zon is meestal voldoende.","w2":"Dit vermindert de hoeveelheid kritieke grondstoffen.","n2":"Er worden geen neveneffecten verwacht."},{"t":"Take advantage of wireless, multi-functional sensors.","s":"reconsider","c":"ctrl","f":"heating","l":"product","a":["c","r"],"g":["m"],"w":"This reduces the amount multi critical raw materials.","n":"Alternative materials need to be added to provide energy and a way for communication for the sensors. Use impact-calculations to evaluate the effectiveness of this intervention for your designed system.","t2":"Benut draadloze, multifunctionele sensoren.","w2":"Dit vermindert de hoeveelheid kritieke grondstoffen.","n2":"Er zijn andere materialen nodig om de sensoren van energie en communicatie te voorzien. Gebruik impactberekeningen om de effectiviteit van deze interventie voor jouw ontwerp te beoordelen."},{"t":"Design with generic hardware and control more with software.","s":"reconsider","c":"ctrl","f":"heating","l":"product","a":["c","r"],"g":["m"],"w":"This is a form of standardisation which will allow for easier reuse after an initial lifetime.","n":"The installation might initially be overdimensioned using standardized products.","t2":"Ontwerp met generieke hardware en regel meer met software.","w2":"Dit is een vorm van standaardisatie die hergebruik na een eerste levensduur makkelijker maakt.","n2":"De installatie kan in eerste instantie overgedimensioneerd zijn door het gebruik van gestandaardiseerde producten."},{"t":"Request a minimum number of years of software support.","s":"reconsider","c":"ctrl","f":"heating","l":"product","a":["c","r"],"g":["m"],"w":"This will guarantee that hardware/products will not become obsolete due to outdated software.","n":"Certain hardware might not be compatible with new cybersecurity issues.","t2":"Vraag een minimaal aantal jaren softwareondersteuning.","w2":"Dit voorkomt dat hardware/producten verouderen door verouderde software.","n2":"Bepaalde hardware is mogelijk niet bestand tegen nieuwe cybersecurityrisico's."},{"t":"Make use of rented ('as a service') equipment, e.g. for a boiler.","s":"reconsider","c":"gen","f":"heating","l":"product","a":["c","r"],"g":["m"],"w":"As-a-service-equipment creates an incentive for suppliers to create long-lasting and repairable products.","n":"Users might handle the equipment careless since it is not their own.","t2":"Maak gebruik van gehuurde apparatuur ('as a service'), bijvoorbeeld voor een ketel.","w2":"Apparatuur 'as a service' geeft leveranciers een prikkel om duurzame en repareerbare producten te maken.","n2":"Gebruikers kunnen minder zorgvuldig met de apparatuur omgaan omdat die niet van hen is."},{"t":"Use filters to prevent pipe contamination (e.g. for magnetite).","s":"reconsider","c":"dist","f":"heating","l":"system","a":["c","r"],"g":["m"],"w":"The lifetime of pipes will be extended.","n":"Initially, this requires an increase in materials, which should be compensated through the elongated lifetime.","t2":"Gebruik filters om vervuiling van leidingen te voorkomen (bijv. door magnetiet).","w2":"De levensduur van leidingen wordt verlengd.","n2":"Dit vraagt eerst om meer materiaal, wat moet worden gecompenseerd door de langere levensduur."},{"t":"Use a more robust PCB and repairable electronics. (Often there's more than enough space; it's not a mobile phone.)","s":"reconsider","c":"ctrl","f":"heating","l":"product","a":["c","r"],"g":["m"],"w":"Increased robustness & repairability.","n":"Initially, this requires an increase in materials, which should be compensated through the elongated lifetime.","t2":"Gebruik een robuustere printplaat en repareerbare elektronica. (Er is vaak ruimte genoeg; het is geen mobiele telefoon.)","w2":"Grotere robuustheid en repareerbaarheid.","n2":"Dit vraagt eerst om meer materiaal, wat moet worden gecompenseerd door de langere levensduur."},{"t":"Use natural refrigerants.","s":"reconsider","c":"gen","f":"cooling","l":"component","a":["c","r"],"g":["m"],"w":"Natural refrigerants have a significantly lower GWP, which prevents environmental damage due to leakages.","n":"Do not get rid of well-functioning products before they have reached the end of their life in order to meet this intervention.","t2":"Gebruik natuurlijke koudemiddelen.","w2":"Natuurlijke koudemiddelen hebben een veel lagere GWP, wat milieuschade door lekkages voorkomt.","n2":"Doe goed functionerende producten niet weg voordat ze het einde van hun levensduur hebben bereikt, alleen om aan deze ingreep te voldoen."},{"t":"Implement changeover systems.","s":"reconsider","c":"dist","f":"cooling","l":"system","a":["r"],"g":["m"],"w":"This allows for adding an active cooling system in the future.","n":"If the use scenario does not change, the added materials will not be used in the end.","t2":"Pas change-oversystemen toe.","w2":"Dit maakt het mogelijk om later actieve koeling toe te voegen.","n2":"Als het gebruik niet verandert, worden de toegevoegde materialen uiteindelijk niet benut."},{"t":"Consider whether active cooling will be considered in the future. If so, avoid a mono-split system and install a multi-split system.","s":"reconsider","c":"dist","f":"cooling","l":"system","a":["c","r"],"g":["m"],"w":"This reduces the total cost of ownership and the amount of (critical raw) materials used.","n":"If the use scenario does not change, the initially extra added materials will not be used in the end.","t2":"Ga na of actieve koeling in de toekomst aan de orde komt. Zo ja, vermijd een mono-splitsysteem en installeer een multi-splitsysteem.","w2":"Dit verlaagt de totale eigendomskosten en de hoeveelheid gebruikte (kritieke) grondstoffen.","n2":"Als het gebruik niet verandert, worden de extra toegevoegde materialen uiteindelijk niet benut."},{"t":"Use water-based systems and/or decentralized systems to reduce distribution materials.","s":"reconsider","c":"dist","f":"cooling","l":"system","a":["c","r"],"g":["m"],"w":"This reduces the total cost of ownership and the amount of (critical raw) materials used.","n":"Decentralised systems require more control systems and maintenance. Use impact-calculations to evaluate whether the material reduction from this intervention weighs up to the increased impact for the control systems and maintenance.","t2":"Gebruik watergedragen en/of decentrale systemen om distributiemateriaal te verminderen.","w2":"Dit verlaagt de totale eigendomskosten en de hoeveelheid gebruikte (kritieke) grondstoffen.","n2":"Decentrale systemen vragen meer regeltechniek en onderhoud. Gebruik impactberekeningen om te beoordelen of de materiaalbesparing opweegt tegen de hogere impact van regeling en onderhoud."},{"t":"Eliminate heat recovery systems and bring back grilles, this saves installation materials and shaft space.","s":"reconsider","c":"gen","f":"ventilation","l":"system","a":["r"],"g":["m"],"w":"Distribution materials and HRU materials are reduced.","n":"Energy use needed for heating will increase. Use impact-calculations to evaluate whether the material reduction from this intervention weighs up to the increased impact in the operational phase for your designed system.","t2":"Laat warmteterugwinning weg en breng roosters terug; dit bespaart installatiemateriaal en schachtruimte.","w2":"Distributiematerialen en materialen voor de WTW-unit worden verminderd.","n2":"Het energieverbruik voor verwarming neemt toe. Gebruik impactberekeningen om te beoordelen of de materiaalbesparing opweegt tegen de hogere impact in de gebruiksfase van jouw ontwerp."},{"t":"Consider alternative (low-impact) materials for AHU housing.","s":"reconsider","c":"gen","f":"ventilation","l":"component","a":["c"],"g":["m"],"w":"Material impact will be reduced.","n":"Alternative materials could have a shorter lifespan. Evaluate whether this is the case.","t2":"Overweeg alternatieve materialen (met lage impact) voor LBK-behuizingen.","w2":"De materiaalimpact neemt af.","n2":"Alternatieve materialen kunnen een kortere levensduur hebben. Ga na of dit het geval is."},{"t":"Design adaptively to accommodate changes in space functions.","s":"reconsider","c":"gen","f":"ventilation","l":"system","a":["c"],"g":["m"],"w":"This allows for future changes, and prevents the need to add more materials in the future.","n":"If the use scenario does not change, the initially extra added materials will not be used in the end.","t2":"Ontwerp adaptief, zodat ruimten van functie kunnen veranderen.","w2":"Dit maakt toekomstige aanpassingen mogelijk en voorkomt dat er later extra materialen nodig zijn.","n2":"Als het gebruik niet verandert, worden de extra toegevoegde materialen uiteindelijk niet benut."},{"t":"Design ventilation boxes to be more robust (longer lifespan, better components).","s":"reconsider","c":"gen","f":"ventilation","l":"product","a":["r"],"g":["m"],"w":"This will reduce premature failure and increase lifespan.","n":"This will lead to a higher initial impact as a result of using more materials, which should be compensated through the elongated lifetime.","t2":"Ontwerp ventilatieboxen robuuster (langere levensduur, betere componenten).","w2":"Dit vermindert voortijdige uitval en verlengt de levensduur.","n2":"Dit geeft een hogere initiële impact door meer materiaalgebruik, wat moet worden gecompenseerd door de langere levensduur."},{"t":"Avoid taper-cutting air ducts. Avoiding tapers will increase material usage (due to larger diameters), but failure costs and energy costs are reduced, and flexibility and reuse opportunities are increased.","s":"reconsider","c":"dist","f":"ventilation","l":"product","a":["c"],"g":["m"],"w":"This increases flexibilty and reuse opportunity, and reduces failure and energy costs.","n":"Initially, this will require more material. This should be compensated for by reduced failures and product life extension through adaption or reuse of the ducts.","t2":"Vermijd verjongingen in luchtkanalen. Zonder verjongingen is meer materiaal nodig (grotere diameters), maar faal- en energiekosten dalen en flexibiliteit en hergebruikmogelijkheden nemen toe.","w2":"Dit vergroot de flexibiliteit en de kans op hergebruik, en verlaagt storingen en energiekosten.","n2":"In eerste instantie is hiervoor meer materiaal nodig. Dit zou moeten worden gecompenseerd door minder storingen en een langere levensduur door aanpassing of hergebruik van de kanalen."},{"t":"Consider whether ductless or duct-poor solutions are possible.","s":"reconsider","c":"dist","f":"ventilation","l":"system","a":["r"],"g":["m"],"w":"Using new materials is avoided.","n":"Ductless or duct-poor solutions might require more generation units, which could lead to an increased environmental impact. Use impact-calculations to evaluate the effectiveness of this intervention for your designed system.","t2":"Ga na of kanaalloze of kanaalarme oplossingen mogelijk zijn.","w2":"Het gebruik van nieuwe materialen wordt vermeden.","n2":"Kanaalloze of kanaalarme oplossingen kunnen meer opwekkers vragen, wat de milieu-impact kan verhogen. Gebruik impactberekeningen om de effectiviteit van deze ingreep voor jouw ontwerp te beoordelen."},{"t":"Use biobased materials.","s":"reconsider","c":"dist","f":"ventilation","l":"component","a":["c","r"],"g":["m"],"w":"Using biobased insulation rather than non-biobased materials often reduces the embodied carbon of the system and makes use of renewable materials.","n":"Using biobased materials might reduce the durability. Evaluate whether this is the case.","t2":"Gebruik biobased materialen.","w2":"Biobased isolatie in plaats van niet-biobased materialen verlaagt vaak de gebonden CO2 van het systeem en maakt gebruik van hernieuwbare materialen.","n2":"Biobased materialen kunnen minder duurzaam zijn. Ga na of dit het geval is."},{"t":"Reduce as much as possible by reconsidering opening windows.","s":"reconsider","c":"term","f":"ventilation","l":"system","a":["c","r"],"g":["m"],"w":"Using new materials is avoided.","n":"Using natural ventilation will increase the energy use of heating, or if ventilated insufficiently reduce the healthiness provided by the system.  Use impact-calculations to evaluate whether the material reduction from this intervention weighs up to the increased impact in the operational phase for your designed system.","t2":"Beperk zoveel mogelijk door te heroverwegen of ramen open kunnen.","w2":"Het gebruik van nieuwe materialen wordt vermeden.","n2":"Natuurlijke ventilatie verhoogt het energieverbruik voor verwarming, of verlaagt bij onvoldoende ventilatie de gezondheid van het binnenklimaat. Gebruik impactberekeningen om te beoordelen of de materiaalbesparing opweegt tegen de hogere impact in de gebruiksfase van jouw ontwerp."},{"t":"Use adaptive delivery systems.","s":"reconsider","c":"term","f":"ventilation","l":"product","a":["c","r"],"g":["m"],"w":"This improves energy-efficiency, reduces wear and increases the chance that products can be reused when a building is transformed.","n":"Initially, this requires an increase in materials, which should be compensated for by elongated lifetime of components and decreased energy use.","t2":"Gebruik adaptieve afgiftesystemen.","w2":"Dit verbetert de energie-efficiëntie, vermindert slijtage en vergroot de kans dat producten kunnen worden hergebruikt als een gebouw wordt getransformeerd.","n2":"In eerste instantie zijn hiervoor meer materialen nodig, wat zou moeten worden gecompenseerd door een langere levensduur van componenten en een lager energieverbruik."},{"t":"Avoid mechanical components if possible.","s":"reconsider","c":"term","f":"ventilation","l":"component","a":["c","r"],"g":["m"],"w":"Mechanical components are more prone to wear and failure.","n":"Avoiding mechanical components and therefore changing to manual systems can increase operational energy use. Use impact-calculations to evaluate the effectiveness of this intervention for your designed system.","t2":"Vermijd waar mogelijk mechanische componenten.","w2":"Mechanische componenten zijn gevoeliger voor slijtage en uitval.","n2":"Mechanische componenten vermijden, en dus overstappen op handbediende systemen, kan het operationele energieverbruik verhogen. Gebruik impactberekeningen om de effectiviteit van deze ingreep voor jouw ontwerp te beoordelen."},{"t":"Reduce the vulnerability of controls (fire/valves).","s":"reconsider","c":"ctrl","f":"ventilation","l":"product","a":["c","r"],"g":["m"],"w":"This will reduce premature failure and increase lifespan.","n":"Initially, this requires an increase in materials, which should be compensated through the elongated lifetime.","t2":"Verminder de kwetsbaarheid van regelingen (brand/kleppen).","w2":"Dit vermindert voortijdige uitval en verlengt de levensduur.","n2":"Dit vraagt eerst om meer materiaal, wat moet worden gecompenseerd door de langere levensduur."},{"t":"Design with generic hardware solutions and control more with software.","s":"reconsider","c":"ctrl","f":"ventilation","l":"product","a":["c","r"],"g":["m"],"w":"This is a form of standardisation which will allow for easier reuse after an initial lifetime.","n":"Initially, this might require an increase in materials.","t2":"Ontwerp met generieke hardware-oplossingen en regel meer met software.","w2":"Dit is een vorm van standaardisatie die hergebruik na een eerste levensduur makkelijker maakt.","n2":"Dit kan eerst om meer materiaal vragen."},{"t":"Use more robust PCBs/electronics that are easier to repair. There's often plenty of room for this; it's not a mobile phone.","s":"reconsider","c":"ctrl","f":"ventilation","l":"component","a":["c","r"],"g":["m"],"w":"Product life of existing materials/products is prolongued.","n":"Initially, this might require an increase in materials.","t2":"Gebruik robuustere printplaten/elektronica die makkelijker te repareren zijn. Er is vaak ruimte genoeg; het is geen mobiele telefoon.","w2":"De levensduur van bestaande materialen/producten wordt verlengd.","n2":"Dit kan eerst om meer materiaal vragen."},{"t":"Add fans to the radiators.","s":"reconsider","c":"term","f":"heating","l":"system","a":["c","r"],"g":["m","e"],"w":"This makes the heat emission from the radiator more efficient, reducing the radiator size needed for heating, or enabling radiators with too low capacity to be reusable in spaces that would otherwise require larger radiators or in low temperature systems.","n":"This will emit fan noise, and requires additional ventilator materials and electricity use to operate them. Use impact-calculations to evaluate the effectiveness of this intervention for your designed system.","t2":"Voeg ventilatoren toe aan de radiatoren.","w2":"Dit maakt de warmteafgifte van de radiator efficiënter, waardoor een kleinere radiator volstaat, of radiatoren met te weinig vermogen kunnen worden hergebruikt in ruimtes die anders grotere radiatoren nodig hebben of in lagetemperatuursystemen.","n2":"Dit veroorzaakt ventilatorgeluid en vraagt extra materialen voor ventilatoren en elektriciteit om ze te laten draaien. Gebruik impactberekeningen om de effectiviteit van deze interventie voor jouw ontwerp te beoordelen."},{"t":"Use adaptive terminal units with variable adjustable capacity.","s":"reconsider","c":"term","f":"cooling","l":"product","a":["c","r"],"g":["m","e"],"w":"This improves energy-efficiency, reduces wear and increases the chance that products can be reused when a building is transformed.","n":"Initially, this requires an increase in materials, which should be compensated for by elongated lifetime of components and decreased energy use.","t2":"Gebruik adaptieve afgifte-units met een variabel instelbaar vermogen.","w2":"Dit verbetert de energie-efficiëntie, vermindert slijtage en vergroot de kans dat producten kunnen worden hergebruikt als een gebouw wordt getransformeerd.","n2":"In eerste instantie zijn hiervoor meer materialen nodig, wat zou moeten worden gecompenseerd door een langere levensduur van componenten en een lager energieverbruik."},{"t":"Use a collective generation unit instead of individual generation units.","s":"reconsider","c":"gen","f":"heating","l":"system","a":["r"],"g":["m","e"],"w":"Using one, big generation unit uses less materials than multiple individual ones. A big generation unit is also better controllable in terms of grid demands. Less installed heating-  and buffer capacity is required due to reduced simultaneity. Less maintenance is required.","n":"This will require extra distribution material and has consequent distribution losses. Use impact-calculations to evaluate the effectiveness of this intervention for your designed system.","t2":"Gebruik een collectieve opwekker in plaats van individuele opwekkers.","w2":"Eén grote opwekker gebruikt minder materiaal dan meerdere losse. Een grote opwekker is ook beter te regelen met het oog op netbelasting. Door minder gelijktijdigheid is minder verwarmings- en buffervermogen nodig. Er is minder onderhoud nodig.","n2":"Dit vraagt om extra distributiemateriaal en geeft daardoor distributieverliezen. Gebruik impactberekeningen om de effectiviteit van deze ingreep voor jouw ontwerp te beoordelen."},{"t":"Use decentralised systems to reduce the need for distribution.","s":"reconsider","c":"dist","f":"heating","l":"system","a":["c","r"],"g":["m","e"],"w":"Decentralised systems remove/reduce needed distribution. People have their own meter, which makes people more motivated to be mindful about their energy consumption.","n":"This will require extra initial materials. Use impact-calculations to evaluate the effectiveness of this intervention for your designed system.","t2":"Gebruik decentrale systemen om de benodigde distributie te verminderen.","w2":"Decentrale systemen maken distributie overbodig of beperken die. Bewoners hebben een eigen meter, wat hen motiveert bewust met energie om te gaan.","n2":"Dit vraagt om extra materiaal vooraf. Gebruik impactberekeningen om de effectiviteit van deze ingreep voor jouw ontwerp te beoordelen."},{"t":"Define terminal units based on cooling demand, not on heating demand.","s":"reconsider","c":"term","f":"heating","l":"system","a":["c"],"g":["m","e"],"w":"This makes terminal units multifunctional and allows for using them for cooling purposes as well.","n":"In case the terminal units are only used for heating, the units will be overdimensioned.","t2":"Dimensioneer afgifte-units op de koelvraag, niet op de warmtevraag.","w2":"Dit maakt afgifte-units multifunctioneel, zodat ze ook voor koeling kunnen worden gebruikt.","n2":"Als de afgifte-units alleen voor verwarming worden gebruikt, zijn ze overgedimensioneerd."},{"t":"Use predictive maintenance instead of preventive maintenance.","s":"reconsider","c":"ctrl","f":"heating","l":"product","a":["c","r"],"g":["m","e"],"w":"This ensures that parts are not replaced prematurely, saving unnecessary material replacement and transportation.","n":"Initially, more sensors and control technology needs to be added, which should be compensated for by elongated lifetime of other components.","t2":"Gebruik voorspellend onderhoud in plaats van preventief onderhoud.","w2":"Dit voorkomt dat onderdelen te vroeg worden vervangen en bespaart onnodig materiaal en transport.","n2":"In eerste instantie moeten er meer sensoren en regeltechniek worden toegevoegd, wat zou moeten worden gecompenseerd door een langere levensduur van andere componenten."},{"t":"Reconsider whether humidification is necessary for a short period of the year.","s":"reconsider","c":"gen","f":"ventilation","l":"system","a":["c"],"g":["m","e"],"w":"Components to provide the humidification can be eliminated.","n":"Indoor comfort may be insufficient in a short period of the year.","t2":"Heroverweeg of bevochtiging nodig is voor een korte periode van het jaar.","w2":"Componenten voor bevochtiging kunnen vervallen.","n2":"Het binnencomfort kan gedurende een korte periode van het jaar onvoldoende zijn."},{"t":"Apply predictive maintenance for filter contamination.","s":"reconsider","c":"ctrl","f":"ventilation","l":"product","a":["c","r"],"g":["m","e"],"w":"This ensures that maintenance happens (only) when it is necessary.","n":"Initially, this requires an increase in materials, which should be compensated by avoiding overusing maintenance materials.","t2":"Pas voorspellend onderhoud toe voor filtervervuiling.","w2":"Zo vindt onderhoud (alleen) plaats wanneer het nodig is.","n2":"Dit vraagt eerst om meer materiaal, wat moet worden gecompenseerd door minder overbodig gebruik van onderhoudsmaterialen."},{"t":"Use a dry underfloor system for heating and cooling instead of a wet underfloor system.","s":"reconsider","c":"term","f":"heating","l":"product","a":["c","r"],"g":["m","e"],"w":"This enables disassembly and reuse.","n":"No side effects are expected.","t2":"Gebruik een droog vloersysteem voor verwarming en koeling in plaats van een nat vloersysteem.","w2":"Dit maakt demontage en hergebruik mogelijk.","n2":"Er worden geen neveneffecten verwacht."},{"t":"Use detachable filters that can be changed at a measured pressure difference.","s":"reconsider","c":"dist","f":"ventilation","l":"component","a":["c","r"],"g":["m","e"],"w":"This prevents premature filter replacement and optimises the energy needed for air distribution.","n":"This requires additional sensors.","t2":"Gebruik uitneembare filters die worden vervangen bij een gemeten drukverschil.","w2":"Dit voorkomt dat filters te vroeg worden vervangen en optimaliseert de energie die nodig is voor luchttransport.","n2":"Hiervoor zijn extra sensoren nodig."},{"t":"Make use of residual heat via district heating.","s":"reconsider","c":"gen","f":"heating","l":"system","a":["c","r"],"g":["e"],"w":"This can save energy.","n":null,"t2":"Maak gebruik van restwarmte via een warmtenet.","w2":"Dit kan energie besparen.","n2":null},{"t":"Use smart control systems that factor in weather forecasts. Use algorithms and historical data to identify patterns and create weather-dependent controls.","s":"reconsider","c":"ctrl","f":"heating","l":"system","a":["c","r"],"g":["e"],"w":"This can save energy.","n":null,"t2":"Gebruik slimme regelsystemen die rekening houden met weersverwachtingen. Gebruik algoritmen en historische data om patronen te herkennen en een weersafhankelijke regeling te maken.","w2":"Dit kan energie besparen.","n2":null},{"t":"Limit the setpoint temperature (for example, depending on the outside temperature). The system won't perform better if you default to a temperature that's too low (and it's also unhealthy and uncomfortable).","s":"reconsider","c":"ctrl","f":"cooling","l":"system","a":["r"],"g":["e"],"w":null,"n":null,"t2":"Begrens de setpointtemperatuur (bijvoorbeeld afhankelijk van de buitentemperatuur). Het systeem presteert niet beter als je standaard een te lage temperatuur instelt (en dat is ook ongezond en oncomfortabel).","w2":null,"n2":null},{"t":"Use algorithms and historical data to recognize patterns and create weather-dependent controls.","s":"reconsider","c":"ctrl","f":"cooling","l":"system","a":["c","r"],"g":["e"],"w":"This can save energy.","n":null,"t2":"Gebruik algoritmen en historische data om patronen te herkennen en een weersafhankelijke regeling te maken.","w2":"Dit kan energie besparen.","n2":null},{"t":"Use frequency-controlled DC fans.","s":"reconsider","c":"gen","f":"ventilation","l":"component","a":["c","r"],"g":["e"],"w":"This saves energy.","n":null,"t2":"Gebruik toerengeregelde DC-ventilatoren.","w2":"Dit bespaart energie.","n2":null},{"t":"Keep heat outside: do not place air intake on the south side.","s":"reconsider","c":"gen","f":"ventilation","l":"system","a":["c","r"],"g":["e"],"w":"This saves energy needed for cooling.","n":null,"t2":"Houd warmte buiten: plaats de luchtinlaat niet aan de zuidzijde.","w2":"Dit bespaart energie voor koeling.","n2":null},{"t":"Apply local ventilation, for example by applying CO2 control.","s":"reconsider","c":"ctrl","f":"ventilation","l":"system","a":["c","r"],"g":["e"],"w":"This can save energy.","n":null,"t2":"Pas lokale ventilatie toe, bijvoorbeeld met CO2-sturing.","w2":"Dit kan energie besparen.","n2":null},{"t":"Use algorithms and historical data to recognize patterns, apply AI.","s":"reconsider","c":"ctrl","f":"ventilation","l":"system","a":["c","r"],"g":["e"],"w":"This can save energy.","n":null,"t2":"Gebruik algoritmen en historische data om patronen te herkennen, pas AI toe.","w2":"Dit kan energie besparen.","n2":null},{"t":"Expand system C ventilation to balanced ventilation.","s":"reconsider","c":"gen","f":"ventilation","l":"system","a":["c","r"],"g":["e"],"w":"The size of radiators can be reduced with balanced ventilation.","n":null,"t2":"Breid ventilatiesysteem C uit naar gebalanceerde ventilatie.","w2":"Met gebalanceerde ventilatie kunnen radiatoren kleiner worden.","n2":null},{"t":"Use underfloor heating instead of radiators when a new distribution system needs to be installed.","s":"reconsider","c":"term","f":"heating","l":"system","a":["c","r"],"g":["e"],"w":"This makes heating with lower temperatures possible, therefore lowering energy demand.","n":"Underfloor heating is difficult to repair as components are often not easy to disassembly. A careful and robust design is therefore important.","t2":"Gebruik vloerverwarming in plaats van radiatoren als er een nieuw distributiesysteem nodig is.","w2":"Dit maakt verwarmen op lagere temperaturen mogelijk en verlaagt zo de energievraag.","n2":"Vloerverwarming is lastig te repareren omdat onderdelen vaak moeilijk te demonteren zijn. Een zorgvuldig en robuust ontwerp is daarom belangrijk."},{"t":"Consider use of gas boilers for peak loads only, can cause large reduction of installed heat pump capacity.","s":"reconsider","c":"gen","f":"heating","l":"system","a":["c","r"],"g":["m"],"w":"The capacity of the heat pump and related materials can be reduced.","n":"Additional materials for the gas boiler are necessary, and when the heat pump's capacity is too low, emissions from the gas boiler might rule out the benefits from the material savings. Use impact-calculations to evaluate the effectiveness of this intervention for your designed system.","t2":"Overweeg een gasketel alleen voor piekbelasting; dit kan het geïnstalleerde vermogen van de warmtepomp flink verkleinen.","w2":" ponent","a":["c","r"],"g":["m"],"w":"Product life of existing materials/products is prolongued.","n":"Reusing old components (even after remanufacturing) could lead to higher energy use than using newer, more energy-efficient components. Also, initially new materials might need to be added, which should be compensated for by elongated lifetime of other components.","t2":"Reviseer en repareer mechanische onderdelen, repareer en controleer passieve onderdelen (bijv. condensafvoer).","w2":"De levensduur van bestaande materialen/producten wordt verlengd.","n2":"Hergebruik van oude componenten (ook na revisie) kan leiden tot een hoger energieverbruik dan nieuwere, energiezuinigere componenten. Ook kunnen er eerst nieuwe materialen nodig zijn, wat moet worden gecompenseerd door een langere levensduur van andere componenten."},{"t":"Perform software updates.","s":"repair_on","c":"ctrl","f":"heating","l":"product","a":["c","r"],"g":["m","e"],"w":"Through software updates, products can be kept in use and the efficiency of products can be upgraded.","n":"There are no side effects expected.","t2":"Voer software-updates uit.","w2":"Met software-updates blijven producten langer in gebruik en kan hun efficiëntie worden verbeterd.","n2":"Er worden geen neveneffecten verwacht."},{"t":"Check wiring, calibrate sensors.","s":"repair_on","c":"ctrl","f":"heating","l":"component","a":["c","r"],"g":["m","e"],"w":"Repair & effectiveness upgrade.","n":"There are no side effects expected.","t2":"Controleer bekabeling, kalibreer sensoren.","w2":"Reparatie en verbetering van de effectiviteit.","n2":"Er worden geen neveneffecten verwacht."},{"t":"Promote cleaning and maintenance of ventilation ducts (e.g., in accordance with BKN/Healthy Indoors guidelines): this extends the lifespan of components.","s":"repair_on","c":"dist","f":"ventilation","l":"product","a":["c","r"],"g":["m","e"],"w":"Product life of existing materials/products is prolongued.","n":"This requires additional transportation.", function renderInfo(){
  const t=L(), N=t.IN, RNx={context:'I',building:'II',system:'III',product:'IV',component:'V'};
  $('info-e').textContent=t.name; $('info-t').textContent=t.infoT; $('info-x').setAttribute('aria-label',t.close);
  const order=['guidelines','demand','systems'];
  $('info-b').innerHTML=`<p class="inf-lead">${N.lead}</p>
    <section class="inf-s"><h3>${N.h1}</h3><p>${N.p1}</p>
      <div class="inf-types">${order.map(id=>`<button type="button" class="inf-type" data-itab="${id}"><b>${t.pg[id]}</b><span>${N.types[id]}</span><em>${N.go} ${I.arrow}</em></button>`).join('')}</div></section>
    <section class="inf-s"><h3>${N.h2}</h3><p>${N.p2}</p>
      <div class="inf-grid">${N.fodar.map(([k,n,ex])=>`<div class="inf-card"><div class="inf-l">${k}</div><div class="inf-img"><img src="${IIC[k]}" alt=""></div><b>${n}</b><ul>${ex.map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('')}</div></section>
    <section class="inf-s"><h3>${N.h3}</h3><p>${N.p3}</p>
      <div class="inf-grid">${ALL.l.map(k=>`<div class="inf-card lv"><div class="inf-l">${RNx[k]}</div><div class="inf-img"><img src="${IIC[k]}" alt=""></div><b>${t.LV[k]}</b><ul>${N.lvx[k].map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('')}</div></section>
    <section class="inf-s"><h3>${N.h4}</h3><p>${N.p4}</p>
      <div class="inf-who">${N.who.map(([r,txt,lv])=>`<div class="inf-w"><b>${r}</b><span>${txt}</span></div>`).join('')}</div></section>
    <p class="inf-src">${N.src}</p>`;
}
const infoDlg=$('info');
function openInfo(){ renderInfo(); $('info-b').scrollTop=0; if(infoDlg.showModal) infoDlg.showModal(); else infoDlg.setAttribute('open',''); }
$('infoBtn').addEventListener('click',openInfo);
$('info-x').addEventListener('click',()=>infoDlg.close());
infoDlg.addEventListener('click',e=>{ if(e.target===infoDlg){ infoDlg.close(); return; }
  const tb=e.target.closest('[data-itab]'); if(tb){ infoDlg.close(); S.mode='table'; S.tab=tb.dataset.itab; S.h=null; S.pin=null; S.pinG=null; draw(); window.scrollTo({top:0,behavior:'smooth'}); } });
$('cartBtn').addEventListener('click',openCart);
$('cart-x').addEventListener('click',closeCart);
$('cartBg').addEventListener('click',closeCart);
$('cart').addEventListener('click',e=>{ const el=e.target;
  const o=el.closest('[data-copen]'); if(o){ openDlg(CREG[+o.dataset.copen].g); return; }
  const r=el.closest('[data-crm]'); if(r){ toggleAp(CREG[+r.dataset.crm].t); return; }
  if(el.closest('#ccsv')){ cartCSV(); return; }
  if(el.closest('#cprint')){ printCart(); return; } });
function openDlg(g){
  const t=L(), it=g.src; DLG=g;
  const strat=t.ST[g.s];
  $('dlg-e').textContent=g.c&&g.c!=='gen_all'?`${strat} · ${t.CO[g.c]}`:strat;
  $('dlg-t').textContent=tx(it,'t');
  const a=DATA.filter(x=>x.t===g.t); const fs=new Set(a.map(x=>x.f)), ls=new Set(a.map(x=>x.l)), as=new Set(a.flatMap(x=>x.a)), gl=new Set(a.flatMap(x=>x.g));
  if($('dlg-m')) $('dlg-m').innerHTML=lvSort(ls).map(l=>`<span class="ct lv">${RN[l]} · ${t.LV[l]}</span>`).join('')+(gl.has('m')?`<span class="ct m">${t.tagM}</span>`:'')+(gl.has('e')?`<span class="ct e">${t.tagE}</span>`:'');
  const w=tx(it,'w'), n=tx(it,'n');
  $('dlg-w').textContent=w||t.noWhy; $('dlg-w').className=w?'':'na';
  $('dlg-n').textContent=n||t.noNeg; $('dlg-n').className=n?'':'na';
  const rows=[[t.kFn,[...fs].map(f=>t.FN[f]).join(', ')],[t.kLv,lvSort(ls).map(l=>t.LV[l]).join(', ')],[t.kCo,t.CO[g.c]],
    [/^[dg]_/.test(g.s)?t.kCat:t.kSt,strat],[t.kAp,[...as].sort().map(x=>t.AP[x]).join(', ')],[t.kGo,[...gl].map(x=>t.GO[x]).join(t.and)||t.notSpec]];
  $('dlg-kv').innerHTML=rows.map(([k,v])=>`<tr><th scope="row">${k}</th><td>${esc(v)}</td></tr>`).join('');
  dlgAp();
  if(dlg.showModal) dlg.showModal(); else dlg.setAttribute('open','');
}
$('dlg-x').addEventListener('click',()=>dlg.close());
dlg.addEventListener('click',e=>{if(e.target===dlg) dlg.close();});

S3.onPick(hk=>{ if(!S.f){ const fn=$('fnote'); if(fn){ fn.classList.remove('nudge'); void fn.offsetWidth; fn.classList.add('nudge'); } document.querySelectorAll('.pill[data-f]').forEach(b=>{b.classList.remove('pulse'); void b.offsetWidth; b.classList.add('pulse');}); return; } S.view=null; S.pin=null; S.pinG=null; if(hk){ S.h=(S.h===hk)?null:hk; } else if(S.h){ S.h=null; } else return; update(); });
S3.onHover(hk=>{ document.querySelectorAll('.mk.hov').forEach(e=>e.classList.remove('hov')); if(hk){const e=$('mk-'+hk); if(e) e.classList.add('hov');} });
document.addEventListener('mouseover',e=>{ const r=e.target.closest&&e.target.closest('.ivr'); const ng=r?REG[+r.querySelector('.iv').dataset.i]:null; if(ng!==HOVG){ HOVG=ng; refreshFx(); }
const m=e.target.closest&&e.target.closest('.mk,.gnl'); if(m&&m.dataset.h&&m.dataset.h!=='gnl') S3.hover(m.dataset.h);});
document.addEventListener('mouseout',e=>{const m=e.target.closest&&e.target.closest('.mk'); if(m&&!(e.relatedTarget&&m.contains(e.relatedTarget))) S3.hover(null);});
try{THUMB.r=S3.thumb('r',960,600);THUMB.c=S3.thumb('c',960,600);}catch(e){}
draw();
addEventListener('resize',()=>{S3.resize();frame();});
const setH=()=>document.documentElement.style.setProperty('--head-h',($('head').offsetHeight+8)+'px');
setH(); addEventListener('resize',setH);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(setH);
})();
</script>
