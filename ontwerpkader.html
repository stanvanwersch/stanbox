<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Circular HVAC Design Framework</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,600;1,600&family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: FCAB-site shell, light only — floating white topbar (title, search, language, partner logos),
   sticky left rail (navigation + filters), one reading canvas with the matrix as an FCAB table. */
:root{
  color-scheme:light;
  --cream:#faf9f7; --white:#ffffff; --border:#e8e4de; --border2:#d4cfc8;
  --text:#1c1a17; --text2:#5a5650; --text3:#9c9690;
  --accent:#e07a2f; --accent-s:rgba(224,122,47,.09); --accent-b:rgba(224,122,47,.22);
  --green:#1a6e3c; --green-s:rgba(26,110,60,.08); --green-b:rgba(26,110,60,.18);
  --amber:#b45309; --amber-s:rgba(180,83,9,.08); --amber-b:rgba(180,83,9,.18);
  --red:#b91c1c; --red-s:rgba(185,28,28,.07); --red-b:rgba(185,28,28,.16);
  --neutral-s:#f0ede8; --hover:rgba(0,0,0,.025);
  --shadow-soft:rgba(28,26,23,.08); --shadow-card:rgba(0,0,0,.08);
  --beta-bg:#1c1a17; --beta-t:#ffffff;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --wordmark:'Poppins',system-ui,sans-serif;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);background:var(--cream);color:var(--text);font-size:15px;line-height:1.72;padding-inline:16px;padding-block:0 16px}
::selection{background:var(--accent-b)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button,input{font-family:var(--sans);color:var(--text)}

/* topbar */
.topbar{position:relative;background:var(--white);border-radius:18px;box-shadow:0 4px 24px var(--shadow-soft);
  min-height:84px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px 24px;padding:12px 28px 12px 28px;max-width:1440px;margin:0 auto}
.title{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.title span{font-size:13.6px;color:var(--text2);letter-spacing:.1px;line-height:1.35;white-space:nowrap}
.title span:first-child{font-weight:600;color:var(--text)}
.search{justify-self:center;width:100%;max-width:470px;display:flex;align-items:center;gap:10px}
.search .ss-box{flex:1;min-width:0}
.ss-box{display:flex;align-items:center;gap:8px;border:1px solid var(--border2);border-radius:20px;background:var(--white);padding:8px 14px;color:var(--text3)}
.ss-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-s)}
.ss-box input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:13px}
.ss-box input::-webkit-search-cancel-button{display:none}
.ss-box input::placeholder{color:var(--text3)}
.ss-x{border:0;background:none;color:var(--text3);font-size:17px;line-height:1;cursor:pointer;padding:0 2px}
.tr{display:flex;align-items:center;gap:18px}
.lang{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid var(--border);background:var(--white);color:var(--text2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:10.5px;font-weight:700;letter-spacing:.2px;transition:color .15s,border-color .15s,background .15s}
.lang:hover{color:var(--accent);border-color:var(--accent-b);background:var(--accent-s)}
.logos{display:flex;align-items:center;gap:18px}
.logos a{display:block;line-height:0}
.logos img{height:32px;width:auto;display:block}
.logos .sep{width:1px;height:30px;background:var(--border)}
.beta{font-family:var(--wordmark);font-size:14px;font-weight:600;font-style:italic;color:var(--beta-t);background:var(--beta-bg);padding:4px 12px;border-radius:20px}

/* page */
.wrap{max-width:1280px;margin:0 auto;padding:30px 12px 80px}
.page[hidden]{display:none}
h1{font-size:32px;font-weight:700;color:var(--text);line-height:1.2;letter-spacing:-.7px;margin:0 0 10px;text-wrap:balance}
h1 em{font-style:italic;font-weight:300;color:var(--text2)}
.lead{font-size:16px;font-weight:300;color:var(--text2);line-height:1.7;margin:0 0 24px;max-width:720px}
.src{font-size:12px;color:var(--text3);font-weight:300;margin:28px 0 0;max-width:90ch;line-height:1.6}

/* sticky head: topbar + part tabs */
.head{position:sticky;top:0;z-index:200;background:var(--cream);padding-top:calc(env(safe-area-inset-top,0px) + 16px);margin-inline:-16px;padding-inline:16px}
.head-tabs{max-width:1280px;margin:0 auto;padding:14px 12px 0}
/* part tabs (FCAB .tabs) */
.ptabs{display:flex;border-bottom:1.5px solid var(--border);margin:0;gap:0 4px;overflow-x:auto;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.ptab{padding:10px 18px;cursor:pointer;font-size:14px;font-weight:500;color:var(--text3);background:transparent;border:0;border-bottom:2px solid transparent;margin-bottom:-1.5px;white-space:nowrap}
.ptab:hover{color:var(--text)}
.ptab.on{color:var(--accent);border-bottom-color:var(--accent)}
.ptab .nc{font-size:11px;font-weight:600;margin-left:7px;color:var(--text3);font-variant-numeric:tabular-nums}
.ptab.on .nc{color:var(--accent)}

/* filter bar */
.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 16px}
.fbar-l{font-size:12px;font-weight:500;color:var(--text3);margin-right:4px}
.dd{position:relative}
.ddb{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border2);background:var(--white);border-radius:20px;padding:7px 12px 7px 15px;font-size:13px;color:var(--text2);cursor:pointer;line-height:1.3;transition:color .15s,border-color .15s,background .15s}
.ddb:hover{color:var(--text);border-color:var(--accent-b)}
.ddb svg{opacity:.55;transition:transform .15s}
.ddb[aria-expanded="true"] svg{transform:rotate(180deg)}
.ddb.act{border-color:var(--accent-b);background:var(--accent-s);color:var(--accent);font-weight:500}
.ddb .cnt{font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.ddm{position:absolute;top:calc(100% + 6px);left:0;z-index:60;background:var(--white);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 32px var(--shadow-soft);padding:6px 0;min-width:230px;max-width:calc(100vw - 32px)}
.ddm.r{left:auto;right:0}
.fi{display:flex;align-items:center;gap:10px;width:100%;padding:7px 16px;cursor:pointer;color:var(--text2);font-size:13px;border:0;background:none;text-align:left;line-height:1.4;white-space:nowrap}
.fi:hover{background:var(--hover);color:var(--text)}
.fi .bx{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--border2);flex:none;display:grid;place-items:center;background:var(--white)}
.fi[aria-pressed="true"]{color:var(--text)}
.fi[aria-pressed="true"] .bx{background:var(--accent);border-color:var(--accent)}
.fi[aria-pressed="true"] .bx::after{content:"";width:6px;height:3.5px;border-left:1.6px solid #fff;border-bottom:1.6px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.fi .ic{display:flex;color:var(--text3)}
.fi .rn{font-size:10.5px;font-weight:700;color:var(--text3);min-width:20px;font-variant-numeric:tabular-nums}
.rreset{border:0;background:none;color:var(--accent);font-size:12.5px;font-weight:500;cursor:pointer;padding:4px 6px}
.rreset:hover{text-decoration:underline}

.pills{display:flex;border-bottom:1.5px solid var(--border);margin:0 0 16px;flex-wrap:wrap}
.pill{padding:8px 16px;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--text3);background:transparent;border:0;border-bottom:2px solid transparent;margin-bottom:-1.5px;white-space:nowrap}
.pill.on{color:var(--accent);border-bottom-color:var(--accent)}
.pill:hover{color:var(--text)}
.pill .nc{font-size:10.5px;font-weight:600;margin-left:6px;color:var(--text3);font-variant-numeric:tabular-nums}
.pill.on .nc{color:var(--accent)}

.tw{border:1px solid var(--border);border-radius:var(--r);overflow-x:auto;background:var(--white)}
table.mx{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed;min-width:760px}
.mx th{background:var(--accent-s);color:var(--text2);font-weight:600;font-size:11.5px;letter-spacing:.2px;padding:10px 14px;text-align:left;border-bottom:1.5px solid var(--accent-b)}
.mx th.rh{width:150px}
.mx tbody th{background:var(--cream);border-bottom:1px solid var(--border);border-right:1px solid var(--border);vertical-align:top;font-size:12.5px;color:var(--text);line-height:1.4;padding:12px 14px}
.mx td{padding:6px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);vertical-align:top}
.mx td:last-child{border-right:0}
.mx tbody tr:last-child td,.mx tbody tr:last-child th{border-bottom:0}
.mx.single{min-width:560px}
.cell{display:flex;flex-direction:column;gap:2px}
.empty{font-size:12px;color:var(--text3);padding:6px 8px}
.iv{display:flex;flex-direction:column;gap:4px;text-align:left;width:100%;border:0;background:none;border-radius:6px;padding:7px 8px;font-size:12.5px;line-height:1.45;color:var(--text2);cursor:pointer}
.iv:hover{background:var(--accent-s);color:var(--text)}
.iv .tx{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.ct{font-size:10px;font-weight:600;padding:0 6px;border-radius:2px;letter-spacing:.3px;line-height:1.7;border:1px solid}
.ct.lv{background:var(--neutral-s);color:var(--text2);border-color:var(--border)}
.ct.m{background:var(--amber-s);color:var(--amber);border-color:var(--amber-b)}
.ct.e{background:var(--green-s);color:var(--green);border-color:var(--green-b)}
.ct.w{background:var(--red-s);color:var(--red);border-color:var(--red-b)}
.fn{display:inline-flex;color:var(--text3)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--text3);align-items:center;margin:12px 0 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.nores{padding:26px 16px;text-align:center;color:var(--text3);font-size:13.5px}
.link{color:var(--accent);cursor:pointer;background:none;border:0;padding:0;font:inherit}
.link:hover{text-decoration:underline}

dialog{border:1px solid var(--border);padding:0;border-radius:20px;background:var(--white);color:var(--text);max-width:min(600px,calc(100vw - 32px));width:100%;box-shadow:0 16px 44px var(--shadow-card)}
dialog::backdrop{background:rgba(28,26,23,.45)}
.dl{display:flex;flex-direction:column;gap:12px;padding:24px 26px 26px}
.dl-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dl .eb{font-size:11px;font-weight:500;letter-spacing:.4px;color:var(--text3);margin-bottom:4px}
.dl h3{font-size:18px;font-weight:600;line-height:1.4;margin:0;text-wrap:balance}
.dx{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid var(--border);background:var(--white);color:var(--text2);display:flex;align-items:center;justify-content:center;cursor:pointer}
.dx:hover{color:var(--accent);border-color:var(--accent-b);background:var(--accent-s)}
.dsec{border-radius:var(--r);border:1px solid;padding:12px 16px 12px 44px;position:relative;font-size:13.5px;line-height:1.6;color:var(--text2)}
.dsec svg{position:absolute;left:15px;top:14px}
.dsec b{display:block;color:var(--text);font-weight:600;font-size:12.5px}
.dsec.pos{border-color:var(--green-b);background:var(--green-s)} .dsec.pos svg{color:var(--green)}
.dsec.neg{border-color:var(--red-b);background:var(--red-s)} .dsec.neg svg{color:var(--red)}
.na{color:var(--text3);font-style:italic}
.kv{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.kv th{text-align:left;font-weight:500;color:var(--text3);padding:7px 12px 7px 0;width:130px;vertical-align:top;border-bottom:1px solid var(--border)}
.kv td{padding:7px 0;border-bottom:1px solid var(--border);color:var(--text2);font-weight:300}
.kv tr:last-child th,.kv tr:last-child td{border-bottom:0}

@media (max-width:1180px){
  .topbar{grid-template-columns:minmax(0,1fr) auto}
  .search{grid-column:1/-1;grid-row:2;max-width:none}
}
@media (min-width:1001px){
  .tw{overflow:visible}
  .mx thead th{position:sticky;top:var(--head-h,150px);z-index:5;background:#fdf3eb}
  .mx thead th:first-child{border-top-left-radius:var(--r)} .mx thead th:last-child{border-top-right-radius:var(--r)}
}
@media (max-width:1000px){
  .topbar{padding:12px 18px;min-height:0;border-radius:14px}
  .head-tabs{padding:8px 0 0}
  .wrap{padding:22px 0 60px}
}
@media (max-width:700px){
  .head{padding-top:calc(env(safe-area-inset-top,0px) + 10px)}
  .topbar{gap:10px 12px;padding:10px 14px}
  .beta{display:none} .logos{gap:10px} .logos img{height:22px} .logos .sep{height:20px} .tr{gap:10px}
  .lang{width:30px;height:30px}
  .title span{font-size:12.5px}
  .ss-box{padding:6px 12px}
  .ptab{padding:9px 12px;font-size:13px}
  h1{font-size:26px} .lead{font-size:15px}
  .fbar-l{width:100%}
  /* matrix becomes stacked cards */
  .tw{border:0;background:none;overflow:visible;border-radius:0}
  table.mx,table.mx.single{min-width:0;display:block}
  .mx thead{display:none}
  .mx tbody,.mx tr,.mx td,.mx tbody th{display:block;width:auto}
  .mx tbody tr{background:var(--white);border:1px solid var(--border);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
  .mx tbody th{border-right:0;background:var(--accent-s);border-bottom:1.5px solid var(--accent-b);font-size:13.5px}
  .mx td{border-right:0;padding:8px 6px}
  .mx td::before{content:attr(data-label);display:block;font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.3px;padding:2px 8px 2px}
  .mx td.e{display:none}
  .mx tbody tr td:last-of-type{border-bottom:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

uik van binnenklimaatsensoren en monitoringsystemen.","w2":"Overdimensionering en pendelen van opwekkers worden verminderd.","n2":"Het binnencomfort kan in piekmomenten onvoldoende zijn."},{"t":"Apply good (biobased) insulation to the building to keep the heating requirement low, which means that smaller generation, distribution and delivery systems are required.","s":"d_building","c":"gen_all","f":"heating","l":"building","a":["c","r"],"g":["e"],"w":"Good insulation of the building keeps the heating requirement low, which means that smaller generation, distribution and delivery systems are required.","n":"Initially, this requires an increase in materials, which should be compensated through the elongated lifetime.","t2":"Isoleer het gebouw goed (biobased), zodat de warmtevraag laag blijft en kleinere opwek-, distributie- en afgiftesystemen nodig zijn.","w2":"Goede isolatie van het gebouw houdt de warmtevraag laag, waardoor kleinere opwek-, distributie- en afgiftesystemen nodig zijn.","n2":"Dit vraagt eerst om meer materiaal, wat moet worden gecompenseerd door de langere levensduur."},{"t":"Design installations more robust so that they break down less quickly and technicians can clean quickly and without damaging anything","s":"g_design","c":"gen_all","f":"heating","l":"product","a":["c","r"],"g":["m"],"w":"This will reduce premature failure and increase lifespan.","n":"Initially, this requires an increase in materials, which should be compensated through the elongated lifetime.","t2":"Ontwerp installaties robuuster, zodat ze minder snel stukgaan en monteurs snel en zonder schade kunnen reinigen","w2":"Dit vermindert voortijdige uitval en verlengt de levensduur.","n2":"Dit vraagt eerst om meer materiaal, wat moet worden gecompenseerd door de langere levensduur."},{"t":"Insulate the parapet when using radiators.","s":"d_building","c":"gen_all","f":"heating","l":"building","a":["c","r"],"g":["e"],"w":"This reduces heat losses.","n":"This will require extra initial mat  the system and makes use of renewable materials.","n":"Using biobased materials might reduce the durability. Evaluate whether this is the case.","t2":"Gebruik biobased isolatie voor leidingen.","w2":"Biobased isolatie in plaats van niet-biobased materialen verlaagt de gebonden CO2 van het systeem en maakt gebruik van hernieuwbare materialen.","n2":"Biobased materialen kunnen minder duurzaam zijn. Ga na of dit het geval is."},{"t":"Use change-over systems.","s":"reconsider","c":"dist","f":"heating","l":"system","a":["c","r"],"g":["m"],"w":"Installing a change-over system allows for adding a cooling system in the future.","n":"If the use scenario does not change, the added materials will not be used in the end.","t2":"Gebruik change-oversystemen.","w2":"Een change-oversysteem maakt het mogelijk om later koeling toe te voegen.","n2":"Als het gebruik niet verandert, worden de toegevoegde materialen uiteindelijk niet benut."},{"t":"Use water-based systems to reduce distribution materials.","s":"reconsider","c":"dist","f":"heating","l":"system","a":["c","r"],"g":["m"],"w":null,"n":"Water-based systems require (larger) terminal units.","t2":"Gebruik watergedragen systemen om distributiemateriaal te verminderen.","w2":null,"n2":"Watergedragen systemen vragen om (grotere) afgifte-units."},{"t":"Use decentralised systems to reduce the need for distribution.","s":"reconsider","c":"dist","f":"heating","l":"system","a":["c","r"],"g":["m","e"],"w":"Decentralised systems remove/reduce needed distribution. People have their own meter, which makes people more motivated to be mindful about their energy consumption.","n":"This will require extra initial materials. Use impact-calculations to evaluate the effectiveness of this intervention for your designed system.","t2":"Gebruik decentrale systemen om de benodigde distributie te verminderen.","w2":"Decentrale systemen maken distributie overbodig of beperken die. Bewoners hebben een eigen meter, wat hen motiveert bewust met energie om te gaan.","n2":"Dit vraagt om extra materiaal vooraf. Gebruik impactberekeningen om de effectiviteit van deze ingreep voor jouw ontwerp te beoordelen."},{"t":"Design distribution efficiently, place AHUs and mechanical exhausts centrally.","s":"reconsider","c":"dist","f":"heating","l":"system","a":["c","r"],"g":["m"],"w":"A central positioning reduces ducts and pipes.","n":null,"t2":"Ontwerp de distributie efficiënt, plaats LBK's en mechanische afzuiging centraal.","w2":"Een centrale plaatsing vermindert kanalen en leidingen.","n2":null},{"t":"Use standardized modules such as climate ceiling islands instead of custom-made climate ceilings.","s":"reconsider","c":"term","f":"heating","l":"product","a":["c"],"g":["m"],"w":"Standardized modules are easier to be reused and repaired after an initial lifetime.","n":null,"t2":"Gebruik gestandaardiseerde modules zoals klimaatplafondeilanden in plaats van maatwerkklimaatplafonds.","w2":"Gestandaardiseerde modules zijn na een eerste levensduur makkelijker te hergebruiken en te repareren.","n2":null},{"t":"Define terminal units based on cooling demand, not on heating demand.","s":"reconsider","c":"term","f":"heating","l":"system","a":["c"],"g":["m","e"],"w":null,"n":null,"t2":"Dimensioneer afgifte-units op de koelvraag, niet op de warmtevraag.","w2":null,"n2":null},{"t":"Use underfloor heating instead of radiators when a new distribution system needs to be installed.","s":"reconsider","c":"term","f":"heating","l":"system","a":["c","r"],"g":["e"],"w":"This makes heating with lower temperatures possible, therefore lowering energy demand.","n":"Underfloor heating is difficult to repair as components are often not easy to disassembly. A careful and robust design is therefore important.","t2":"Gebruik vloerverwarming in plaats van radiatoren als er een nieuw distributiesysteem nodig is.","w2":"Dit maakt verwarmen op lagere temperaturen mogelijk en verlaagt zo de energievraag.","n2":"Vloerverwarming is lastig te repareren omdat onderdelen vaak moeilijk te demonteren zijn. Een zorgvuldig en robuust ontwerp is daarom belangrijk."},{"t":"Use predictive maintenance instead of preventive maintenance.","s":"reconsider","c":"ctrl","f":"heating","l":"product","a":["c","r"],"g":["m","e"],"w":null,"n":null,"t2":"Gebruik voorspellend onderhoud in plaats van preventief onderhoud.","w2":null,"n2":null},{"t":"Use local control technology as much as possible (e.g. on the generator itself).","s":"reconsider","c":"ctrl","f":"heating","l":"system","a":["c","r"],"g":["m"],"w":null,"n":null,"t2":"Gebruik zoveel mogelijk lokale regeltechniek (bijv. op de opwekker zelf).","w2":null,"n2":null},{"t":"Limit the controllability per room. Controlling based on the sun's orientation is usually sufficient.","s":"reconsider","c":"ctrl","f":"heating","l":"system","a":["c","r"],"g":["m"],"w":null,"n":null,"t2":"Beperk de regelbaarheid per ruimte. Regelen op basis van de oriëntatie op de zon is meestal voldoende.","w2":null,"n2":null},{"t":"Take advantage of wireless, multi-functional sensors.","s":"reconsider","c":"ctrl","f":"heating","l":"product","a":["c","r"],"g":["m"],"w":null,"n":null,"t2":"Benut draadloze, multifunctionele sensoren.","w2":null,"n2":null},{"t":"Design with generic hardware and control more with software.","s":"reconsider","c":"ctrl","f":"heating","l":"product","a":["c","r"],"g":["m"],"w":"This is a form of standardisation which will allow for easier reuse after an initial lifetime.","n":null,"t2":"Ontwerp met generieke hardware en regel meer met software.","w2":"Dit is een vorm van standaardisatie die hergebruik na een eerste levensduur makkelijker maakt.","n2":null},{"t":"Request a minimum number of years of software support.","s":"reconsider","c":"ctrl","f":"heating","l":"product","a":["c","r"],"g":["m"],"w":"This will guarantee that hardware/products will not become obsolete due to outdated software.","n":"Certain hardware might not be compatible with new cybersecurity issues.","t2":"Vraag een minimaal "w":"Natural refrigerants have a significantly lower GWP, which prevents environmental damage due to leakages.","n":"Do not get rid of well-functioning products before they have reached the end of their life in order to meet this intervention.","t2":"Gebruik natuurlijke koudemiddelen.","w2":"Natuurlijke koudemiddelen hebben een veel lagere GWP, wat milieuschade door lekkages voorkomt.","n2":"Doe goed functionerende producten niet weg voordat ze het einde van hun levensduur hebben bereikt, alleen om aan deze ingreep te voldoen."},{"t":"Implement changeover systems.","s":"reconsider","c":"dist","f":"cooling","l":"system","a":["r"],"g":["m"],"w":"This allows for adding an active cooling system in the future.","n":"If the use scenario does not change, the added materials will not be used in the end.","t2":"Pas change-oversystemen toe.","w2":"Dit maakt het mogelijk om later actieve koeling toe te voegen.","n2":"Als het gebruik niet verandert, worden de toegevoegde materialen uiteindelijk niet benut."},{"t":"Consider whether active cooling will be considered in the future. If so, avoid a mono-split system and install a multi-split system.","s":"reconsider","c":"dist","f":"cooling","l":"system","a":["c","r"],"g":["m"],"w":null,"n":null,"t2":"Ga na of actieve koeling in de toekomst aan de orde komt. Zo ja, vermijd een mono-splitsysteem en installeer een multi-splitsysteem.","w2":null,"n2":null},{"t":"Use water-based systems and/or decentralized systems to reduce distribution materials.","s":"reconsider","c":"dist","f":"cooling","l":"system","a":["c","r"],"g":["m"],"w":null,"n":null,"t2":"Gebruik watergedragen en/of decentrale systemen om distributiemateriaal te verminderen.","w2":null,"n2":null},{"t":"Reconsider whether humidification is necessary for a short period of the year.","s":"reconsider","c":"gen","f":"ventilation","l":"system","a":["c"],"g":["m","e"],"w":null,"n":null,"t2":"Heroverweeg of bevochtiging nodig is voor een korte periode van het jaar.","w2":null,"n2":null},{"t":"Eliminate heat recovery systems and bring back grilles, this saves installation materials and shaft space.","s":"reconsider","c":"gen","f":"ventilation","l":"system","a":["r"],"g":["m"],"w":"Distribution materials and HRU materials are reduced.","n":"Energy use needed for heating will increase. Use impact-calculations to evaluate whether the material reduction from this intervention weighs up to the increased impact in the operational phase for your designed system.","t2":"Laat warmteterugwinning weg en breng roosters terug; dit bespaart installatiemateriaal en schachtruimte.","w2":"Distributiematerialen en materialen voor de WTW-unit worden verminderd.","n2":"Het energieverbruik voor verwarming neemt toe. Gebruik impactberekeningen om te beoordelen of de materiaalbesparing opweegt tegen de hogere impact in de gebruiksfase van jouw ontwerp."},{"t":"Consider alternative (low-impact) materials for AHU housing.","s":"reconsider","c":"gen","f":"ventilation","l":"component","a":["c"],"g":["m"],"w":"Material impact will be reduced.","n":"Alternative materials could have a shorter lifespan. Evaluate whether this is the case.","t2":"Overweeg alternatieve materialen (met lage impact) voor LBK-behuizingen.","w2":"De materiaalimpact neemt af.","n2":"Alternatieve materialen kunnen een kortere levensduur hebben. Ga na of dit het geval is."},{"t":"Design adaptively to accommodate changes in space functions.","s":"reconsider","c":"gen","f":"ventilation","l":"system","a":["c"],"g":["m"],"w":"This allows for future changes, and prevents the need to add more materials in the future.","n":"If the use scenario does not change, the initially extra added materials will not be used in the end.","t2":"Ontwerp adaptief, zodat ruimten van functie kunnen veranderen.","w2":"Dit maakt toekomstige aanpassingen mogelijk en voorkomt dat er later extra materialen nodig zijn.","n2":"Als het gebruik niet verandert, worden de extra toegevoegde materialen uiteindelijk niet benut."},{"t":"Design ventilation boxes to be more robust (longer lifespan, better components).","s":"reconsider","c":"gen","f":"ventilation","l":"product","a":["r"],"g":["m"],"w":"This will reduce premature failure and increase lifespan.","n":"This will lead to a higher initial impact as a result of using more materials, which should be compensated through the elongated lifetime.","t2":"Ontwerp ventilatieboxen robuuster (langere levensduur, betere componenten).","w2":"Dit vermindert voortijdige uitval en verlengt de levensduur.","n2":"Dit geeft een hogere initiële impact door meer materiaalgebruik, wat moet worden gecompenseerd door de langere levensduur."},{"t":"Avoid taper-cutting air ducts. Avoiding tapers will increase material usage (due to larger diameters), but failure costs and energy costs are reduced, and flexibility and reuse opportunities are increased.","s":"reconsider","c":"dist","f":"ventilation","l":"product","a":["c"],"g":["m"],"w":null,"n":null,"t2":"Vermijd verjongingen in luchtkanalen. Zonder verjongingen is meer materiaal nodig (grotere diameters), maar faal- en energiekosten dalen en flexibiliteit en hergebruikmogelijkheden nemen toe.","w2":null,"n2":null},{"t":"Consider whether ductless or duct-poor solutions are possible.","s":"reconsider","c":"dist","f":"ventilation","l":"system","a":["r"],"g":["m"],"w":"Using new materials is avoided.","n":"Ductless or duct-poor solutions might require more generation units, which could lead to an increased environmental impact. Use impact-calculations to evaluate the effectiveness of this intervention for your designed system.","t2":"Ga na of kanaalloze of kanaalarme oplossingen mogelijk zijn.","w2":"Het gebruik van nieuwe materialen wordt vermeden.","n2":"Kanaalloze of kanaalarme oplossingen kunnen meer opwekkers vragen, wat de milieu-impact kan verhogen. Gebruik impactberekeningen om de effectiviteit van deze ingreep voor jouw ontwerp te beoordelen."},{"t":"Use detachable filters that can be changed at a measured pressure difference.","s":"reconsider","c":"dist","f":"ventilation","l":"component","a":["c","r"],"g":["m"],"w":null,"n":null,"t2":"Gebruik uitneembare filters die worden vervangen bij een gemeten drukverschil.","w2":null,"n2":null},{"t":"Use biobased materials.","s":"reconsider","c":"dist","f":"ventilation","l":"component","a":["c","r"],"g":["m"],"w":"Using biobased insulation rather than non-biobased materials often reduces the embodied carbon of the system and makes use of renewable materials.","n":"Using biobased materials might reduce the durability. Evaluate whether this is the case.","t2":"Gebruik biobased materialen.","w2":"Biobased isolatie in plaats van niet-biobased materialen verlaagt vaak de gebonden CO2 van het systeem en maakt gebruik van hernieuwbare materialen.","n2":"Biobased materialen kunnen minder duurzaam zijn. Ga na of dit het geval is."},{"t":"Reduce as much as possible by reconsidering opening windows.","s":"reconsider","c":"term","f":"ventilation","l":"system","a":["c","r"],"g":["m"],"w":"Using new materials is avoided.","n":"Using natural ventilation will increase the energy use of heating, or if ventilated insufficiently reduce the healthiness provided by the system.  Use impact-calculations to evaluate whether the material reduction from this intervention weighs up to the increased impact in the operational phase for your designed system.","t2":"Beperk zoveel mogelijk door te heroverwegen of ramen open kunnen.","w2":"Het gebruik van nieuwe materialen wordt vermeden.","n2":"Natuurlijke ventilatie verhoogt het energieverbruik voor verwarming, of verlaagt bij onvoldoende ventilatie de gezondheid van het binnenklimaat. Gebruik impactberekeningen om te beoordelen of de materiaalbesparing opweegt tegen de hogere impact in de gebruiksfase van jouw ontwerp."},{"t":"Use adaptive delivery systems.","s":"reconsider","c":"term","f":"ventilation","l":"product","a":["c","r"],"g":["m"],"w":null,"n":null,"t2":"Gebruik adaptieve afgiftesystemen.","w2":null,"n2":null},{"t":"Avoid mechanical components if possible.","s":"reconsider","c":"term","f":"ventilation","l":"component","a":["c","r"],"g":["m"],"w":"Mechanical components are more prone to wear and failure.","n":"Avoiding mechanical components and therefore changing to manual systems can increase operational energy use. Use impact-calculations to evaluate the effectiveness of this intervention for your designed system.","t2":"Vermijd waar mogelijk mechanische componenten.","w2":"Mechanische componenten zijn gevoeliger voor slijtage en uitval.","n2":"Mechanische componenten vermijden, en dus overstappen op handbediende systemen, kan het operationele energieverbruik verhogen. Gebruik impactberekeningen om de effectiviteit van deze ingreep voor jouw ontwerp te beoordelen."},{"t":"Apply predictive maintenance for filter contamination.","s":"reconsider","c":"ctrl","f":"ventilation","l":"product","a":["c","r"],"g":["m","e"],"w":"This ensures that maintenance happens (only) when it is necessary.","n":"Initially, this requires an increase in materials, which should be compensated by avoiding overusing maintenance materials.","t2":"Pas voorspellend onderhoud toe voor filtervervuiling.","w2":"Zo vindt onderhoud (alleen) plaats wanneer het nodig is.","n2":"Dit vraagt eerst om meer materiaal, wat moet worden gecompenseerd door minder overbodig gebruik van onderhoudsmaterialen."},{"t":"Reduce the vulnerability of controls (fire/valves).","s":"reconsider","c":"ctrl","f":"ventilation","l":"product","a":["c","r"],"g":["m"],"w":"This will reduce premature failure and increase lifespan.","n":"Initially, this requires an increase in materials, which should be compensated through the elongated lifetime.","t2":"Verminder de kwetsbaarheid van regelingen (brand/kleppen).","w2":"Dit vermindert voortijdige uitval en verlengt de levensduur.","n2":"Dit vraagt eerst om meer materiaal, wat moet worden gecompenseerd door de langere levensduur."},{"t":"Design with generic hardware solutions and control more with software.","s":"reconsider","c":"ctrl","f":"ventilation","l":"product","a":["c","r"],"g":["m"],"w":"This is a form of standardisation which will allow for easier reuse after an initial lifetime.","n":"Initially, this might require an increase in materials.","t2":"Ontwerp met generieke hardware-oplossingen en regel meer met software.","w2":"Dit is een vorm van standaardisatie die hergebruik na een eerste levensduur makkelijker maakt.","n2":"Dit kan eerst om meer materiaal vragen."},{"t":"Use more robust PCBs/electronics that are easier to repair. There's often plenty of room for this; it's not a mobile phone.","s":"reconsider","c":"ctrl","f":"ventilation","l":"component","a":["c","r"],"g":["m"],"w":"Product life of existing materials/products is prolongued.","n":"Initially, this might require an increase in materials.","t2":"Gebruik robuustere printplaten/elektronica die makkelijker te repareren zijn. Er is vaak ruimte genoeg; het is geen mobiele telefoon.","w2":"De levensduur van bestaande materialen/producten wordt verlengd.","n2":"Dit kan eerst om meer materiaal vragen."},{"t":"Use a dry underfloor system for heating and cooling instead of a wet underfloor system.","s":"reconsider","c":"term","f":"heating","l":"product","a":["c","r"],"g":["m","e"],"w":null,"n":null,"t2":"Gebruik een droog vloersysteem voor verwarming en koeling in plaats van een nat vloersysteem.","w2":null,"n2":null},{"t":"Add fans to the radiators.","s":"reconsider","c":"term","f":"heating","l":"system","a":["c","r"],"g":["e"],"w":null,"n":"This will emit fan noise.","t2":"Voeg ventilatoren toe aan de radiatoren.","w2":null,"n2":"Dit geeft ventilatorgeluid."}];

  search:'Search interventions',clear:'Clear search',close:'Close',langBtn:'NL',langTitle:'Nederlands',
  framework:'Design framework',filters:'Filters',overview:'Overview',reset:'Reset filters',
  gF:'Function',gL:'Scale level',gA:'Applicability',gG:'Goal',
  FN:{heating:'Heating',cooling:'Cooling',ventilation:'Ventilation'},
  LV:{context:'Contextual level',building:'Building level',system:'System level',product:'Product level',component:'Component level'},
  AP:{c:'Commercial construction',r:'Residential construction'},
  GO:{m:'Material reduction',e:'Energy reduction'},
  ST:{reconsider:'Reconsider',reuse:'Reuse',repair_on:'Repair or refurbish on site',repair_off:'Repair, refurbish or remanufacture off-site',repurpose:'Repurpose',d_context:'Contextual level',d_building:'Building level',g_design:'General design guidelines',g_org:'Organisational interventions'},
  CO:{gen:'Generation units',dist:'Distribution',term:'Terminal units',ctrl:'Control systems',gen_all:'General'},
  tagM:'material',tagE:'energy',lgLv:'scale level',lgGo:'goal',lgW:'known side-effect',lgClick:'Click an intervention for details.',
  allCols:'All columns',rStrat:'R-strategy',level:'Level',
  nores:'No interventions match these filters.',noresBtn:'Reset the filters',
  why:'Why this helps',watch:'Watch out for',noWhy:'Not yet described in the framework.',noNeg:'No side-effects recorded in the interviews. That does not mean there are none.',
  kFn:'Function',kLv:'Scale level',kCo:'Component',kSt:'R-strategy',kCat:'Category',kAp:'Applicability',kGo:'Goal',notSpec:'Not specified',and:' and ',
  pages:{
   systems:{nav:'Circular systems',h:'Circular interventions<br><em>in the HVAC system</em>',lead:'Five R-strategies against the four FODAR components of an HVAC system: generation units, distribution, terminal units and control systems.',card:'Five R-strategies against the four FODAR components of an HVAC system.'},
   demand:{nav:'Reducing demand',h:'Reducing HVAC demand<br><em>on context and building level</em>',lead:'Interventions that lower the heating, cooling and ventilation demand, so generation, distribution and terminal units, and the material in them, can be smaller.',card:'Interventions that lower demand so the installation can be smaller.'},
   guidelines:{nav:'General guidelines',h:'General guidelines<br><em>and organisational interventions</em>',lead:'Design guidelines that improve the circularity of an HVAC system on several levels at once, and agreements with suppliers and installers that support them.',card:'Guidelines across the whole system and agreements with suppliers and installers.'}
  },
  src:`Interventions collected in seven semi-structured interviews with eight HVAC practitioners and structured with an analytical model of R-strategies (Potting, 2017), FODAR components and scale levels. Effectiveness and side-effects have not yet been evaluated per project; use impact calculations to check an intervention for your design. Developed by TU Delft and Dutch Green Building Council: S. van Andel, <i>Towards Circular Indoor Comfort</i>, September 2026.`
 },
 nl:{
  search:'Zoek interventies',clear:'Zoekopdracht wissen',close:'Sluiten',langBtn:'EN',langTitle:'English',
  framework:'Ontwerpkader',filters:'Filters',overview:'Overzicht',reset:'Filters herstellen',
  gF:'Functie',gL:'Schaalniveau',gA:'Toepassing',gG:'Doel',
  FN:{heating:'Verwarming',cooling:'Koeling',ventilation:'Ventilatie'},
  LV:{context:'Contextniveau',building:'Gebouwniveau',system:'Systeemniveau',product:'Productniveau',component:'Componentniveau'},
  AP:{c:'Utiliteitsbouw',r:'Woningbouw'},
  GO:{m:'Materiaalreductie',e:'Energiereductie'},
  ST:{reconsider:'Heroverwegen',reuse:'Hergebruiken',repair_on:'Repareren of reviseren op locatie',repair_off:'Repareren, reviseren of herfabriceren elders',repurpose:'Herbestemmen',d_context:'Contextniveau',d_building:'Gebouwniveau',g_design:'Algemene ontwerprichtlijnen',g_org:'Organisatorische maatregelen'},
  CO:{gen:'Opwekking',dist:'Distributie',term:'Afgifte',ctrl:'Regeling',gen_all:'Algemeen'},
  tagM:'materiaal',tagE:'energie',lgLv:'schaalniveau',lgGo:'doel',lgW:'bekend neveneffect',lgClick:'Klik op een interventie voor details.',
  allCols:'Alle kolommen',rStrat:'R-strategie',level:'Niveau',
  nores:'Geen interventies bij deze filters.',noresBtn:'Herstel de filters',
  why:'Waarom dit helpt',watch:'Let op',noWhy:'Nog niet beschreven in het kader.',noNeg:'Geen neveneffecten genoemd in de interviews. Dat betekent niet dat ze er niet zijn.',
  kFn:'Functie',kLv:'Schaalniveau',kCo:'Component',kSt:'R-strategie',kCat:'Categorie',kAp:'Toepassing',kGo:'Doel',notSpec:'Niet gespecificeerd',and:' en ',
  pages:{
   systems:{nav:'Circulaire systemen',h:'Circulaire interventies<br><em>in het installatiesysteem</em>',lead:'Vijf R-strategieën tegen de vier FODAR-componenten van een installatie: opwekking, distributie, afgifte en regeling.',card:'Vijf R-strategieën tegen de vier FODAR-componenten van een installatie.'},
   demand:{nav:'Vraag verlagen',h:'De installatievraag verlagen<br><em>op context- en gebouwniveau</em>',lead:'Interventies die de vraag naar verwarming, koeling en ventilatie verlagen, zodat opwekking, distributie en afgifte, en het materiaal daarin, kleiner kunnen.',card:'Interventies die de vraag verlagen, zodat de installatie kleiner kan.'},
   guidelines:{nav:'Algemene richtlijnen',h:'Algemene richtlijnen<br><em>en organisatorische maatregelen</em>',lead:'Ontwerprichtlijnen die de circulariteit van een installatie op meerdere niveaus tegelijk verbeteren, en afspraken met leveranciers en installateurs die daarbij helpen.',card:'Richtlijnen voor het hele systeem en afspraken met leveranciers en installateurs.'}
  },
  src:`Interventies verzameld in zeven semigestructureerde interviews met acht installatieprofessionals en geordend met een analytisch model van R-strategieën (Potting, 2017), FODAR-componenten en schaalniveaus. Effectiviteit en neveneffecten zijn nog niet per project geëvalueerd; gebruik impactberekeningen om een interventie voor jouw ontwerp te toetsen. Ontwikkeld door TU Delft en Dutch Green Building Council: S. van Andel, <i>Towards Circular Indoor Comfort</i>, september 2026.`
 }
};
const RN={context:'I',building:'II',system:'III',product:'IV',component:'V'};

const PAGES=[
 {id:'systems',rows:['reconsider','reuse','repair_on','repair_off','repurpose'],cols:['gen','dist','term','ctrl'],colKey:'CO',rowHead:'rStrat',pick:(it,r,c)=>it.s===r&&it.c===c},
 {id:'demand',rows:['d_context','d_building'],cols:['heating','cooling','ventilation'],colKey:'FN',rowHead:'level',pick:(it,r,c)=>it.s===r&&it.f===c},
 {id:'guidelines',rows:['all'],cols:['g_design','g_org'],colKey:'ST',pick:(it,r,c)=>it.s===c}
];
const ALL={f:['heating','cooling','ventilation'],l:['context','building','system','product','component'],a:['c','r'],g:['m','e']};
const S={page:'systems',lang:'nl',f:new Set(ALL.f),l:new Set(ALL.l),a:new Set(ALL.a),g:new Set(ALL.g),q:'',col:{}};
try{const s=JSON.parse(localStorage.getItem('chvac-f3')||'null'); if(s){['f','l','a','g'].forEach(k=>{if(Array.isArray(s[k]))S[k]=new Set(s[k].filter(v=>ALL[k].includes(v)));}); if(s.lang==='en'||s.lang==='nl')S.lang=s.lang;}}catch(e){}
const save=()=>{try{localStorage.setItem('chvac-f3',JSON.stringify({f:[...S.f],l:[...S.l],a:[...S.a],g:[...S.g],lang:S.lang}));}catch(e){}};
const L=()=>T[S.lang];
const tx=(it,k)=>S.lang==='nl'?(it[k+'2']||it[k]):it[k];

function pass(it){
  if(!S.f.has(it.f)||!S.l.has(it.l)||!it.a.some(a=>S.a.has(a))) return false;
  if(!(S.g.has('m')&&S.g.has('e'))&&!it.g.some(g=>S.g.has(g))) return false;
  if(S.q){const q=S.q.toLowerCase(); if(!['t','w','n','t2','w2','n2'].map(k=>it[k]||'').join(' ').toLowerCase().includes(q)) return false;}
  return true;
}
function group(list){
  const m=new Map();
  list.forEach(it=>{let g=m.get(it.t); if(!g){g={t:it.t,src:it,s:it.s,c:it.c,fs:new Set(),ls:new Set(),as:new Set(),g:new Set()};m.set(it.t,g);}
    g.fs.add(it.f);g.ls.add(it.l);it.a.forEach(a=>g.as.add(a));it.g.forEach(x=>g.g.add(x)); if(!g.src.w&&it.w)g.src=it;});
  return [...m.values()];
}
const lvSort=a=>[...a].sort((x,y)=>ALL.l.indexOf(x)-ALL.l.indexOf(y));
const REG=[];

// static shell per language
function build(){
  const t=L();
  document.documentElement.lang=S.lang;
  $('q').placeholder=t.search; $('q').setAttribute('aria-label',t.search); $('qx').setAttribute('aria-label',t.clear);
  $('lang').textContent=t.langBtn; $('lang').title=t.langTitle; $('lang').setAttribute('aria-label',t.langTitle);
  $('dlg-x').setAttribute('aria-label',t.close); $('home').setAttribute('aria-label',t.pages.systems.nav);
  const fi=(g,k,lab,pre)=>`<button type="button" class="fi" data-g="${g}" data-k="${k}" aria-pressed="true"><span class="bx"></span>${pre}${lab}</button>`;
  const caret='<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
  const dd=(p,g,lab,items)=>`<div class="dd"><button type="button" class="ddb" data-dd="${g}" aria-expanded="false" aria-haspopup="true" aria-controls="m-${p}-${g}"><span>${lab}</span><span class="cnt" data-cnt="${g}"></span>${caret}</button><div class="ddm" id="m-${p}-${g}" hidden>${items}</div></div>`;
  const fbar=p=>`<div class="fbar">
     ${dd(p,'f',t.gF,ALL.f.map(k=>fi('f',k,t.FN[k],`<span class="ic">${I[k]}</span>`)).join(''))}
     ${dd(p,'l',t.gL,ALL.l.map(k=>fi('l',k,t.LV[k],`<span class="rn">${RN[k]}</span>`)).join(''))}
     ${dd(p,'a',t.gA,ALL.a.map(k=>fi('a',k,t.AP[k],`<span class="ic">${I[k]}</span>`)).join(''))}
     ${dd(p,'g',t.gG,ALL.g.map(k=>fi('g',k,t.GO[k],`<span class="ic">${I[k]}</span>`)).join(''))}
     <button class="rreset" type="button" data-reset hidden>${t.reset}</button>
   </div>`;
  $('ptabs').setAttribute('aria-label',t.framework);
  $('ptabs').innerHTML=PAGES.map(p=>`<button type="button" class="ptab" role="tab" data-page="${p.id}">${t.pages[p.id].nav}<span class="nc" id="nc-${p.id}"></span></button>`).join('');
  $('canvas').innerHTML=
    PAGES.map(p=>{const tp=t.pages[p.id]; return `<section class="page" id="pg-${p.id}" role="tabpanel" hidden>
      <h1>${tp.h}</h1><p class="lead">${tp.lead}</p>
      ${fbar(p.id)}
      <div class="tw" id="mx-${p.id}"></div>
      <div class="legend"><span><span class="ct lv">III</span>${t.lgLv}</span><span><span class="ct m">${t.tagM}</span><span class="ct e">${t.tagE}</span>${t.lgGo}</span><span><span class="ct w">!</span>${t.lgW}</span><span>${t.lgClick}</span></div>
    </section>`;}).join('')+`<p class="src">${t.src}</p>`;
  $('dlg-wl').textContent=t.why; $('dlg-nl').textContent=t.watch;
  render(); show(S.page,false);
}

function ivHTML(g,p){
  const t=L(), id=REG.push(g)-1;
  const lv=lvSort(g.ls).map(l=>`<span class="ct lv" title="${t.LV[l]}">${RN[l]}</span>`).join('');
  const go=(g.g.has('m')?`<span class="ct m">${t.tagM}</span>`:'')+(g.g.has('e')?`<span class="ct e">${t.tagE}</span>`:'');
  const fn=p.id!=='demand'&&S.f.size>1?[...g.fs].map(f=>`<span class="fn" title="${t.FN[f]}">${I[f]}</span>`).join(''):'';
  return `<button type="button" class="iv" data-i="${id}"><span class="tx">${esc(tx(g.src,'t'))}</span><span class="meta">${lv}${go}${g.src.n?`<span class="ct w" title="${t.lgW}">!</span>`:''}${fn}</span></button>`;
}

function render(){
  const t=L(); REG.length=0;
  const vis=DATA.filter(pass);
  PAGES.forEach(p=>{
    const inPage=vis.filter(it=>p.rows.some(r=>p.cols.some(c=>p.pick(it,r,c))));
    const n=group(inPage).length;
    $('nc-'+p.id).textContent=n;
    const cols=p.cols, lab=c=>t[p.colKey][c];
    const head=p.rows[0]!=='all';
    let h=`<table class="mx${cols.length<4?' single':''}"><thead><tr>${head?`<th class="rh" scope="col">${t[p.rowHead]}</th>`:''}${cols.map(c=>`<th scope="col">${lab(c)}</th>`).join('')}</tr></thead><tbody>`;
    p.rows.forEach(r=>{
      h+=`<tr>${head?`<th scope="row">${t.ST[r]}</th>`:''}`;
      cols.forEach(c=>{const cg=group(vis.filter(it=>p.pick(it,r,c)));
        h+=`<td data-label="${esc(lab(c))}"${cg.length?'':' class="e"'}><div class="cell">${cg.length?cg.map(g=>ivHTML(g,p)).join(''):'<div class="empty">—</div>'}</div></td>`;});
      h+='</tr>';
    });
    h+='</tbody></table>';
    if(!n) h+=`<div class="nores">${t.nores} <button type="button" class="link" data-reset>${t.noresBtn}</button></div>`;
    $('mx-'+p.id).innerHTML=h;
  });
  document.querySelectorAll('.fi').forEach(b=>b.setAttribute('aria-pressed',S[b.dataset.g].has(b.dataset.k)));
  let any=false;
  ['f','l','a','g'].forEach(g=>{const act=S[g].size<ALL[g].length; any=any||act;
    document.querySelectorAll(`.ddb[data-dd="${g}"]`).forEach(b=>b.classList.toggle('act',act));
    document.querySelectorAll(`[data-cnt="${g}"]`).forEach(c=>c.textContent=act?`${S[g].size}/${ALL[g].length}`:'');});
  document.querySelectorAll('.rreset').forEach(r=>r.hidden=!any);
  save();
}

function show(id,top){
  S.page=id; closeDD();
  PAGES.forEach(p=>{$('pg-'+p.id).hidden=p.id!==id;});
  document.querySelectorAll('.ptab').forEach(n=>{const on=n.dataset.page===id; n.classList.toggle('on',on); n.setAttribute('aria-selected',on);});
  try{history.replaceState(null,'','#'+id);}catch(e){}
  if(top!==false) window.scrollTo({top:0});
}

function closeDD(except){document.querySelectorAll('.ddb[aria-expanded="true"]').forEach(b=>{if(b===except)return; b.setAttribute('aria-expanded','false'); $(b.getAttribute('aria-controls')).hidden=true;});}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDD();});
document.addEventListener('click',e=>{
  const el=e.target;
  const db=el.closest('.ddb');
  if(db){const m=$(db.getAttribute('aria-controls')), open=db.getAttribute('aria-expanded')!=='true'; closeDD(db);
    db.setAttribute('aria-expanded',open); m.hidden=!open;
    if(open){m.classList.remove('r'); const r=m.getBoundingClientRect(); if(r.right>window.innerWidth-12) m.classList.add('r');}
    return;}
  if(!el.closest('.ddm')) closeDD();
  const f=el.closest('.fi'); if(f){const s=S[f.dataset.g],k=f.dataset.k; s.has(k)?s.delete(k):s.add(k); render(); return;}
  if(el.closest('[data-reset]')){['f','l','a','g'].forEach(k=>S[k]=new Set(ALL[k])); S.q=''; $('q').value=''; $('qx').hidden=true; render(); return;}
  const pg=el.closest('[data-page]'); if(pg){show(pg.dataset.page); return;}
    const iv=el.closest('.iv'); if(iv){openDlg(REG[+iv.dataset.i]); return;}
});
$('home').addEventListener('click',()=>show('systems'));
$('lang').addEventListener('click',()=>{S.lang=S.lang==='nl'?'en':'nl'; save(); build();});
$('q').addEventListener('input',e=>{S.q=e.target.value.trim(); $('qx').hidden=!S.q; render();});
$('qx').addEventListener('click',()=>{$('q').value='';S.q='';$('qx').hidden=true;render();$('q').focus();});

const dlg=$('dlg');
function openDlg(g){
  const t=L(), it=g.src;
  const strat=t.ST[g.s];
  $('dlg-e').textContent=g.c&&g.c!=='gen_all'?`${strat} · ${t.CO[g.c]}`:strat;
  $('dlg-t').textContent=tx(it,'t');
  const a=group(DATA.filter(x=>x.t===g.t))[0];
  $('dlg-m').innerHTML=lvSort(a.ls).map(l=>`<span class="ct lv">${RN[l]} · ${t.LV[l]}</span>`).join('')+(a.g.has('m')?`<span class="ct m">${t.tagM}</span>`:'')+(a.g.has('e')?`<span class="ct e">${t.tagE}</span>`:'');
  const w=tx(it,'w'), n=tx(it,'n');
  $('dlg-w').textContent=w||t.noWhy; $('dlg-w').className=w?'':'na';
  $('dlg-n').textContent=n||t.noNeg; $('dlg-n').className=n?'':'na';
  const rows=[[t.kFn,[...a.fs].map(f=>t.FN[f]).join(', ')],[t.kLv,lvSort(a.ls).map(l=>t.LV[l]).join(', ')],[t.kCo,t.CO[g.c]],
    [/^[dg]_/.test(g.s)?t.kCat:t.kSt,strat],[t.kAp,[...a.as].sort().map(x=>t.AP[x]).join(', ')],[t.kGo,[...a.g].map(x=>t.GO[x]).join(t.and)||t.notSpec]];
  $('dlg-kv').innerHTML=rows.map(([k,v])=>`<tr><th scope="row">${k}</th><td>${esc(v)}</td></tr>`).join('');
  if(dlg.showModal) dlg.showModal(); else dlg.setAttribute('open','');
}
$('dlg-x').addEventListener('click',()=>dlg.close());
dlg.addEventListener('click',e=>{if(e.target===dlg) dlg.close();});

const h=(location.hash||'').slice(1);
if(PAGES.some(p=>p.id===h)) S.page=h;
build();
const setH=()=>document.documentElement.style.setProperty('--head-h',$('head').offsetHeight+'px');
setH(); addEventListener('resize',setH);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(setH);
})();
</script>

</body></html>
