<title>Circular HVAC Design Framework</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,600&family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: FCAB-site shell, light only. Sticky topbar; below it a visual explorer:
   choose a building → choose heating / cooling / ventilation → clickable markers in a cutaway drawing → side panel with interventions. */
:root{
  color-scheme:light;
  --cream:#faf9f7; --white:#ffffff; --border:#e8e4de; --border2:#d4cfc8;
  --text:#1c1a17; --text2:#5a5650; --text3:#9c9690;
  --accent:#e07a2f; --accent-s:rgba(224,122,47,.09); --accent-b:rgba(224,122,47,.22);
  --green:#1a6e3c; --green-s:rgba(26,110,60,.08); --green-b:rgba(26,110,60,.18);
  --amber:#b45309; --amber-s:rgba(180,83,9,.08); --amber-b:rgba(180,83,9,.18);
  --red:#b91c1c; --red-s:rgba(185,28,28,.07); --red-b:rgba(185,28,28,.16);
  --neutral-s:#f0ede8; --hover:rgba(0,0,0,.025);
  --shadow-soft:rgba(28,26,23,.08); --shadow-card:rgba(0,0,0,.08);
  --beta-bg:#1c1a17; --beta-t:#ffffff;
  --heat:#d0452f; --heat-s:rgba(208,69,47,.1);
  --cool:#2a6fc0; --cool-s:rgba(42,111,192,.1);
  --vent:#2f9468; --vent-s:rgba(47,148,104,.1);
  --idle:#b9b0a4;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --wordmark:'Poppins',system-ui,sans-serif;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);background:var(--cream);color:var(--text);font-size:15px;line-height:1.65;padding-inline:16px;padding-block:0 16px}
::selection{background:var(--accent-b)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button,input{font-family:var(--sans);color:var(--text)}

/* sticky head + topbar */
.head{position:sticky;top:0;z-index:200;background:var(--cream);padding-top:calc(env(safe-area-inset-top,0px) + 16px);padding-bottom:4px;margin-inline:-16px;padding-inline:16px}
.topbar{position:relative;background:var(--white);border-radius:18px;box-shadow:0 4px 24px var(--shadow-soft);
  min-height:84px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px 24px;padding:12px 28px;max-width:1440px;margin:0 auto}
.title{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.title span{font-size:13.6px;color:var(--text2);letter-spacing:.1px;line-height:1.35;white-space:nowrap}
.title span:first-child{font-weight:600;color:var(--text)}
.search{justify-self:center;width:100%;max-width:470px;display:flex;align-items:center;gap:10px}
.search .ss-box{flex:1;min-width:0}
.ss-box{display:flex;align-items:center;gap:8px;border:1px solid var(--border2);border-radius:20px;background:var(--white);padding:8px 14px;color:var(--text3)}
.ss-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-s)}
.ss-box input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:13px}
.ss-box input::-webkit-search-cancel-button{display:none}
.ss-box input::placeholder{color:var(--text3)}
.ss-x{border:0;background:none;color:var(--text3);font-size:17px;line-height:1;cursor:pointer;padding:0 2px}
.tr{display:flex;align-items:center;gap:18px}
.lang{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid var(--border);background:var(--white);color:var(--text2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:10.5px;font-weight:700;letter-spacing:.2px}
.lang:hover{color:var(--accent);border-color:var(--accent-b);background:var(--accent-s)}
.logos{display:flex;align-items:center;gap:18px}
.logos a{display:block;line-height:0}
.logos img{height:32px;width:auto;display:block}
.logos .sep{width:1px;height:30px;background:var(--border)}
.beta{font-family:var(--wordmark);font-size:14px;font-weight:600;font-style:italic;color:var(--beta-t);background:var(--beta-bg);padding:4px 12px;border-radius:20px}

/* page */
.wrap{max-width:1280px;margin:0 auto;padding:30px 12px 70px}
h1{font-size:32px;font-weight:700;color:var(--text);line-height:1.2;letter-spacing:-.7px;margin:0 0 10px;text-wrap:balance}
h1 em{font-style:italic;font-weight:300;color:var(--text2)}
.lead{font-size:16px;font-weight:300;color:var(--text2);line-height:1.7;margin:0 0 26px;max-width:720px}
.steplbl{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.4px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.steplbl b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px}
.src{font-size:12px;color:var(--text3);font-weight:300;margin:30px 0 0;max-width:95ch;line-height:1.6}

/* building chooser */
.choose{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;max-width:1000px}
.bcard{display:flex;flex-direction:column;gap:0;text-align:left;background:var(--white);border:1px solid var(--border);border-radius:16px;padding:0;cursor:pointer;overflow:hidden;box-shadow:0 1px 2px var(--shadow-soft);transition:box-shadow .2s,transform .2s,border-color .2s}
.bcard:hover{box-shadow:0 14px 34px var(--shadow-card);transform:translateY(-3px);border-color:var(--accent-b)}
.bcard .pic{background:linear-gradient(#f3f6f8,#fbfaf7);border-bottom:1px solid var(--border)}
.bcard .pic svg{display:block;width:100%;height:auto}
.bcard .bt{padding:16px 20px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.bcard .bn{font-size:17px;font-weight:600}
.bcard .bs{font-size:13px;color:var(--text3);font-weight:300}
.bcard .go{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}

/* toolbar */
.tools{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 28px;margin:0 0 16px}
.tgrp{display:flex;flex-direction:column;gap:6px}
.tgrp-l{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.3px}
.seg{display:inline-flex;background:var(--white);border:1px solid var(--border2);border-radius:22px;padding:3px;gap:2px}
.seg button{display:inline-flex;align-items:center;gap:7px;border:0;background:none;border-radius:18px;padding:6px 14px;font-size:13px;color:var(--text2);cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--text);color:#fff}
.fn-btns{display:flex;flex-wrap:wrap;gap:8px}
.fnb{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--border2);background:var(--white);border-radius:22px;padding:7px 16px 7px 12px;font-size:13.5px;font-weight:500;color:var(--text2);cursor:pointer;transition:all .15s}
.fnb .dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--fs);color:var(--fc)}
.fnb:hover{border-color:var(--fc);color:var(--text)}
.fnb.on{background:var(--fc);border-color:var(--fc);color:#fff}
.fnb.on .dot{background:rgba(255,255,255,.2);color:#fff}
.f-heating{--fc:var(--heat);--fs:var(--heat-s)} .f-cooling{--fc:var(--cool);--fs:var(--cool-s)} .f-ventilation{--fc:var(--vent);--fs:var(--vent-s)}
.fnb.pulse{animation:pulse 1.8s ease-in-out 2}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--fs)}}
.dd{position:relative}
.ddb{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border2);background:var(--white);border-radius:20px;padding:7px 12px 7px 15px;font-size:13px;color:var(--text2);cursor:pointer;line-height:1.3}
.ddb:hover{color:var(--text);border-color:var(--accent-b)}
.ddb svg{opacity:.55;transition:transform .15s}
.ddb[aria-expanded="true"] svg{transform:rotate(180deg)}
.ddb.act{border-color:var(--accent-b);background:var(--accent-s);color:var(--accent);font-weight:500}
.ddb .cnt{font-size:11px;font-weight:600}
.ddm{position:absolute;top:calc(100% + 6px);left:0;z-index:60;background:var(--white);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 32px var(--shadow-soft);padding:6px 0;min-width:230px;max-width:calc(100vw - 32px)}
.ddm.r{left:auto;right:0}
.fi{display:flex;align-items:center;gap:10px;width:100%;padding:7px 16px;cursor:pointer;color:var(--text2);font-size:13px;border:0;background:none;text-align:left;line-height:1.4;white-space:nowrap}
.fi:hover{background:var(--hover);color:var(--text)}
.fi .bx{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--border2);flex:none;display:grid;place-items:center;background:var(--white)}
.fi[aria-pressed="true"]{color:var(--text)}
.fi[aria-pressed="true"] .bx{background:var(--accent);border-color:var(--accent)}
.fi[aria-pressed="true"] .bx::after{content:"";width:6px;height:3.5px;border-left:1.6px solid #fff;border-bottom:1.6px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.fi .ic{display:flex;color:var(--text3)}
.fi .rn{font-size:10.5px;font-weight:700;color:var(--text3);min-width:20px}
.rreset{border:0;background:none;color:var(--accent);font-size:12.5px;font-weight:500;cursor:pointer;padding:8px 4px}

/* explorer */
.explore{display:block}
.pop{position:absolute;z-index:6;width:390px;max-width:calc(100% - 28px);max-height:min(78%,520px);overflow:auto;background:var(--white);border:1px solid var(--border);border-top:4px solid var(--fc,var(--accent));border-radius:14px;box-shadow:0 18px 44px rgba(28,26,23,.22);cursor:auto;overscroll-behavior:contain}
.pop[hidden]{display:none}
.pop .ph{padding:14px 16px 10px;position:sticky;top:0;background:var(--white);border-bottom:1px solid var(--border);z-index:2;display:flex;gap:10px;align-items:flex-start}
.pop .ph>div{flex:1;min-width:0}
.pop .ph h2{font-size:17px}
.pop .ph p{font-size:12.5px;margin-top:2px}
.pop .pb{padding:4px 8px 10px}
.pop .legend{padding:10px 16px 14px}
.px{width:30px;height:30px;flex:none;border-radius:50%;border:1px solid var(--border);background:var(--white);color:var(--text2);display:grid;place-items:center;cursor:pointer}
.px:hover{color:var(--fc,var(--accent));border-color:var(--fc,var(--accent))}
.tip{position:absolute;left:14px;top:14px;z-index:4;max-width:min(420px,calc(100% - 200px));background:rgba(255,255,255,.92);border:1px solid var(--border);border-radius:12px;padding:8px 14px;font-size:13px;color:var(--text2);pointer-events:none;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.tip[hidden]{display:none}
/* stage */
.stage{aspect-ratio:16/9!important;max-height:calc(100vh - var(--head-h,120px) - 20px);min-height:420px;position:relative;background:radial-gradient(120% 90% at 50% 20%,#ffffff 0%,#f3efe8 60%,#ebe5dc 100%);border:1px solid var(--border);border-radius:16px;overflow:hidden;aspect-ratio:16/11;cursor:grab}
.stage:active{cursor:grabbing}
.stage canvas{display:block}
.hint{position:absolute;left:14px;bottom:12px;font-size:12px;color:var(--text2);display:flex;gap:8px;align-items:center;pointer-events:none;background:rgba(255,255,255,.85);border:1px solid var(--border);border-radius:20px;padding:4px 12px}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--text3);font-size:13px}
#marks{position:absolute;inset:0;pointer-events:none}
.mk{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:flex;align-items:center;border:0;background:none;padding:0;cursor:pointer;z-index:3;pointer-events:auto;will-change:transform}
.mk .c{position:relative;width:34px;height:34px;border-radius:50%;background:#e8b62a;color:#fff;display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.25),0 0 0 3px rgba(255,255,255,.55);transition:transform .15s,background .15s}
.mk .c svg{width:16px;height:16px}
.mk .c::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid #e8b62a;opacity:0;animation:ring 2.4s ease-out infinite}
@keyframes ring{0%{opacity:.6;transform:scale(.75)}80%,100%{opacity:0;transform:scale(1.3)}}
.mk .n{position:absolute;top:-6px;right:-8px;min-width:18px;height:18px;border-radius:9px;background:#fff;color:var(--text);font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.mk .l{position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);background:var(--white);border:1px solid var(--border);border-radius:14px;padding:3px 10px;font-size:12px;font-weight:500;color:var(--text);white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.1);opacity:0;pointer-events:none;transition:opacity .15s}
.mk.left .l{left:auto;right:calc(100% + 10px)}
.mk:hover .l,.mk:focus-visible .l,.mk.on .l,.mk.hov .l{opacity:1}
.mk.hov .c{transform:scale(1.15)}
.mk:hover .c{transform:scale(1.12)}
.mk.on .c{background:var(--fc);transform:scale(1.15)}
.mk.on .c::before{display:none}
.mk.on .c svg{transform:rotate(45deg)}
.gnl{position:absolute;right:14px;top:14px;z-index:3;display:inline-flex;align-items:center;gap:8px;background:var(--white);border:1px solid var(--border);border-radius:20px;padding:6px 14px 6px 8px;font-size:12.5px;font-weight:500;color:var(--text);cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.gnl .c{width:24px;height:24px;border-radius:50%;background:#e8b62a;color:#fff;display:grid;place-items:center}
.gnl.on{background:var(--fc);color:#fff;border-color:var(--fc)}
.gnl b{font-weight:700}
.stage.f-heating,.panel.f-heating,.pop.f-heating{--fc:var(--heat);--fs:var(--heat-s)}
.stage.f-cooling,.panel.f-cooling{--fc:var(--cool);--fs:var(--cool-s)}
.stage.f-ventilation,.panel.f-ventilation{--fc:var(--vent);--fs:var(--vent-s)}
.bcard .pic img{display:block;width:100%;height:auto;aspect-ratio:16/10;object-fit:cover}

/* panel */
.panel{background:var(--white);border:1px solid var(--border);border-radius:16px;position:sticky;top:var(--head-h,120px);max-height:calc(100vh - var(--head-h,120px) - 16px);overflow:auto;box-shadow:0 1px 2px var(--shadow-soft)}
.ph{padding:18px 20px 14px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--white);z-index:2}
.ph .eb{font-size:11px;font-weight:600;letter-spacing:.3px;color:var(--fc,var(--text3));margin-bottom:2px}
.ph h2{font-size:19px;font-weight:600;margin:0;line-height:1.3}
.ph p{font-size:13px;color:var(--text3);margin:6px 0 0;font-weight:300;line-height:1.5}
.pb{padding:8px 12px 16px}
.grp-t{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.3px;padding:12px 8px 4px}
.ivr{display:flex;flex-direction:column;border-radius:8px;transition:background .15s}
.ivr.pin{background:var(--fs,var(--accent-s));box-shadow:inset 3px 0 0 var(--fc,var(--accent))}
.ivr.pin .iv{color:var(--text)}
.ct.fx{background:var(--text);color:#fff;border-color:var(--text);display:inline-flex;align-items:center;gap:3px}
.ct.fx svg{width:10px;height:10px}
.ivx{padding:0 10px 12px;display:flex;flex-direction:column;gap:8px;font-size:12.5px;line-height:1.5;color:var(--text2)}
.ivx b{display:block;font-size:11px;font-weight:600;letter-spacing:.3px;color:var(--text3)}
.ivx .na{color:var(--text3);font-style:italic}
.ivx .seen svg{width:14px;height:14px;flex:none}
.ivx .seen{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--fc,var(--accent))}
.ivr.on{background:var(--green-s)}
.apb{flex:none;margin:8px 6px 0 0;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--border2);background:var(--white);color:var(--text2);display:grid;place-items:center;cursor:pointer;transition:all .15s}
.apb:hover{border-color:var(--green);color:var(--green)}
.apb.on{background:var(--green);border-color:var(--green);color:#fff}
.apb svg{width:14px;height:14px}
.apk{position:absolute;left:0;top:0;z-index:4;pointer-events:none;display:inline-flex;align-items:center;gap:3px;background:var(--green);color:#fff;border:2px solid #fff;border-radius:12px;padding:1px 7px 1px 5px;font-size:11px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.25);will-change:transform}
.apk svg{width:11px;height:11px}
.design{position:absolute;right:14px;bottom:12px;z-index:5;display:inline-flex;white-space:nowrap;align-items:center;gap:8px;background:var(--green);color:#fff;border:0;border-radius:20px;padding:7px 14px 7px 10px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgba(26,110,60,.35)}
.design[hidden]{display:none}
.design svg{width:14px;height:14px;flex:none}
.design b{background:#fff;color:var(--green);border-radius:10px;padding:0 7px;font-size:11.5px}
.toast{position:absolute;left:50%;bottom:58px;transform:translate(-50%,10px);z-index:7;background:var(--text);color:#fff;border-radius:20px;padding:8px 16px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:80%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.dlap{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--green);background:var(--white);color:var(--green);border-radius:20px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;align-self:flex-start}
.dlap.on{background:var(--green);color:#fff}
.clr{border:0;background:none;color:var(--red);font-size:12.5px;cursor:pointer;padding:6px 10px}
.iv{display:flex;flex-direction:column;gap:5px;text-align:left;width:100%;border:0;background:none;border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.45;color:var(--text2);cursor:pointer}
.iv:hover{background:var(--fs,var(--accent-s));color:var(--text)}
.meta{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.ct{font-size:10px;font-weight:600;padding:0 6px;border-radius:2px;letter-spacing:.3px;line-height:1.7;border:1px solid}
.ct.lv{background:var(--neutral-s);color:var(--text2);border-color:var(--border)}
.ct.m{background:var(--amber-s);color:var(--amber);border-color:var(--amber-b)}
.ct.e{background:var(--green-s);color:var(--green);border-color:var(--green-b)}
.ct.w{background:var(--red-s);color:var(--red);border-color:var(--red-b)}
.ct.fn{background:var(--fs);color:var(--fc);border-color:transparent}
.hlist{display:flex;flex-direction:column;gap:2px;padding:6px 0}
.hrow{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;border-radius:10px;padding:9px 10px;cursor:pointer;text-align:left;font-size:13.5px;color:var(--text)}

/* ===== kleuren en vormen uit de rekenketen ===== */

/* ===== v13: left filter column, my selection, clean table ===== */

.main{min-width:0}

.pill:hover{border-color:var(--accent)}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pill[class*=" f-"].on{background:var(--fc);border-color:var(--fc)}

.pill.pulse{animation:pulse 1.8s ease-in-out 2}
.cks{display:flex;flex-direction:column;gap:2px}

.pvdoc{width:680px;background:#fff;color:var(--text);font-family:var(--sans);font-size:10pt;line-height:1.5}
.pvdoc .pv-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.pvdoc .pv-name{font-size:10pt;font-weight:600;color:var(--text2);text-align:center;white-space:nowrap}
.pvdoc .pv-logos{display:flex;gap:14px;align-items:center;justify-content:flex-end}
.pvdoc .pv-logos img{height:24px;width:auto}
.pvdoc .pv-hero{background:#f6f3ec;border-radius:12px;padding:18px 22px;margin-bottom:22px}
.pvdoc .pv-date{font-size:9pt;color:var(--accent);font-weight:500}
.pvdoc .pv-hero h1{font-size:24pt;font-weight:400;margin:2px 0 0;letter-spacing:-.3px;line-height:1.15}
.pvdoc .pv-hero p{margin:2px 0 0;font-size:13pt;font-weight:700;color:var(--accent)}
.pvdoc .pv-sec{margin-bottom:18px}
.pvdoc .pv-sec h2{font-size:13pt;font-weight:600;margin:0 0 4px;padding-bottom:6px;border-bottom:2px solid var(--accent);break-after:avoid;page-break-after:avoid}
.pvdoc .pv-it{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--border);break-inside:avoid;page-break-inside:avoid}
.pvdoc .pv-n{flex:none;width:30px;height:30px;border-radius:6px;background:var(--accent-s);color:var(--accent);font-weight:600;font-size:9.5pt;display:flex;align-items:center;justify-content:center}
.pvdoc .pv-c{flex:1;min-width:0}
.pvdoc .pv-eb{font-size:8pt;font-weight:600;color:var(--text3);letter-spacing:.2px}
.pvdoc .pv-it h3{font-size:11pt;font-weight:600;margin:1px 0 6px;line-height:1.4}
.pvdoc .pv-kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px 14px;margin:0}
.pvdoc .pv-kv div{min-width:0}
.pvdoc .pv-kv dt{font-size:7.5pt;color:var(--text3);font-weight:500}
.pvdoc .pv-kv dd{margin:0;font-size:8.5pt;color:var(--text2)}
.pvdoc .pv-notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;margin-top:8px}
.pvdoc .pv-pos,.pvdoc .pv-neg{border-radius:6px;border:1px solid;padding:7px 10px;font-size:8.5pt;color:var(--text2);line-height:1.45}
.pvdoc .pv-pos{background:var(--green-s);border-color:var(--green-b)}
.pvdoc .pv-neg{background:var(--red-s);border-color:var(--red-b)}
.pvdoc .pv-notes b{display:block;font-size:8pt;color:var(--text);font-weight:600}
.pvdoc .pv-foot{margin-top:16px;font-size:7.5pt;color:var(--text3);line-height:1.5}
.cbtn:disabled{opacity:.6;cursor:progress}
@page{size:A4;margin:16mm 15mm 18mm}
@media print{
  body.pcart{background:#fff!important;padding:0!important;margin:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body.pcart>*:not(#printv){display:none!important}
  body.pcart #printv{display:block}
  body.pcart .pvdoc{width:auto}
}

/* search next to the view switch */
.topbar{grid-template-columns:minmax(0,1fr) auto!important}
.mhead .lang{width:38px;height:38px}
.mhead .beta{display:inline-flex!important;align-items:center;height:38px}
.lang[hidden],.beta[hidden]{display:none!important}
.ttl{margin:0;justify-self:start;text-align:left;font-size:22px;line-height:1.25;font-weight:400;letter-spacing:-.2px;text-wrap:balance}
.ttl em{font-style:normal;font-weight:700;color:var(--accent)}
@media (max-width:1180px){.ttl{font-size:20px}}
@media (max-width:860px){.ttl{grid-column:1/-1;grid-row:2}}
@media (max-width:700px){.ttl{font-size:18px}}
.topbar .tr{justify-self:end}
.sslot{flex:1;min-width:0;max-width:440px;display:flex}
.mhead .cartb{height:38px}
.cartb[hidden]{display:none}
.sslot .search{max-width:none;width:100%}
.sslot .ss-box{padding:7px 14px;background:var(--white)}
.mhead{flex-wrap:wrap}
@media (max-width:700px){.sslot{flex:1 1 200px;max-width:none}.mhead .cartb .cl{display:none}}
/* v14: white page, no top bar, logos in the page header */
:root{--cream:#ffffff}
body{background:#fff}
.head{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);padding:0!important;margin:0!important}
.wrap{padding-top:32px}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:24px 40px;margin:0 0 6px}
.ptxt{min-width:0}
.pname{margin:0 0 10px;font:600 13px/1.3 var(--sans);color:var(--text2);letter-spacing:.2px}
.plogos{display:flex;align-items:center;gap:24px;flex:none;padding-top:4px}
.plogos a{display:block;line-height:0}
.plogos img{height:40px;width:auto}
.mhead .beta{background:#fff}
@media (max-width:700px){
  .phead{flex-direction:column-reverse;gap:14px}
  .plogos{gap:16px}.plogos img{height:28px}
  .wrap{padding-top:16px}
}
/* v15: logos in the tool row, shorter search, aligned bottoms */
.sslot{max-width:300px}
.mhead .plogos{margin-left:12px;padding:0;gap:18px}
.mhead .plogos img{height:30px}
@media (min-width:1001px){
  .layout.l3d{align-items:stretch}
  .layout.l3d .side{position:static;max-height:none}
  .layout.l3d .main{display:flex;flex-direction:column}
  .layout.l3d .explore{flex:1;display:flex;flex-direction:column}
  .layout.l3d .stage{flex:1;aspect-ratio:auto!important;min-height:560px;max-height:none}
  .cap3d{margin-left:328px}
}

@media (max-width:700px){.mhead .plogos img{height:24px}}
/* v16: page intro aligned with the analysis area */
@media (min-width:1001px){.phead{padding-left:328px}}
.phead h1{margin-bottom:22px}
/* v17: step instruction inside the filter box, source aligned with the analysis area */
.layout.l3d .side{display:flex;flex-direction:column}
.scap{margin:2px 0 0;padding:14px 0 0;border-top:1px solid var(--border2);font-size:12.5px;line-height:1.55;color:var(--text2)}
.side .rreset{align-self:flex-start;margin-bottom:16px}
@media (min-width:1001px){.src{margin-left:328px}}
@media (max-width:1000px){.layout.l3d .side{display:grid}.scap{grid-column:1/-1;margin-top:8px}}
/* v18: logos above the filter box, top-aligned with the heading */
@media (min-width:1001px){
  .phead{display:grid;grid-template-columns:300px minmax(0,1fr);column-gap:28px;padding-left:0;justify-content:start}
  .phead .ptxt{display:contents}
  .phead .pname{grid-column:2;grid-row:1}
  .phead h1{grid-column:2;grid-row:2}
  .phead .plogos{grid-column:1;grid-row:2;align-self:start;margin-top:6px;padding:0;gap:22px}
  .phead .plogos img{height:38px}
}
@media (max-width:1000px){.phead{flex-direction:column}.phead .plogos{order:-1;padding:0}.phead .plogos img{height:30px}}
/* v19: compact header band */
@media (min-width:1001px){
  .phead{align-items:center;row-gap:0;padding:4px 0 8px;margin:0 0 24px}
  .phead .pname{margin:0 0 4px;font-size:12.5px;color:var(--text3);font-weight:500}
  .phead h1{margin:0!important;font-size:30px;line-height:1.2;white-space:nowrap}
  .phead h1 br{display:none}
  .phead h1 em::before{content:" "}
  .phead .plogos{grid-row:1/3;align-self:center;margin:0}
  .phead .plogos img{height:36px}
}
@media (min-width:1001px) and (max-width:1250px){.phead h1{white-space:normal}.phead h1 br{display:inline}.phead h1 em::before{content:none}}
.apb{padding:0!important;display:grid!important;place-items:center;line-height:0;box-sizing:border-box}
.apb svg{display:block;margin:0;flex:none}
.ci-x{padding:0;line-height:0}
/* v20: info dialog, function notice, per-tab filters */
.infob b{display:none}
.fnote{position:absolute;left:16px;top:16px;z-index:5;display:flex;align-items:center;gap:10px;max-width:min(380px,calc(100% - 32px));background:var(--text);color:#fff;border-radius:8px;padding:10px 16px 10px 12px;font-size:13.5px;line-height:1.45;box-shadow:0 8px 24px rgba(0,0,0,.18);pointer-events:none;animation:fnin .4s ease-out}
.fnote[hidden]{display:none}
.fnote svg{flex:none;color:var(--accent);animation:fnar 1.4s ease-in-out infinite}
.fnote b{color:#f6a27c;font-weight:600}
.fnote.nudge{animation:fnudge .45s ease-in-out}
@keyframes fnin{from{opacity:0;transform:translateY(-6px)}}
@keyframes fnar{50%{transform:translateX(-4px)}}
@keyframes fnudge{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(5px)}}
.snote{margin:0;font-size:13px;line-height:1.6;color:var(--text2);background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px 14px}
#info{max-width:min(980px,calc(100vw - 32px));width:100%;max-height:calc(100vh - 48px);padding:0;border-radius:14px;overflow:hidden}
#info[open]{display:flex;flex-direction:column}
.inf{display:flex;flex-direction:column;min-height:0;max-height:calc(100vh - 48px)}
.inf-h{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:24px 32px 16px;border-bottom:1px solid var(--border);background:#fff}
.inf-h .eb{font-size:12px;font-weight:500;color:var(--text3);margin-bottom:2px}
.inf-h h2{margin:0;font-size:26px;font-weight:400;letter-spacing:-.3px;line-height:1.2}
.inf-b{overflow:auto;padding:22px 32px 30px;overscroll-behavior:contain}
.inf-lead{font-size:15.5px;line-height:1.7;color:var(--text);margin:0 0 8px;max-width:78ch}
.inf-s{margin-top:26px}
.inf-s h3{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600;margin:0 0 6px}
.inf-s h3 span{width:26px;height:26px;border-radius:6px;background:var(--accent-s);color:var(--accent);display:grid;place-items:center;font-size:12.5px;font-weight:700;flex:none}
.inf-s>p{margin:0 0 14px;font-size:14px;line-height:1.7;color:var(--text2);max-width:80ch}
.inf-types{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.inf-type{display:flex;flex-direction:column;gap:6px;text-align:left;background:#f6f3ec;border:1px solid transparent;border-radius:10px;padding:16px 18px;cursor:pointer;color:var(--text);font:inherit;transition:border-color .15s,background .15s}
.inf-type:hover{border-color:var(--accent);background:#fff}
.inf-type b{font-size:15px;font-weight:600}
.inf-type span{font-size:13px;line-height:1.55;color:var(--text2)}
.inf-type em{margin-top:auto;padding-top:6px;font-style:normal;font-size:12.5px;font-weight:500;color:var(--accent);display:inline-flex;align-items:center;gap:6px}
.inf-type em svg{width:13px;height:13px}
.inf-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.inf-card{position:relative;background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px 14px 14px;display:flex;flex-direction:column;align-items:center;text-align:center}
.inf-l{position:absolute;top:-1px;left:50%;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:15px;display:grid;place-items:center;box-shadow:0 0 0 4px #fff}
.inf-card.lv .inf-l{font-size:12px}
.inf-grid{padding-top:17px}
.inf-img{height:92px;width:100%;display:flex;align-items:center;justify-content:center;margin:10px 0 10px}
.inf-img img{max-height:100%;max-width:100%;object-fit:contain}
.inf-card b{font-size:14px;font-weight:600;margin-bottom:6px}
.inf-card ul{list-style:none;margin:0;padding:10px 0 0;border-top:1px solid var(--border);width:100%;font-size:12.5px;line-height:1.6;color:var(--text2)}
.inf-who{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.inf-w{background:#f6f3ec;border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.inf-w b{font-size:14.5px;font-weight:600}
.inf-w span{font-size:13px;line-height:1.55;color:var(--text2)}
.inf-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto;padding-top:6px}
.inf-chips i{font-style:normal;font-size:11.5px;font-weight:500;background:#fff;border:1px solid var(--accent-b);color:var(--accent);border-radius:4px;padding:1px 7px}
.inf-src{margin:28px 0 0;padding:14px 16px;border-left:3px solid var(--accent);background:var(--accent-s);border-radius:0 8px 8px 0;font-size:13px;line-height:1.6;color:var(--text2)}
@media (max-width:860px){
  .inf-grid{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:26px}
  .inf-types,.inf-who{grid-template-columns:minmax(0,1fr)}
  .inf-h{padding:18px 18px 12px}.inf-b{padding:16px 18px 24px}.inf-h h2{font-size:21px}
}
@media (max-width:700px){.mhead .infob span{display:none}}
/* v21: notice styled like the stage buttons */
.fnote{background:var(--white);color:var(--text);border:1px solid var(--border);border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.08);font-weight:500;font-size:13px;padding:8px 14px 8px 10px}
.fnote b{color:var(--accent);font-weight:600}
/* v22: info button styled like the language button */
.infob{height:38px;min-width:38px;padding:0 12px;border:1px solid var(--accent);border-radius:4px;background:var(--white);color:var(--accent);font:700 10.5px/1 var(--sans);letter-spacing:.2px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.infob:hover{background:var(--accent-s)}
.infob[hidden]{display:none}
@media (max-width:700px){.mhead .infob span{display:inline}}
/* v23: beta styled like info and language */
.mhead .beta{height:38px;min-width:38px;padding:0 12px;border:1px solid var(--accent);border-radius:4px;background:var(--white);color:var(--accent);font:700 10.5px/1 var(--sans);letter-spacing:.2px;font-style:normal;display:inline-flex!important;align-items:center;justify-content:center}
.mhead .beta[hidden]{display:none!important}
</style>

<script>
/* ---------- 3D scenes (three.js r128) ---------- */
const S3=(function(){
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const rnd=(a,b)=>a+Math.random()*(b-a);
let seed=7; const rr=()=>{seed=(seed*16807)%2147483647; return (seed-1)/2147483646;};

/* canvas textures */
function cv(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');fn(x,w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t;}
function noise(x,w,h,a){const d=x.getImageData(0,0,w,h);for(let i=0;i<d.data.length;i+=4){const n=(rr()-.5)*a;d.data[i]+=n;d.data[i+1]+=n;d.data[i+2]+=n;}x.putImageData(d,0,0);}
const TX={
 brick:()=>cv(512,256,(x,w,h)=>{x.fillStyle='#cbbfb1';x.fillRect(0,0,w,h);const bh=16,bw=54;for(let r=0;r<h/bh;r++){const off=(r%2)*bw/2;for(let c=-1;c<w/bw+1;c++){const l=34+rr()*14,s=40+rr()*14,hh=10+rr()*8;x.fillStyle=`hsl(${hh},${s}%,${l}%)`;x.fillRect(c*bw+off+1.5,r*bh+1.5,bw-3,bh-3);}}noise(x,w,h,18);}),
 tiles:()=>cv(256,256,(x,w,h)=>{const rh=64;for(let r=0;r<h/rh;r++){for(let c=0;c<4;c++){const off=(r%2)*32;const g=x.createLinearGradient(0,r*rh,0,r*rh+rh);g.addColorStop(0,'#5a4a42');g.addColorStop(.75,'#3f332e');g.addColorStop(1,'#2a221f');x.fillStyle=g;x.fillRect(c*64+off-64,r*rh,62,rh-2);x.fillRect(c*64+off,r*rh,62,rh-2);}}noise(x,w,h,14);}),
 planks:()=>cv(512,512,(x,w,h)=>{const pw=38;for(let i=0;i<w/pw;i++){let y=-rr()*200;while(y<h){const L=120+rr()*200;x.fillStyle=`hsl(${30+rr()*6},${38+rr()*10}%,${66+rr()*8}%)`;x.fillRect(i*pw+1,y+1,pw-2,L-2);y+=L;}}noise(x,w,h,10);}),
 pavers:()=>cv(256,256,(x,w,h)=>{x.fillStyle='#b9b3aa';x.fillRect(0,0,w,h);const bh=26,bw=52;for(let r=0;r<h/bh;r++){const off=(r%2)*bw/2;for(let c=-1;c<w/bw+1;c++){const l=70+rr()*10;x.fillStyle=`hsl(35,6%,${l}%)`;x.fillRect(c*bw+off+2,r*bh+2,bw-4,bh-4);}}noise(x,w,h,10);}),
 insul:()=>cv(128,128,(x,w,h)=>{x.fillStyle='#f0c23a';x.fillRect(0,0,w,h);for(let i=0;i<220;i++){x.strokeStyle=`rgba(${200+rr()*55},${150+rr()*60},40,.5)`;x.beginPath();const a=rr()*w,b=rr()*h;x.moveTo(a,b);x.quadraticCurveTo(a+rr()*20-10,b+rr()*20-10,a+rr()*30-15,b+rr()*30-15);x.stroke();}}),
 concrete:()=>cv(128,128,(x,w,h)=>{x.fillStyle='#d6d1c9';x.fillRect(0,0,w,h);noise(x,w,h,16);}),
 sedum:()=>cv(128,128,(x,w,h)=>{x.fillStyle='#7aa752';x.fillRect(0,0,w,h);for(let i=0;i<500;i++){x.fillStyle=`hsl(${80+rr()*40},${40+rr()*20}%,${35+rr()*25}%)`;x.beginPath();x.arc(rr()*w,rr()*h,1+rr()*2.5,0,7);x.fill();}}),
 grass:()=>cv(128,128,(x,w,h)=>{x.fillStyle='#8fb46a';x.fillRect(0,0,w,h);for(let i=0;i<900;i++){x.fillStyle=`hsl(${85+rr()*20},${35+rr()*15}%,${38+rr()*20}%)`;x.fillRect(rr()*w,rr()*h,1,3);}}),
 grille:()=>cv(128,128,(x,w,h)=>{x.fillStyle='#f4f4f2';x.fillRect(0,0,w,h);x.strokeStyle='#9a9a96';x.lineWidth=2;for(let i=6;i<w;i+=8){x.beginPath();x.moveTo(i,6);x.lineTo(i,h-6);x.stroke();}}),
 fan:()=>cv(128,128,(x,w,h)=>{x.fillStyle='#f2f2ef';x.fillRect(0,0,w,h);x.strokeStyle='#8c8c88';x.lineWidth=2;for(let r=10;r<56;r+=7){x.beginPath();x.arc(64,64,r,0,7);x.stroke();}x.beginPath();x.moveTo(8,64);x.lineTo(120,64);x.moveTo(64,8);x.lineTo(64,120);x.stroke();})
};
let T0=null;
function tex(){ if(!T0){T0={};for(const k in TX)T0[k]=TX[k]();} return T0; }
function rep(t,rx,ry){const c=t.clone();c.needsUpdate=true;c.repeat.set(rx,ry);return c;}

/* materials */
function mats(){const t=tex();return{
  brick:(w,h)=>new THREE.MeshStandardMaterial({map:rep(t.brick,w/2,h),roughness:.92}),
  tiles:(w,h)=>new THREE.MeshStandardMaterial({map:rep(t.tiles,w,h),roughness:.8}),
  planks:(w,h)=>new THREE.MeshStandardMaterial({map:rep(t.planks,w/2,h/2),roughness:.7}),
  pavers:(w,h)=>new THREE.MeshStandardMaterial({map:rep(t.pavers,w,h),roughness:.95}),
  insul:(w,h)=>new THREE.MeshStandardMaterial({map:rep(t.insul,w*1.5,h*1.5),roughness:1}),
  concrete:(w,h)=>new THREE.MeshStandardMaterial({map:rep(t.concrete,w/2,h/2),roughness:.95}),
  sedum:(w,h)=>new THREE.MeshStandardMaterial({map:rep(t.sedum,w,h),roughness:1}),
  grass:(w,h)=>new THREE.MeshStandardMaterial({map:rep(t.grass,w/2,h/2),roughness:1}),
  plaster:new THREE.MeshStandardMaterial({color:0xf6f2ec,roughness:.95}),
  white:new THREE.MeshStandardMaterial({color:0xfbfbf8,roughness:.5}),
  frame:new THREE.MeshStandardMaterial({color:0xf3efe6,roughness:.6}),
  dark:new THREE.MeshStandardMaterial({color:0x3b3d3f,roughness:.6,metalness:.2}),
  wood:new THREE.MeshStandardMaterial({color:0x8b6a4c,roughness:.8}),
  stone:new THREE.MeshStandardMaterial({color:0xcfc7bb,roughness:.9}),
  glass:new THREE.MeshPhysicalMaterial({color:0x9ec6dc,roughness:.05,metalness:.1,transparent:true,opacity:.45}),
  leaf:new THREE.MeshStandardMaterial({color:0x557f43,roughness:.9}),
  leaf2:new THREE.MeshStandardMaterial({color:0x6a9852,roughness:.9}),
  trunk:new THREE.MeshStandardMaterial({color:0x7c5d44,roughness:.9}),
  metal:new THREE.MeshStandardMaterial({color:0xc9ccce,roughness:.35,metalness:.6}),
  fabric:new THREE.MeshStandardMaterial({color:0xd9cbb7,roughness:1}),
  fabric2:new THREE.MeshStandardMaterial({color:0x9fb3a8,roughness:1}),
  grille:new THREE.MeshStandardMaterial({map:t.grille,roughness:.6}),
  fan:new THREE.MeshStandardMaterial({map:t.fan,roughness:.6})
