<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Circular HVAC Design Framework</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,600&family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: FCAB-site shell, light only. Sticky topbar; below it a visual explorer:
   choose a building → choose heating / cooling / ventilation → clickable markers in a cutaway drawing → side panel with interventions. */
:root{
  color-scheme:light;
  --cream:#faf9f7; --white:#ffffff; --border:#e8e4de; --border2:#d4cfc8;
  --text:#1c1a17; --text2:#5a5650; --text3:#9c9690;
  --accent:#e07a2f; --accent-s:rgba(224,122,47,.09); --accent-b:rgba(224,122,47,.22);
  --green:#1a6e3c; --green-s:rgba(26,110,60,.08); --green-b:rgba(26,110,60,.18);
  --amber:#b45309; --amber-s:rgba(180,83,9,.08); --amber-b:rgba(180,83,9,.18);
  --red:#b91c1c; --red-s:rgba(185,28,28,.07); --red-b:rgba(185,28,28,.16);
  --neutral-s:#f0ede8; --hover:rgba(0,0,0,.025);
  --shadow-soft:rgba(28,26,23,.08); --shadow-card:rgba(0,0,0,.08);
  --beta-bg:#1c1a17; --beta-t:#ffffff;
  --heat:#d0452f; --heat-s:rgba(208,69,47,.1);
  --cool:#2a6fc0; --cool-s:rgba(42,111,192,.1);
  --vent:#2f9468; --vent-s:rgba(47,148,104,.1);
  --idle:#b9b0a4;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --wordmark:'Poppins',system-ui,sans-serif;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);background:var(--cream);color:var(--text);font-size:15px;line-height:1.65;padding-inline:16px;padding-block:0 16px}
::selection{background:var(--accent-b)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button,input{font-family:var(--sans);color:var(--text)}

/* sticky head + topbar */
.head{position:sticky;top:0;z-index:200;background:var(--cream);padding-top:calc(env(safe-area-inset-top,0px) + 16px);padding-bottom:4px;margin-inline:-16px;padding-inline:16px}
.topbar{position:relative;background:var(--white);border-radius:18px;box-shadow:0 4px 24px var(--shadow-soft);
  min-height:84px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px 24px;padding:12px 28px;max-width:1440px;margin:0 auto}
.title{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.title span{font-size:13.6px;color:var(--text2);letter-spacing:.1px;line-height:1.35;white-space:nowrap}
.title span:first-child{font-weight:600;color:var(--text)}
.search{justify-self:center;width:100%;max-width:470px;display:flex;align-items:center;gap:10px}
.search .ss-box{flex:1;min-width:0}
.ss-box{display:flex;align-items:center;gap:8px;border:1px solid var(--border2);border-radius:20px;background:var(--white);padding:8px 14px;color:var(--text3)}
.ss-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-s)}
.ss-box input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:13px}
.ss-box input::-webkit-search-cancel-button{display:none}
.ss-box input::placeholder{color:var(--text3)}
.ss-x{border:0;background:none;color:var(--text3);font-size:17px;line-height:1;cursor:pointer;padding:0 2px}
.tr{display:flex;align-items:center;gap:18px}
.lang{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid var(--border);background:var(--white);color:var(--text2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:10.5px;font-weight:700;letter-spacing:.2px}
.lang:hover{color:var(--accent);border-color:var(--accent-b);background:var(--accent-s)}
.logos{display:flex;align-items:center;gap:18px}
.logos a{display:block;line-height:0}
.logos img{height:32px;width:auto;display:block}
.logos .sep{width:1px;height:30px;background:var(--border)}
.beta{font-family:var(--wordmark);font-size:14px;font-weight:600;font-style:italic;color:var(--beta-t);background:var(--beta-bg);padding:4px 12px;border-radius:20px}

/* page */
.wrap{max-width:1280px;margin:0 auto;padding:30px 12px 70px}
h1{font-size:32px;font-weight:700;color:var(--text);line-height:1.2;letter-spacing:-.7px;margin:0 0 10px;text-wrap:balance}
h1 em{font-style:italic;font-weight:300;color:var(--text2)}
.lead{font-size:16px;font-weight:300;color:var(--text2);line-height:1.7;margin:0 0 26px;max-width:720px}
.steplbl{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.4px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.steplbl b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px}
.src{font-size:12px;color:var(--text3);font-weight:300;margin:30px 0 0;max-width:95ch;line-height:1.6}

/* building chooser */
.choose{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;max-width:1000px}
.bcard{display:flex;flex-direction:column;gap:0;text-align:left;background:var(--white);border:1px solid var(--border);border-radius:16px;padding:0;cursor:pointer;overflow:hidden;box-shadow:0 1px 2px var(--shadow-soft);transition:box-shadow .2s,transform .2s,border-color .2s}
.bcard:hover{box-shadow:0 14px 34px var(--shadow-card);transform:translateY(-3px);border-color:var(--accent-b)}
.bcard .pic{background:linear-gradient(#f3f6f8,#fbfaf7);border-bottom:1px solid var(--border)}
.bcard .pic svg{display:block;width:100%;height:auto}
.bcard .bt{padding:16px 20px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.bcard .bn{font-size:17px;font-weight:600}
.bcard .bs{font-size:13px;color:var(--text3);font-weight:300}
.bcard .go{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}

/* toolbar */
.tools{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 28px;margin:0 0 16px}
.tgrp{display:flex;flex-direction:column;gap:6px}
.tgrp-l{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.3px}
.seg{display:inline-flex;background:var(--white);border:1px solid var(--border2);border-radius:22px;padding:3px;gap:2px}
.seg button{display:inline-flex;align-items:center;gap:7px;border:0;background:none;border-radius:18px;padding:6px 14px;font-size:13px;color:var(--text2);cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--text);color:#fff}
.fn-btns{display:flex;flex-wrap:wrap;gap:8px}
.fnb{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--border2);background:var(--white);border-radius:22px;padding:7px 16px 7px 12px;font-size:13.5px;font-weight:500;color:var(--text2);cursor:pointer;transition:all .15s}
.fnb .dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--fs);color:var(--fc)}
.fnb:hover{border-color:var(--fc);color:var(--text)}
.fnb.on{background:var(--fc);border-color:var(--fc);color:#fff}
.fnb.on .dot{background:rgba(255,255,255,.2);color:#fff}
.f-heating{--fc:var(--heat);--fs:var(--heat-s)} .f-cooling{--fc:var(--cool);--fs:var(--cool-s)} .f-ventilation{--fc:var(--vent);--fs:var(--vent-s)}
.fnb.pulse{animation:pulse 1.8s ease-in-out 2}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--fs)}}
.dd{position:relative}
.ddb{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border2);background:var(--white);border-radius:20px;padding:7px 12px 7px 15px;font-size:13px;color:var(--text2);cursor:pointer;line-height:1.3}
.ddb:hover{color:var(--text);border-color:var(--accent-b)}
.ddb svg{opacity:.55;transition:transform .15s}
.ddb[aria-expanded="true"] svg{transform:rotate(180deg)}
.ddb.act{border-color:var(--accent-b);background:var(--accent-s);color:var(--accent);font-weight:500}
.ddb .cnt{font-size:11px;font-weight:600}
.ddm{position:absolute;top:calc(100% + 6px);left:0;z-index:60;background:var(--white);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 32px var(--shadow-soft);padding:6px 0;min-width:230px;max-width:calc(100vw - 32px)}
.ddm.r{left:auto;right:0}
.fi{display:flex;align-items:center;gap:10px;width:100%;padding:7px 16px;cursor:pointer;color:var(--text2);font-size:13px;border:0;background:none;text-align:left;line-height:1.4;white-space:nowrap}
.fi:hover{background:var(--hover);color:var(--text)}
.fi .bx{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--border2);flex:none;display:grid;place-items:center;background:var(--white)}
.fi[aria-pressed="true"]{color:var(--text)}
.fi[aria-pressed="true"] .bx{background:var(--accent);border-color:var(--accent)}
.fi[aria-pressed="true"] .bx::after{content:"";width:6px;height:3.5px;border-left:1.6px solid #fff;border-bottom:1.6px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.fi .ic{display:flex;color:var(--text3)}
.fi .rn{font-size:10.5px;font-weight:700;color:var(--text3);min-width:20px}
.rreset{border:0;background:none;color:var(--accent);font-size:12.5px;font-weight:500;cursor:pointer;padding:8px 4px}

/* explorer */
.explore{display:block}
.pop{position:absolute;z-index:6;width:390px;max-width:calc(100% - 28px);max-height:min(78%,520px);overflow:auto;background:var(--white);border:1px solid var(--border);border-top:4px solid var(--fc,var(--accent));border-radius:14px;box-shadow:0 18px 44px rgba(28,26,23,.22);cursor:auto;overscroll-behavior:contain}
.pop[hidden]{display:none}
.pop .ph{padding:14px 16px 10px;position:sticky;top:0;background:var(--white);border-bottom:1px solid var(--border);z-index:2;display:flex;gap:10px;align-items:flex-start}
.pop .ph>div{flex:1;min-width:0}
.pop .ph h2{font-size:17px}
.pop .ph p{font-size:12.5px;margin-top:2px}
.pop .pb{padding:4px 8px 10px}
.pop .legend{padding:10px 16px 14px}
.px{width:30px;height:30px;flex:none;border-radius:50%;border:1px solid var(--border);background:var(--white);color:var(--text2);display:grid;place-items:center;cursor:pointer}
.px:hover{color:var(--fc,var(--accent));border-color:var(--fc,var(--accent))}
.tip{position:absolute;left:14px;top:14px;z-index:4;max-width:min(420px,calc(100% - 200px));background:rgba(255,255,255,.92);border:1px solid var(--border);border-radius:12px;padding:8px 14px;font-size:13px;color:var(--text2);pointer-events:none;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.tip[hidden]{display:none}
/* stage */
.stage{aspect-ratio:16/9!important;max-height:calc(100vh - var(--head-h,120px) - 20px);min-height:420px;position:relative;background:radial-gradient(120% 90% at 50% 20%,#ffffff 0%,#f3efe8 60%,#ebe5dc 100%);border:1px solid var(--border);border-radius:16px;overflow:hidden;aspect-ratio:16/11;cursor:grab}
.stage:active{cursor:grabbing}
.stage canvas{display:block}
.hint{position:absolute;left:14px;bottom:12px;font-size:12px;color:var(--text2);display:flex;gap:8px;align-items:center;pointer-events:none;background:rgba(255,255,255,.85);border:1px solid var(--border);border-radius:20px;padding:4px 12px}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--text3);font-size:13px}
#marks{position:absolute;inset:0;pointer-events:none}
.mk{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:flex;align-items:center;border:0;background:none;padding:0;cursor:pointer;z-index:3;pointer-events:auto;will-change:transform}
.mk .c{position:relative;width:34px;height:34px;border-radius:50%;background:#e8b62a;color:#fff;display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.25),0 0 0 3px rgba(255,255,255,.55);transition:transform .15s,background .15s}
.mk .c svg{width:16px;height:16px}
.mk .c::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid #e8b62a;opacity:0;animation:ring 2.4s ease-out infinite}
@keyframes ring{0%{opacity:.6;transform:scale(.75)}80%,100%{opacity:0;transform:scale(1.3)}}
.mk .n{position:absolute;top:-6px;right:-8px;min-width:18px;height:18px;border-radius:9px;background:#fff;color:var(--text);font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.mk .l{position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);background:var(--white);border:1px solid var(--border);border-radius:14px;padding:3px 10px;font-size:12px;font-weight:500;color:var(--text);white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.1);opacity:0;pointer-events:none;transition:opacity .15s}
.mk.left .l{left:auto;right:calc(100% + 10px)}
.mk:hover .l,.mk:focus-visible .l,.mk.on .l,.mk.hov .l{opacity:1}
.mk.hov .c{transform:scale(1.15)}
.mk:hover .c{transform:scale(1.12)}
.mk.on .c{background:var(--fc);transform:scale(1.15)}
.mk.on .c::before{display:none}
.mk.on .c svg{transform:rotate(45deg)}
.gnl{position:absolute;right:14px;top:14px;z-index:3;display:inline-flex;align-items:center;gap:8px;background:var(--white);border:1px solid var(--border);border-radius:20px;padding:6px 14px 6px 8px;font-size:12.5px;font-weight:500;color:var(--text);cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.gnl .c{width:24px;height:24px;border-radius:50%;background:#e8b62a;color:#fff;display:grid;place-items:center}
.gnl.on{background:var(--fc);color:#fff;border-color:var(--fc)}
.gnl b{font-weight:700}
.stage.f-heating,.panel.f-heating,.pop.f-heating{--fc:var(--heat);--fs:var(--heat-s)}
.stage.f-cooling,.panel.f-cooling{--fc:var(--cool);--fs:var(--cool-s)}
.stage.f-ventilation,.panel.f-ventilation{--fc:var(--vent);--fs:var(--vent-s)}
.bcard .pic img{display:block;width:100%;height:auto;aspect-ratio:16/10;object-fit:cover}

/* panel */
.panel{background:var(--white);border:1px solid var(--border);border-radius:16px;position:sticky;top:var(--head-h,120px);max-height:calc(100vh - var(--head-h,120px) - 16px);overflow:auto;box-shadow:0 1px 2px var(--shadow-soft)}
.ph{padding:18px 20px 14px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--white);z-index:2}
.ph .eb{font-size:11px;font-weight:600;letter-spacing:.3px;color:var(--fc,var(--text3));margin-bottom:2px}
.ph h2{font-size:19px;font-weight:600;margin:0;line-height:1.3}
.ph p{font-size:13px;color:var(--text3);margin:6px 0 0;font-weight:300;line-height:1.5}
.pb{padding:8px 12px 16px}
.grp-t{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.3px;padding:12px 8px 4px}
.ivr{display:flex;flex-direction:column;border-radius:8px;transition:background .15s}
.ivr.pin{background:var(--fs,var(--accent-s));box-shadow:inset 3px 0 0 var(--fc,var(--accent))}
.ivr.pin .iv{color:var(--text)}
.ct.fx{background:var(--text);color:#fff;border-color:var(--text);display:inline-flex;align-items:center;gap:3px}
.ct.fx svg{width:10px;height:10px}
.ivx{padding:0 10px 12px;display:flex;flex-direction:column;gap:8px;font-size:12.5px;line-height:1.5;color:var(--text2)}
.ivx b{display:block;font-size:11px;font-weight:600;letter-spacing:.3px;color:var(--text3)}
.ivx .na{color:var(--text3);font-style:italic}
.ivx .seen svg{width:14px;height:14px;flex:none}
.ivx .seen{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--fc,var(--accent))}
.ivr.on{background:var(--green-s)}
.apb{flex:none;margin:8px 6px 0 0;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--border2);background:var(--white);color:var(--text2);display:grid;place-items:center;cursor:pointer;transition:all .15s}
.apb:hover{border-color:var(--green);color:var(--green)}
.apb.on{background:var(--green);border-color:var(--green);color:#fff}
.apb svg{width:14px;height:14px}
.apk{position:absolute;left:0;top:0;z-index:4;pointer-events:none;display:inline-flex;align-items:center;gap:3px;background:var(--green);color:#fff;border:2px solid #fff;border-radius:12px;padding:1px 7px 1px 5px;font-size:11px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.25);will-change:transform}
.apk svg{width:11px;height:11px}
.design{position:absolute;right:14px;bottom:12px;z-index:5;display:inline-flex;white-space:nowrap;align-items:center;gap:8px;background:var(--green);color:#fff;border:0;border-radius:20px;padding:7px 14px 7px 10px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgba(26,110,60,.35)}
.design[hidden]{display:none}
.design svg{width:14px;height:14px;flex:none}
.design b{background:#fff;color:var(--green);border-radius:10px;padding:0 7px;font-size:11.5px}
.toast{position:absolute;left:50%;bottom:58px;transform:translate(-50%,10px);z-index:7;background:var(--text);color:#fff;border-radius:20px;padding:8px 16px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:80%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.dlap{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--green);background:var(--white);color:var(--green);border-radius:20px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;align-self:flex-start}
.dlap.on{background:var(--green);color:#fff}
.clr{border:0;background:none;color:var(--red);font-size:12.5px;cursor:pointer;padding:6px 10px}
.iv{display:flex;flex-direction:column;gap:5px;text-align:left;width:100%;border:0;background:none;border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.45;color:var(--text2);cursor:pointer}
.iv:hover{background:var(--fs,var(--accent-s));color:var(--text)}
.meta{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.ct{font-size:10px;font-weight:600;padding:0 6px;border-radius:2px;letter-spacing:.3px;line-height:1.7;border:1px solid}
.ct.lv{background:var(--neutral-s);color:var(--text2);border-color:var(--border)}
.ct.m{background:var(--amber-s);color:var(--amber);border-color:var(--amber-b)}
.ct.e{background:var(--green-s);color:var(--green);border-color:var(--green-b)}
.ct.w{background:var(--red-s);color:var(--red);border-color:var(--red-b)}
.ct.fn{background:var(--fs);color:var(--fc);border-color:transparent}
.hlist{display:flex;flex-direction:column;gap:2px;padding:6px 0}
.hrow{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;border-radius:10px;padding:9px 10px;cursor:pointer;text-align:left;font-size:13.5px;color:var(--text)}
.hrow:hover{background:var(--fs,var(--hover))}
.hrow .n{width:26px;height:26px;border-radius:50%;border:2px solid var(--fc);color:var(--fc);display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:none}
.hrow small{display:block;color:var(--text3);font-size:12px;font-weight:300;line-height:1.35}
.hrow .ar{margin-left:auto;color:var(--text3)}
.empty{padding:22px 12px;color:var(--text3);font-size:13.5px;text-align:center}
.back{border:0;background:none;color:var(--text3);font-size:12.5px;cursor:pointer;padding:0;margin:0 0 8px;display:inline-flex;align-items:center;gap:4px}
.back:hover{color:var(--text)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--text3);align-items:center;padding:12px 20px 16px;border-top:1px solid var(--border)}
.legend span{display:inline-flex;align-items:center;gap:5px}

/* dialog */
dialog{border:1px solid var(--border);padding:0;border-radius:20px;background:var(--white);color:var(--text);max-width:min(600px,calc(100vw - 32px));width:100%;box-shadow:0 16px 44px var(--shadow-card)}
dialog::backdrop{background:rgba(28,26,23,.45)}
.dl{display:flex;flex-direction:column;gap:12px;padding:24px 26px 26px}
.dl-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}

uik van binnenklimaatsensoren en monitoringsystemen.","w2":"Overdimensionering en pendelen van opwekkers worden verminderd.","n2":"Het binnencomfort kan in piekmomenten onvoldoende zijn."},{"t":"Apply good (biobased) insulation to the building to keep the heating requirement low, which means that smaller generation, distribution and delivery systems are required.","s":"d_building","c":"gen_all","f":"heating","l":"building","a":["c","r"],"g":["e"],"w":"Good insulation of the building keeps the heating requirement low, which means that smaller generation, distribution and delivery systems are required.","n":"Initially, this requires an increase in materials, which should be compensated through the elongated lifetime.","t2":"Isoleer het gebouw goed (biobased), zodat de warmtevraag laag blijft en kleinere opwek-, distributie- en afgiftesystemen nodig zijn.","w2":"Goede isolatie van het gebouw houdt de warmtevraag laag, waardoor kleinere opwek-, distributie- en afgiftesystemen nodig zijn.","n2":"Dit vraagt eerst om meer materiaal, wat moet worden gecompenseerd door de langere levensduur."},{"t":"Design installations more robust so that they break down less quickly and technicians can clean quickly and without damaging anything","s":"g_design","c":"gen_all","f":"heating","l":"product","a":["c","r"],"g":["m"],"w":"This will reduce premature failure and increase lifespan.","n":"Initially, this requires an increase in materials, which should be compensated through the elongated lifetime.","t2":"Ontwerp installaties robuuster, zodat ze minder snel stukgaan en monteurs snel en zonder schade kunnen reinigen","w2":"Dit vermindert voortijdige uitval en verlengt de levensduur.","n2":"Dit vraagt eerst om meer materiaal, wat moet worden gecompenseerd door de langere levensduur."},{"t":"Insulate the parapet when using radiators.","s":"d_building","c":"gen_all","f":"heating","l":"building","a":["c","r"],"g":["e"],"w":"This reduces heat losses.","n":"This will require extra initial materials. Use impact-calculations to evaluate the effectiveness of this intervention for your designed system.","t2":"Isoleer de borstwering bij gebruik van radiatoren.","w2":"Dit vermindert warmteverliezen.","n2":"Dit vraagt om extra materiaal vooraf. Gebruik impactberekeningen om de effectiviteit van deze ingreep voor jouw ontwerp te beoordelen."},{"t":"Request a minimum number of years warranty on products and parts.","s":"g_org","c":"gen_all","f":"heating","l":"product","a":["c","r"],"g":["m"],"w":"This will push suppliers to provide higher-quality and longer-lasting products.","n":"This will increase costs.","t2":"Vraag een minimaal aantal jaren garantie op producten en onderdelen.","w2":"Dit zet leveranciers aan tot producten van hogere kwaliteit die langer meegaan.","n2":"Dit verhoogt de kosten."},{"t":"Use standardized, smaller generation units in cascade systems to make reuse easier.","s":"reuse","c":"gen","f":"heating","l":"system","a":["c"],"g":["m"],"w":"More redundant systems, so less preventive maintenance required.","n":"Initially, this requires an increase in materials, which should be compensated through the elongated lifetime.","t2":"Gebruik gestandaardiseerde, kleinere opwekkers in cascadesystemen om hergebruik te vergemakkelijken.","w2":"Meer redundante systemen, dus minder preventief onderhoud nodig.","n2":"Dit vraagt eerst om meer materiaal, wat moet worden gecompenseerd door de langere levensduur."},{"t":"Reuse a central heating boiler in a hybrid system.","s":"repurpose","c":"gen","f":"heating","l":"product","a":["c","r"],"g":["m"],"w":"Using new materials is avoided.","n":"Reusing old components could lead to higher energy use than using newer, more energy-efficient components.","t2":"Hergebruik een cv-ketel in een hybride systeem.","w2":"Het gebruik van nieuwe materialen wordt vermeden.","n2":"Hergebruik van oude componenten kan leiden tot een hoger energieverbruik dan nieuwere, energiezuinigere componenten."},{"t":"Reuse used boilers from re  the system and makes use of renewable materials.","n":"Using biobased materials might reduce the durability. Evaluate whether this is the case.","t2":"Gebruik biobased isolatie voor leidingen.","w2":"Biobased isolatie in plaats van niet-biobased materialen verlaagt de gebonden CO2 van het systeem en maakt gebruik van hernieuwbare materialen.","n2":"Biobased materialen kunnen minder duurzaam zijn. Ga na of dit het geval is."},{"t":"Use change-over systems.","s":"reconsider","c":"dist","f":"heating","l":"system","a":["c","r"],"g":["m"],"w":"Installing a change-over system allows for adding a cooling system in the future.","n":"If the use scenario does not change, the added materials will not be used in the end.","t2":"Gebruik change-oversystemen.","w2":"Een change-oversysteem maakt het mogelijk om later koeling toe te voegen.","n2":"Als het gebruik niet verandert, worden de toegevoegde materialen uiteindelijk niet benut."},{"t":"Use water-based systems to reduce distribution materials.","s":"reconsider","c":"dist","f":"heating","l":"system","a":["c","r"],"g":["m"],"w":null,"n":"Water-based systems require (larger) terminal units.","t2":"Gebruik watergedragen systemen om distributiemateriaal te verminderen.","w2":null,"n2":"Watergedragen systemen vragen om (grotere) afgifte-units."},{"t":"Use decentralised systems to reduce the need for distribution.","s":"reconsider","c":"dist","f":"heating","l":"system","a":["c","r"],"g":["m","e"],"w":"Decentralised systems remove/reduce needed distribution. People have their own meter, which makes people more motivated to be mindful about their energy consumption.","n":"This will require extra initial materials. Use impact-calculations to evaluate the effectiveness of this intervention for your designed system.","t2":"Gebruik decentrale systemen om de benodigde distributie te verminderen.","w2":"Decentrale systemen maken distributie overbodig of beperken die. Bewoners hebben een eigen meter, wat hen motiveert bewust met energie om te gaan.","n2":"Dit vraagt om extra materiaal vooraf. Gebruik impactberekeningen om de effectiviteit van deze ingreep voor jouw ontwerp te beoordelen."},{"t":"Design distribution efficiently, place AHUs and mechanical exhausts centrally.","s":"reconsider","c":"dist","f":"heating","l":"system","a":["c","r"],"g":["m"],"w":"A central positioning reduces ducts and pipes.","n":null,"t2":"Ontwerp de distributie efficiënt, plaats LBK's en mechanische afzuiging centraal.","w2":"Een centrale plaatsing vermindert kanalen en leidingen.","n2":null},{"t":"Use standardized modules such as climate ceiling islands instead of custom-made climate ceilings.","s":"reconsider","c":"term","f":"heating","l":"product","a":["c"],"g":["m"],"w":"Standardized modules are easier to be reused and repaired after an initial lifetime.","n":null,"t2":"Gebruik gestandaardiseerde modules zoals klimaatplafondeilanden in plaats van maatwerkklimaatplafonds.","w2":"Gestandaardiseerde modules zijn na een eerste levensduur makkelijker te hergebruiken en te repareren.","n2":null},{"t":"Define terminal units based on cooling demand, not on heating demand.","s":"reconsider","c":"term","f":"heating","l":"system","a":["c"],"g":["m","e"],"w":null,"n":null,"t2":"Dimensioneer afgifte-units op de koelvraag, niet op de warmtevraag.","w2":null,"n2":null},{"t":"Use underfloor heating instead of radiators when a new distribution system needs to be installed.","s":"reconsider","c":"term","f":"heating","l":"system","a":["c","r"],"g":["e"],"w":"This makes heating with lower temperatures possible, therefore lowering energy demand.","n":"Underfloor heating is difficult to repair as components are often not easy to disassembly. A careful and robust design is therefore important.","t2":"Gebruik vloerverwarming in plaats van radiatoren als er een nieuw distributiesysteem nodig is.","w2":"Dit maakt verwarmen op lagere temperaturen mogelijk en verlaagt zo de energievraag.","n2":"Vloerverwarming is lastig te repareren omdat onderdelen vaak moeilijk te demonteren zijn. Een zorgvuldig en robuust ontwerp is daarom belangrijk."},{"t":"Use predictive maintenance instead of preventive maintenance.","s":"reconsider","c":"ctrl","f":"heating","l":"product","a":["c","r"],"g":["m","e"],"w":null,"n":null,"t2":"Gebruik voorspellend onderhoud in plaats van preventief onderhoud.","w2":null,"n2":null},{"t":"Use local control technology as much as possible (e.g. on the generator itself).","s":"reconsider","c":"ctrl","f":"heating","l":"system","a":["c","r"],"g":["m"],"w":null,"n":null,"t2":"Gebruik zoveel mogelijk lokale regeltechniek (bijv. op de opwekker zelf).","w2":null,"n2":null},{"t":"Limit the controllability per room. Controlling based on the sun's orientation is usually sufficient.","s":"reconsider","c":"ctrl","f":"heating","l":"system","a":["c","r"],"g":["m"],"w":null,"n":null,"t2":"Beperk de regelbaarheid per ruimte. Regelen op basis van de oriëntatie op de zon is meestal voldoende.","w2":null,"n2":null},{"t":"Take advantage of wireless, multi-functional sensors.","s":"reconsider","c":"ctrl","f":"heating","l":"product","a":["c","r"],"g":["m"],"w":null,"n":null,"t2":"Benut draadloze, multifunctionele sensoren.","w2":null,"n2":null},{"t":"Design with generic hardware and control more with software.","s":"reconsider","c":"ctrl","f":"heating","l":"product","a":["c","r"],"g":["m"],"w":"This is a form of standardisation which will allow for easier reuse after an initial lifetime.","n":null,"t2":"Ontwerp met generieke hardware en regel meer met software.","w2":"Dit is een vorm van standaardisatie die hergebruik na een eerste levensduur makkelijker maakt.","n2":null},{"t":"Request a minimum number of years of software support.","s":"reconsider","c":"ctrl","f":"heating","l":"product","a":["c","r"],"g":["m"],"w":"This will guarantee that hardware/products will not become obsolete due to outdated software.","n":"Certain hardware might not be compatible with new cybersecurity issues.","t2":"Vraag een minimaal aantal jaren softwareondersteuning.","w2":"Dit voorkomt dat hardware/producten verouderen door verouderde software.","n2":"Bepaalde hardware is mogelijk niet bestand tegen nieuwe cybersecurityrisico's."},{"t":"Make use of rented ('as a service') equipment, e.g. for a boiler.","s":"reconsider","c":"gen","f":"heating","l":"product","a":["c","r"],"g":["m"],"w":"As-a-service-equipment creates an incentive for suppliers to create long-lasting and repairable products.","n":null,"t2":"Maak gebruik van gehuurde apparatuur ('as a service'), bijvoorbeeld voor een ketel.","w2":"Apparatuur 'as a service' geeft leveranciers een prikkel om duurzame en repareerbare producten te maken.","n2":null},{"t":"Use filters to prevent pipe contamination (e.g. for magnetite).","s":"reconsider","c":"dist","f":"heating","l":"system","a":["c","r"],"g":["m"],"w":"The lifetime of pipes will be extended.","n":"Initially, this requires an increase in materials, which should be compensated through the elongated lifetime.","t2":"Gebruik filters om vervuiling van leidingen te voorkomen (bijv. door magnetiet).","w2":"De levensduur van leidingen wordt verlengd.","n2":"Dit vraagt eerst om meer materiaal, wat moet worden gecompenseerd door de langere levensduur."},{"t":"Use a more robust PCB and repairable electronics. (Often there's more than enough space; it's not a mobile phone.)","s":"reconsider","c":"ctrl","f":"heating","l":"product","a":["c","r"],"g":["m"],"w":"Increased robustness & repairability.","n":"Initially, this requires an increase in materials, which should be compensated through the elongated lifetime.","t2":"Gebruik een robuustere printplaat en repareerbare elektronica. (Er is vaak ruimte genoeg; het is geen mobiele telefoon.)","w2":"Grotere robuustheid en repareerbaarheid.","n2":"Dit vraagt eerst om meer materiaal, wat moet worden gecompenseerd door de langere levensduur."},{"t":"Use natural refrigerants.","s":"reconsider","c":"gen","f":"cooling","l":"component","a":["c","r"],"g":["m"],"w":"Natural refrigerants have a significantly lower GWP, which prevents environmental damage due to leakages.","n":"Do not get rid of well-functioning products before they have reached the end of their life in order to meet this intervention.","t2":"Gebruik natuurlijke koudemiddelen.","w2":"Natuurlijke koudemiddelen hebben een veel lagere GWP, wat milieuschade door lekkages voorkomt.","n2":"Doe goed functionerende producten niet weg voordat ze het einde van hun levensduur hebben bereikt, alleen om aan deze ingreep te voldoen."},{"t":"Implement changeover systems.","s":"reconsider","c":"dist","f":"cooling","l":"system","a":["r"],"g":["m"],"w":"This allows for adding an active cooling system in the future.","n":"If the use scenario does not change, the added materials will not be used in the end.","t2":"Pas change-oversystemen toe.","w2":"Dit maakt het mogelijk om later actieve koeling toe te voegen.","n2":"Als het gebruik niet verandert, worden de toegevoegde materialen uiteindelijk niet benut."},{"t":"Consider whether active cooling will be considered in the future. If so, avoid a mono-split system and install a multi-split system.","s":"reconsider","c":"dist","f":"cooling","l":"system","a":["c","r"],"g":["m"],"w":null,"n":null,"t2":"Ga na of actieve koeling in de toekomst aan de orde komt. Zo ja, vermijd een mono-splitsysteem en installeer een multi-splitsysteem.","w2":null,"n2":null},{"t":"Use water-based systems and/or decentralized systems to reduce distribution materials.","s":"reconsider","c":"dist","f":"cooling","l":"system","a":["c","r"],"g":["m"],"w":null,"n":null,"t2":"Gebruik watergedragen en/of decentrale systemen om distributiemateriaal te verminderen.","w2":null,"n2":null},{"t":"Reconsider whether humidification is necessary for a short period of the year.","s":"reconsider","c":"gen","f":"ventilation","l":"system","a":["c"],"g":["m","e"],"w":null,"n":null,"t2":"Heroverweeg of bevochtiging nodig is voor een korte periode van het jaar.","w2":null,"n2":null},{"t":"Eliminate heat recovery systems and bring back grilles, this saves installation materials and shaft space.","s":"reconsider","c":"gen","f":"ventilation","l":"system","a":["r"],"g":["m"],"w":"Distribution materials and HRU materials are reduced.","n":"Energy use needed for heating will increase. Use impact-calculations to evaluate whether the material reduction from this intervention weighs up to the increased impact in the operational phase for your designed system.","t2":"Laat warmteterugwinning weg en breng roosters terug; dit bespaart installatiemateriaal en schachtruimte.","w2":"Distributiematerialen en materialen voor de WTW-unit worden verminderd.","n2":"Het energieverbruik voor verwarming neemt toe. Gebruik impactberekeningen om te beoordelen of de materiaalbesparing opweegt tegen de hogere impact in de gebruiksfase van jouw ontwerp."},{"t":"Consider alternative (low-impact) materials for AHU housing.","s":"reconsider","c":"gen","f":"ventilation","l":"component","a":["c"],"g":["m"],"w":"Material impact will be reduced.","n":"Alternative materials could have a shorter lifespan. Evaluate whether this is the case.","t2":"Overweeg alternatieve materialen (met lage impact) voor LBK-behuizingen.","w2":"De materiaalimpact neemt af.","n2":"Alternatieve materialen kunnen een kortere levensduur hebben. Ga na of dit het geval is."},{"t":"Design adaptively to accommodate changes in space functions.","s":"reconsider","c":"gen","f":"ventilation","l":"system","a":["c"],"g":["m"],"w":"This allows for future changes, and prevents the need to add more materials in the future.","n":"If the use scenario does not change, the initially extra added materials will not be used in the end.","t2":"Ontwerp adaptief, zodat ruimten van functie kunnen veranderen.","w2":"Dit maakt toekomstige aanpassingen mogelijk en voorkomt dat er later extra materialen nodig zijn.","n2":"Als het gebruik niet verandert, worden de extra toegevoegde materialen uiteindelijk niet benut."},{"t":"Design ventilation boxes to be more robust (longer lifespan, better components).","s":"reconsider","c":"gen","f":"ventilation","l":"product","a":["r"],"g":["m"],"w":"This will reduce premature failure and increase lifespan.","n":"This will lead to a higher initial impact as a result of using more materials, which should be compensated through the elongated lifetime.","t2":"Ontwerp ventilatieboxen robuuster (langere levensduur, betere componenten).","w2":"Dit vermindert voortijdige uitval en verlengt de levensduur.","n2":"Dit geeft een hogere initiële impact door meer materiaalgebruik, wat moet worden gecompenseerd door de langere levensduur."},{"t":"Avoid taper-cutting air ducts. Avoiding tapers will increase material usage (due to larger diameters), but failure costs and energy costs are reduced, and flexibility and reuse opportunities are increased.","s":"reconsider","c":"dist","f":"ventilation","l":"product","a":["c"],"g":["m"],"w":null,"n":null,"t2":"Vermijd verjongingen in luchtkanalen. Zonder verjongingen is meer materiaal nodig (grotere diameters), maar faal- en energiekosten dalen en flexibiliteit en hergebruikmogelijkheden nemen toe.","w2":null,"n2":null},{"t":"Consider whether ductless or duct-poor solutions are possible.","s":"reconsider","c":"dist","f":"ventilation","l":"system","a":["r"],"g":["m"],"w":"Using new materials is avoided.","n":"Ductless or duct-poor solutions might require more generation units, which could lead to an increased environmental impact. Use impact-calculations to evaluate the effectiveness of this intervention for your designed system.","t2":"Ga na of kanaalloze of kanaalarme oplossingen mogelijk zijn.","w2":"Het gebruik van nieuwe materialen wordt vermeden.","n2":"Kanaalloze of kanaalarme oplossingen kunnen meer opwekkers vragen, wat de milieu-impact kan verhogen. Gebruik impactberekeningen om de effectiviteit van deze ingreep voor jouw ontwerp te beoordelen."},{"t":"Use detachable filters that can be changed at a measured pressure difference.","s":"reconsider","c":"dist","f":"ventilation","l":"component","a":["c","r"],"g":["m"],"w":null,"n":null,"t2":"Gebruik uitneembare filters die worden vervangen bij een gemeten drukverschil.","w2":null,"n2":null},{"t":"Use biobased materials.","s":"reconsider","c":"dist","f":"ventilation","l":"component","a":["c","r"],"g":["m"],"w":"Using biobased insulation rather than non-biobased materials often reduces the embodied carbon of the system and makes use of renewable materials.","n":"Using biobased materials might reduce the durability. Evaluate whether this is the case.","t2":"Gebruik biobased materialen.","w2":"Biobased isolatie in plaats van niet-biobased materialen verlaagt vaak de gebonden CO2 van het systeem en maakt gebruik van hernieuwbare materialen.","n2":"Biobased materialen kunnen minder duurzaam zijn. Ga na of dit het geval is."},{"t":"Reduce as much as possible by reconsidering opening windows.","s":"reconsider","c":"term","f":"ventilation","l":"system","a":["c","r"],"g":["m"],"w":"Using new materials is avoided.","n":"Using natural ventilation will increase the energy use of heating, or if ventilated insufficiently reduce the healthiness provided by the system.  Use impact-calculations to evaluate whether the material reduction from this intervention weighs up to the increased impact in the operational phase for your designed system.","t2":"Beperk zoveel mogelijk door te heroverwegen of ramen open kunnen.","w2":"Het gebruik van nieuwe materialen wordt vermeden.","n2":"Natuurlijke ventilatie verhoogt het energieverbruik voor verwarming, of verlaagt bij onvoldoende ventilatie de gezondheid van het binnenklimaat. Gebruik impactberekeningen om te beoordelen of de materiaalbesparing opweegt tegen de hogere impact in de gebruiksfase van jouw ontwerp."},{"t":"Use adaptive delivery systems.","s":"reconsider","c":"term","f":"ventilation","l":"product","a":["c","r"],"g":["m"],"w":null,"n":null,"t2":"Gebruik adaptieve afgiftesystemen.","w2":null,"n2":null},{"t":"Avoid mechanical components if possible.","s":"reconsider","c":"term","f":"ventilation","l":"component","a":["c","r"],"g":["m"],"w":"Mechanical components are more prone to wear and failure.","n":"Avoiding mechanical components and therefore changing to manual systems can increase operational energy use. Use impact-calculations to evaluate the effectiveness of this intervention for your designed system.","t2":"Vermijd waar mogelijk mechanische componenten.","w2":"Mechanische componenten zijn gevoeliger voor slijtage en uitval.","n2":"Mechanische componenten vermijden, en dus overstappen op handbediende systemen, kan het operationele energieverbruik verhogen. Gebruik impactberekeningen om de effectiviteit van deze ingreep voor jouw ontwerp te beoordelen."},{"t":"Apply predictive maintenance for filter contamination.","s":"reconsider","c":"ctrl","f":"ventilation","l":"product","a":["c","r"],"g":["m","e"],"w":"This ensures that maintenance happens (only) when it is necessary.","n":"Initially, this requires an increase in materials, which should be compensated by avoiding overusing maintenance materials.","t2":"Pas voorspellend onderhoud toe voor filtervervuiling.","w2":"Zo vindt onderhoud (alleen) plaats wanneer het nodig is.","n2":"Dit vraagt eerst om meer materiaal, wat moet worden gecompenseerd door minder overbodig gebruik van onderhoudsmaterialen."},{"t":"Reduce the vulnerability of controls (fire/valves).","s":"reconsider","c":"ctrl","f":"ventilation","l":"product","a":["c","r"],"g":["m"],"w":"This will reduce premature failure and increase lifespan.","n":"Initially, this requires an increase in materials, which should be compensated through the elongated lifetime.","t2":"Verminder de kwetsbaarheid van regelingen (brand/kleppen).","w2":"Dit vermindert voortijdige uitval en verlengt de levensduur.","n2":"Dit vraagt eerst om meer materiaal, wat moet worden gecompenseerd door de langere levensduur."},{"t":"Design with generic hardware solutions and control more with software.","s":"reconsider","c":"ctrl","f":"ventilation","l":"product","a":["c","r"],"g":["m"],"w":"This is a form of standardisation which will allow for easier reuse after an initial lifetime.","n":"Initially, this might require an increase in materials.","t2":"Ontwerp met generieke hardware-oplossingen en regel meer met software.","w2":"Dit is een vorm van standaardisatie die hergebruik na een eerste levensduur makkelijker maakt.","n2":"Dit kan eerst om meer materiaal vragen."},{"t":"Use more robust PCBs/electronics that are easier to repair. There's often plenty of room for this; it's not a mobile phone.","s":"reconsider","c":"ctrl","f":"ventilation","l":"component","a":["c","r"],"g":["m"],"w":"Product life of existing materials/products is prolongued.","n":"Initially, this might require an increase in materials.","t2":"Gebruik robuustere printplaten/elektronica die makkelijker te repareren zijn. Er is vaak ruimte genoeg; het is geen mobiele telefoon.","w2":"De levensduur van bestaande materialen/producten wordt verlengd.","n2":"Dit kan eerst om meer materiaal vragen."},{"t":"Use a dry underfloor system for heating and cooling instead of a wet underfloor system.","s":"reconsider","c":"term","f":"heating","l":"product","a":["c","r"],"g":["m","e"],"w":null,"n":null,"t2":"Gebruik een droog vloersysteem voor verwarming en koeling in plaats van een nat vloersysteem.","w2":null,"n2":null},{"t":"Add fans to the radiators.","s":"reconsider","c":"term","f":"heating","l":"system","a":["c","r"],"g":["e"],"w":null,"n":"This will emit fan noise.","t2":"Voeg ventilatoren toe aan de radiatoren.","w2":null,"n2":"Dit geeft ventilatorgeluid."}];

    document.querySelectorAll(`.ddb[data-dd="${g}"]`).forEach(b=>b.classList.toggle('act',act));
    document.querySelectorAll(`[data-cnt="${g}"]`).forEach(c=>c.textContent=act?`${S[g].size}/${ALL[g].length}`:'');});
  document.querySelectorAll('.fi').forEach(b=>b.setAttribute('aria-pressed',S[b.dataset.g].has(b.dataset.k)));
  document.querySelectorAll('.rreset').forEach(r=>r.hidden=!any);
}

function ivHTML(g,showFn){
  const t=L(), id=REG.push(g)-1;
  const lv=lvSort(g.ls).map(l=>`<span class="ct lv" title="${t.LV[l]}">${RN[l]}</span>`).join('');
  const go=(g.g.has('m')?`<span class="ct m">${t.tagM}</span>`:'')+(g.g.has('e')?`<span class="ct e">${t.tagE}</span>`:'');
  const fn=showFn?[...g.fs].map(f=>`<span class="ct fn f-${f}">${t.FN[f]}</span>`).join(''):'';
  const fk=fxOf(g.t), pin=S.pin===g.t;
  let ex='';
  if(pin){ const w=tx(g.src,'w'), n=tx(g.src,'n');
    ex=`<div class="ivx">${w?`<div><b>${t.why}</b><p>${esc(w)}</p></div>`:''}${n?`<div><b>${t.watch}</b><p>${esc(n)}</p></div>`:''}<button type="button" class="more" data-more="${id}">${t.more}</button></div>`; }
  return `<div class="ivr${pin?' pin':''}" data-fx="${fk||''}"><button type="button" class="iv" data-i="${id}" aria-expanded="${pin}"><span>${esc(tx(g.src,'t'))}</span></button>${ex}</div>`;
}
const legend=t=>`<div class="legend"><span><span class="ct lv">III</span>${t.lgLv}</span><span><span class="ct m">${t.tagM}</span><span class="ct e">${t.tagE}</span></span><span><span class="ct w">!</span>${t.lgW}</span></div>`;

function panel(){
  const t=L(), p=$('pop'), tip=$('tip'); REG.length=0; if(!p) return;
  const close=`<button type="button" class="px" data-h="" aria-label="${t.close}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`;
  p.dataset.mode='';
  if(S.q){
    const q=S.q.toLowerCase();
    const res=DATA.filter(it=>it.a.includes(S.b)&&passF(it)&&['t','w','n','t2','w2','n2'].map(k=>it[k]||'').join(' ').toLowerCase().includes(q));
    const gs=group(res);
    p.innerHTML=`<div class="ph"><div><div class="eb">${t.B[S.b][0]}</div><h2>${t.results}</h2><p>${gs.length} ${t.interventions}</p></div></div><div class="pb">${
      gs.length?HK.map(k=>{const sub=gs.filter(g=>inHot(g.src,k)); return sub.length?`<div class="grp-t">${t.H[k][0]}</div>`+sub.map(g=>ivHTML(g,true)).join(''):'';}).join(''):`<div class="empty">${t.noResults}</div>`}</div>`;
    p.dataset.mode='search'; p.hidden=false; place(); return;
  }
  if(S.view==='design'){ const set=AP[S.b]; const rows=DATA.filter(it=>it.a.includes(S.b)&&set.has(it.t)); const gs=group(rows);
    const st=p.scrollTop, keep=PANELKEY==='design'; PANELKEY='design';
    p.innerHTML=`<div class="ph"><div><div class="eb">${t.B[S.b][0]}</div><h2>${t.design}</h2><p>${gs.length} ${t.designSub}</p></div>${close}</div><div class="pb">${
      gs.length?HK.map(k=>{const sub=gs.filter(g=>inHot(g.src,k)); return sub.length?`<div class="grp-t">${t.H[k][0]}</div>`+sub.map(g=>ivHTML(g,true)).join(''):'';}).join('')+`<button type="button" class="clr" id="clr">${t.clearAll}</button>`:`<div class="empty">${t.designEmpty}</div>`}</div>`;
    p.dataset.mode='search'; p.hidden=false; tip.hidden=true; p.scrollTop=keep?st:0; return; }
  if(!S.f){ cap(t.capF); p.hidden=true; S3.setShift(0); return; }
  if(!S.h){ cap(t.capH); p.hidden=true; S3.setShift(0); return; }
  cap(t.capP);
  tip.hidden=true;
  const P=pool();
  const eb=`${t.B[S.b][0]} · ${t.FN[S.f]}`;
  const items=P.filter(it=>inHot(it,S.h));
  const keys=S.h==='gnl'?['g_design','g_org']:S.h==='ctx'?['d_context']:S.h==='bld'?['d_building']:RS;
  const gs=group(items);
  let body=keys.map(s=>{const sub=gs.filter(g=>g.s===s); return sub.length?`<div class="grp-t">${t.ST[s]}</div>`+sub.map(g=>ivHTML(g,false)).join(''):'';}).join('');
  p.innerHTML=`<div class="ph"><div><div class="eb">${eb}</div><h2>${t.H[S.h][0]}</h2><p>${gs.length} ${t.interventions}</p></div>${close}</div><div class="pb">${body||`<div class="empty">${t.none}</div>`}</div>`;
  const pk=S.b+S.f+S.h; const keep=pk===PANELKEY?p.scrollTop:0; PANELKEY=pk;
  p.dataset.mode=S.h==='gnl'?'gnl':'mk'; p.hidden=false; p.scrollTop=keep; place();
}
function place(){ const p=$('pop'); if(!p) return; const dock=!p.hidden&&window.innerWidth>700; S3.setShift(dock?p.offsetWidth/2:0); }
function cap(s){ const c=$('cap'); if(c) c.textContent=s; }

/* events */
function closeDD(except){document.querySelectorAll('.ddb[aria-expanded="true"]').forEach(b=>{if(b===except)return; b.setAttribute('aria-expanded','false'); $(b.getAttribute('aria-controls')).hidden=true;});}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDD(); if(S.h&&!document.querySelector('dialog[open]')){S.h=null;update();}}});
document.addEventListener('click',e=>{
  const el=e.target;
  const db=el.closest('.ddb');
  if(db){const m=$(db.getAttribute('aria-controls')), open=db.getAttribute('aria-expanded')!=='true'; closeDD(db);
    db.setAttribute('aria-expanded',open); m.hidden=!open;
    if(open){m.classList.remove('r'); const r=m.getBoundingClientRect(); if(r.right>window.innerWidth-12) m.classList.add('r');}
    return;}
  if(!el.closest('.ddm')) closeDD();
  const fi=el.closest('.fi'); if(fi){const s=S[fi.dataset.g],k=fi.dataset.k; s.has(k)?s.delete(k):s.add(k); update(); return;}
  if(el.closest('[data-reset]')){S.l=new Set(ALL.l);S.g=new Set(ALL.g);update();return;}
  const b=el.closest('[data-b]'); if(b){ S.pin=null; S.pinG=null; SHOWN=''; const nb=b.dataset.b; if(S.b!==nb){S.b=nb;S.h=null;} draw(); window.scrollTo({top:0,behavior:'smooth'}); return;}
  const f=el.closest('[data-f]'); if(f&&f.tagName==='BUTTON'&&!f.classList.contains('ivr')){ S.pin=null; S.pinG=null;S.f=f.dataset.f; S.h=null; draw(); return;}
  const hh=el.closest('[data-h]'); if(hh){const k=hh.dataset.h||null; S.view=null; S.pin=null; S.pinG=null; S.h=(k&&S.h===k)?null:k; update(); return;}
  const ab=el.closest('.apb'); if(ab){toggleAp(REG[+ab.dataset.ap].t); return;}
  if(el.closest('#design')){ S.view=S.view==='design'?null:'design'; S.h=null; update(); return;}
  if(el.closest('#clr')){ AP[S.b].clear(); saveAP(); S3.setEffects(S.b,new Set(),false); toast(L().toastOff); update(); return;}
  if(el.closest('#dlg-ap')){ if(DLG) toggleAp(DLG.t); return;}
  const mo=el.closest('[data-more]'); if(mo){openDlg(REG[+mo.dataset.more]); return;}
  const tv=el.closest('.tiv'); if(tv){openDlg(TREG[+tv.dataset.t]); return;}
  const vb=el.closest('[data-view]'); if(vb){ S.mode=vb.dataset.view; if(S.mode==='3d'&&!S.b) S.b='r'; S.h=null; S.pin=null; S.pinG=null; draw(); return;}
  const ta=el.closest('[data-ta]'); if(ta){ S.ta=ta.dataset.ta; draw(); return;}
  const tf=el.closest('[data-tf]'); if(tf){ S.tf=tf.dataset.tf; draw(); return;}
  const pt=el.closest('[data-tab]'); if(pt){ S.tab=pt.dataset.tab; drawTable(); return;}
  const iv=el.closest('.iv'); if(iv){ const g=REG[+iv.dataset.i]; S.pin=S.pin===g.t?null:g.t; S.pinG=S.pin?g:null; const k=fxOf(g.t); update(); if(S.pin&&k){ const c=S3.fxCenter(S.b,k); if(c) S3.flyTo(c); } else if(!S.pin){ const an=S3.anchors(S.b)[S.f]||{}; const p=S.h&&an[S.h]&&an[S.h]!=='fixed'?an[S.h]:null; S3.flyTo(p); } return;}
});
$('home').addEventListener('click',()=>{S.b=null;S.f=null;S.h=null;S.q='';$('q').value='';$('qx').hidden=true;draw();});
$('lang').addEventListener('click',()=>{S.lang=S.lang==='nl'?'en':'nl'; save(); draw();});
$('q').addEventListener('input',e=>{S.q=e.target.value.trim(); $('qx').hidden=!S.q; if(S.mode==='table') drawTable(); else if(S.q&&!S.b){S.b='r'; draw();} else if(S.b) update();});
$('qx').addEventListener('click',()=>{$('q').value='';S.q='';$('qx').hidden=true;if(S.b||S.mode==='table')update();$('q').focus();});

const dlg=$('dlg');
let DLG=null;
function dlgAp(){ const t=L(), on=AP[S.b].has(DLG.t), b=$('dlg-ap'); b.className='dlap'+(on?' on':''); b.innerHTML=(on?I.check:I.plus)+(on?t.applied:t.apply); }
function openDlg(g){
  const t=L(), it=g.src; DLG=g;
  const strat=t.ST[g.s];
  $('dlg-e').textContent=g.c&&g.c!=='gen_all'?`${strat} · ${t.CO[g.c]}`:strat;
  $('dlg-t').textContent=tx(it,'t');
  const a=DATA.filter(x=>x.t===g.t); const fs=new Set(a.map(x=>x.f)), ls=new Set(a.map(x=>x.l)), as=new Set(a.flatMap(x=>x.a)), gl=new Set(a.flatMap(x=>x.g));
  $('dlg-m').innerHTML=lvSort(ls).map(l=>`<span class="ct lv">${RN[l]} · ${t.LV[l]}</span>`).join('')+(gl.has('m')?`<span class="ct m">${t.tagM}</span>`:'')+(gl.has('e')?`<span class="ct e">${t.tagE}</span>`:'');
  const w=tx(it,'w'), n=tx(it,'n');
  $('dlg-w').textContent=w||t.noWhy; $('dlg-w').className=w?'':'na';
  $('dlg-n').textContent=n||t.noNeg; $('dlg-n').className=n?'':'na';
  const rows=[[t.kFn,[...fs].map(f=>t.FN[f]).join(', ')],[t.kLv,lvSort(ls).map(l=>t.LV[l]).join(', ')],[t.kCo,t.CO[g.c]],
    [/^[dg]_/.test(g.s)?t.kCat:t.kSt,strat],[t.kAp,[...as].sort().map(x=>t.AP[x]).join(', ')],[t.kGo,[...gl].map(x=>t.GO[x]).join(t.and)||t.notSpec]];
  $('dlg-kv').innerHTML=rows.map(([k,v])=>`<tr><th scope="row">${k}</th><td>${esc(v)}</td></tr>`).join('');
  if(dlg.showModal) dlg.showModal(); else dlg.setAttribute('open','');
}
$('dlg-x').addEventListener('click',()=>dlg.close());
dlg.addEventListener('click',e=>{if(e.target===dlg) dlg.close();});

S3.onPick(hk=>{ if(!S.f) return; S.view=null; S.pin=null; S.pinG=null; if(hk){ S.h=(S.h===hk)?null:hk; } else if(S.h){ S.h=null; } else return; update(); });
S3.onHover(hk=>{ document.querySelectorAll('.mk.hov').forEach(e=>e.classList.remove('hov')); if(hk){const e=$('mk-'+hk); if(e) e.classList.add('hov');} });
document.addEventListener('mouseover',e=>{ const r=e.target.closest&&e.target.closest('.ivr'); const ng=r?REG[+r.querySelector('.iv').dataset.i]:null; if(ng!==HOVG){ HOVG=ng; refreshFx(); }
const m=e.target.closest&&e.target.closest('.mk,.gnl'); if(m&&m.dataset.h&&m.dataset.h!=='gnl') S3.hover(m.dataset.h);});
document.addEventListener('mouseout',e=>{const m=e.target.closest&&e.target.closest('.mk'); if(m&&!(e.relatedTarget&&m.contains(e.relatedTarget))) S3.hover(null);});
try{THUMB.r=S3.thumb('r',960,600);THUMB.c=S3.thumb('c',960,600);}catch(e){}
draw();
addEventListener('resize',()=>{S3.resize();frame();});
const setH=()=>document.documentElement.style.setProperty('--head-h',($('head').offsetHeight+8)+'px');
setH(); addEventListener('resize',setH);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(setH);
})();
</script>
